<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>花人相関図 | 花人占術</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;700&family=Zen+Old+Mincho:wght@400;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px}
body{background:#f5f0e8;color:#1a1208;min-height:100vh}
.app{max-width:780px;margin:0 auto;padding:1.2rem 0.8rem 5rem}
.header{text-align:center;padding:1.5rem 0 1.2rem;border-bottom:1px solid rgba(184,134,11,0.3);margin-bottom:1.4rem}
.header h1{font-family:'Zen Old Mincho',serif;font-size:1.5rem;letter-spacing:0.25em;color:#b8860b}
.header p{font-size:0.82rem;color:#7a6b52;margin-top:0.4rem;line-height:1.8}
.back-link{display:inline-flex;align-items:center;gap:0.4rem;color:#b8860b;font-size:0.85rem;text-decoration:none;margin-bottom:1.2rem;padding:0.5rem 1rem;border:1px solid rgba(184,134,11,0.4);border-radius:20px}

/* グループタブ */
.group-tab-bar{display:flex;gap:0.5rem;overflow-x:auto;padding-bottom:0.3rem;margin-bottom:1.2rem;-webkit-overflow-scrolling:touch}
.group-tab-bar::-webkit-scrollbar{height:3px}
.group-tab-bar::-webkit-scrollbar-thumb{background:rgba(184,134,11,0.3);border-radius:2px}
.group-tab{flex-shrink:0;padding:0.55rem 1rem;font-family:'Zen Old Mincho',serif;font-size:0.85rem;border:1.5px solid rgba(184,134,11,0.4);border-radius:20px;background:#fff;color:#7a6b52;cursor:pointer;transition:all 0.15s;white-space:nowrap}
.group-tab.active{background:#b8860b;color:#fff;border-color:#b8860b}
.group-tab-add{flex-shrink:0;padding:0.55rem 1rem;font-size:0.85rem;border:1.5px dashed rgba(184,134,11,0.4);border-radius:20px;background:transparent;color:#b8860b;cursor:pointer;white-space:nowrap}

/* セクション */
.section{background:#fff;border:1px solid rgba(184,134,11,0.2);border-radius:12px;padding:1.2rem;margin-bottom:1.2rem;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.section-title{font-family:'Zen Old Mincho',serif;font-size:0.95rem;letter-spacing:0.15em;color:#b8860b;border-bottom:1px solid rgba(184,134,11,0.2);padding-bottom:0.5rem;margin-bottom:1rem}

/* 人物登録フォーム */
.person-form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0.8rem}
.person-form-card{background:#faf6ef;border:1px solid rgba(184,134,11,0.2);border-radius:10px;padding:0.9rem}
.person-form-card .pfc-label{font-size:0.72rem;color:#7a6b52;letter-spacing:0.1em;margin-bottom:0.5rem;display:flex;justify-content:space-between;align-items:center}
.person-form-card .pfc-label .remove-btn{font-size:0.7rem;color:#c0392b;cursor:pointer;padding:0.1rem 0.4rem;border:1px solid #c0392b;border-radius:10px;background:transparent}
.pfc-input{width:100%;font-size:0.9rem;padding:0.5rem 0.6rem;border:1px solid rgba(184,134,11,0.35);border-radius:6px;background:#fff;color:#1a1208;outline:none;margin-bottom:0.4rem}
.pfc-date-row{display:flex;gap:0.3rem;margin-bottom:0.4rem}
.pfc-date-row select{flex:1;font-size:0.82rem;padding:0.5rem 0.25rem;border:1px solid rgba(184,134,11,0.35);border-radius:6px;background:#fff;color:#1a1208;outline:none}
.pfc-select{width:100%;font-size:0.88rem;padding:0.5rem 0.6rem;border:1px solid rgba(184,134,11,0.35);border-radius:6px;background:#fff;color:#1a1208;outline:none}
.add-person-btn{width:100%;padding:0.65rem;font-family:'Zen Old Mincho',serif;font-size:0.88rem;border:1.5px dashed rgba(184,134,11,0.5);border-radius:10px;background:transparent;color:#b8860b;cursor:pointer;margin-top:0.5rem}
.calc-btn{width:100%;padding:1rem;font-family:'Zen Old Mincho',serif;font-size:1rem;letter-spacing:0.2em;background:linear-gradient(135deg,#b8860b,#d4a017);color:#fff;border:none;border-radius:10px;cursor:pointer;box-shadow:0 3px 12px rgba(184,134,11,0.3);margin-top:0.8rem}

/* 相関図エリア */
.diagram-wrap{position:relative;background:#fefcf7;border:1px solid rgba(184,134,11,0.15);border-radius:10px;overflow:hidden;margin-bottom:1rem}
.mark-btn,.sokatsu-btn,.card-btn{cursor:pointer}
.mark-btn:hover circle{r:17}
.sokatsu-btn:hover rect,.card-btn:hover rect{opacity:0.85}
/* ノート罫線背景 */
.diagram-wrap::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(transparent,transparent 39px,rgba(100,150,200,0.12) 39px,rgba(100,150,200,0.12) 40px);pointer-events:none;z-index:0}
.diagram-svg{width:100%;display:block;position:relative;z-index:1}

/* 人物カード（SVG foreignObject内） */
.person-node{background:#fff;border:2px solid #ccc;border-radius:8px;display:flex;flex-direction:column;align-items:center;padding:0.4rem 0.3rem;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.1);transition:transform 0.1s}
.person-node:active{transform:scale(0.97)}
.person-node .node-icon{width:44px;height:44px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;margin-bottom:0.25rem;font-weight:700;font-family:'Zen Old Mincho',serif}
.person-node .node-name{font-size:0.72rem;font-weight:700;color:#1a1208;text-align:center;line-height:1.3;max-width:60px;word-break:break-all}
.person-node .node-rokka{font-size:0.62rem;color:#7a6b52;text-align:center;margin-top:0.15rem}

/* 相性ラベル */
.compat-label-box{background:#e8e8e8;border-radius:4px;padding:0.18rem 0.45rem;font-size:0.72rem;font-weight:700;text-align:center;white-space:nowrap;cursor:pointer;border:1px solid rgba(0,0,0,0.1)}

/* ビュータブ */
.view-tabs{display:flex;border-bottom:1px solid rgba(184,134,11,0.25);margin-bottom:1rem}
.view-tab{flex:1;padding:0.65rem;text-align:center;font-family:'Zen Old Mincho',serif;font-size:0.88rem;color:#7a6b52;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.15s}
.view-tab.active{color:#b8860b;border-bottom-color:#b8860b}

/* 相性一覧リスト */
.compat-list{display:flex;flex-direction:column;gap:0.5rem}
.compat-list-item{display:flex;align-items:center;gap:0.6rem;padding:0.8rem 0.9rem;background:#faf6ef;border-radius:8px;border:1px solid rgba(184,134,11,0.15);cursor:pointer}
.cli-mark{font-size:1.2rem;font-weight:700;width:1.6rem;text-align:center;flex-shrink:0}
.cli-names{flex:1;font-size:0.9rem;color:#1a1208;line-height:1.6}
.cli-names .cli-pair{font-weight:700}
.cli-names .cli-ju{font-size:0.78rem;color:#7a6b52}
.cli-arrow{font-size:0.75rem;color:#b8860b;flex-shrink:0}

/* 相性詳細モーダル */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:#fff;border-radius:16px 16px 0 0;padding:1.5rem 1.2rem 2rem;max-height:80vh;overflow-y:auto;width:100%;max-width:780px}
.modal-handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 1.2rem}
.modal-title{font-family:'Zen Old Mincho',serif;font-size:1.05rem;color:#b8860b;margin-bottom:1rem;text-align:center}
.modal-compat-mark{font-size:2rem;text-align:center;margin-bottom:0.5rem}
.modal-comment{font-size:0.92rem;line-height:2;color:#1a1208;background:#faf6ef;border-radius:8px;padding:0.9rem 1rem;margin-bottom:1rem;font-style:italic}
.modal-detail-row{display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0;border-bottom:1px solid rgba(184,134,11,0.12);font-size:0.85rem;color:#4a3c28}
.modal-detail-row:last-child{border-bottom:none}
.modal-detail-label{color:#7a6b52;font-size:0.8rem}
.modal-close{width:100%;margin-top:1rem;padding:0.8rem;font-family:'Zen Old Mincho',serif;font-size:0.92rem;background:#f5f0e8;border:1px solid rgba(184,134,11,0.3);border-radius:8px;cursor:pointer;color:#4a3c28}

/* グループ追加モーダル */
.group-modal{background:#fff;border-radius:16px;padding:1.5rem;width:90%;max-width:380px}
.group-modal input{width:100%;font-size:0.95rem;padding:0.65rem 0.8rem;border:1px solid rgba(184,134,11,0.4);border-radius:6px;outline:none;margin-bottom:0.8rem}
.group-modal-btns{display:flex;gap:0.6rem}
.group-modal-btns button{flex:1;padding:0.75rem;font-family:'Zen Old Mincho',serif;font-size:0.9rem;border-radius:8px;cursor:pointer}
.group-modal-btns .confirm-btn{background:#b8860b;color:#fff;border:none}
.group-modal-btns .cancel-btn{background:#fff;color:#7a6b52;border:1px solid #ccc}

.error-msg{color:#c0392b;font-size:0.85rem;padding:0.5rem 0.8rem;background:#fff5f5;border-radius:6px;margin-top:0.5rem}
.hidden{display:none}
ruby rt{font-size:0.55em}
</style>
</head>
<body>
<div id="errmsg" style="background:#fff0f0;border:1px solid #c00;color:#900;border-radius:6px;padding:0.8rem 1rem;margin:0.8rem;font-size:0.85rem;display:none;position:sticky;top:0;z-index:200;word-break:break-all"></div>
<div class="app">
  <div class="header">
    <h1>花 人 相 関 図</h1>
    <p>人物を登録して、花人占術の相性を相関図で見る</p>
  </div>

  <a href="index.html" class="back-link">← 花人占術に戻る</a>

  <!-- グループタブ -->
  <div class="group-tab-bar" id="groupTabBar"></div>

  <!-- 入力セクション -->
  <div class="section" id="inputSection">
    <div class="section-title" id="groupTitle">◆ 人物登録</div>
    <div class="person-form-grid" id="personForms"></div>
    <button class="add-person-btn" onclick="addPersonForm()" id="addPersonBtn">＋ 人物を追加する（最大5人）</button>
    <div id="inputError" class="error-msg" style="display:none"></div>
    <button class="calc-btn" onclick="calcGraph()">🌸 相関図を生成する</button>
  </div>

  <!-- 結果 -->
  <div class="section hidden" id="resultSection">
    <div class="view-tabs" id="resultTabs">
      <div class="view-tab active" onclick="switchResultTab('canvas',this)">🗺 キャンバス</div>
      <div class="view-tab" onclick="switchResultTab('people',this)">👤 人物</div>
      <div class="view-tab" onclick="switchResultTab('relation',this)">❤ 関係</div>
    </div>
    <div id="tabCanvas">
      <div id="diagramWrap" style="position:relative;border:1px solid rgba(184,134,11,0.15);border-radius:10px;overflow:hidden;height:420px;background:#f5f0e8;touch-action:none;cursor:grab">
        <div id="stage" style="position:absolute;top:0;left:0;width:5000px;height:5000px;transform-origin:0 0;will-change:transform;">
        <svg id="ln" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:1"></svg>
        <div id="nodes-container" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2"></div>
        </div>
      </div>
      <p style="font-size:0.78rem;color:#7a6b52;text-align:center;margin:0.4rem 0 0.8rem">ドラッグで移動 / 矢印ラベルをタップで詳細</p>
    </div>
    <div id="tabPeople" class="hidden">
      <div id="peopleList" style="display:flex;flex-direction:column;gap:0.6rem"></div>
    </div>
    <div id="tabRelation" class="hidden">
      <div id="relationList" style="display:flex;flex-direction:column;gap:0.5rem"></div>
    </div>
  </div>
  <!-- 質問フェーズ -->
  <div class="section hidden" id="questionSection" style="margin-top:1rem">
    <div class="section-title">◆ 関係性について教えてください</div>
    <p style="font-size:0.85rem;color:#7a6b52;margin-bottom:1rem;line-height:1.8">より精細なアドバイスのために、今の状況を教えてください。</p>
    <div id="questionForms"></div>
    <button class="calc-btn" style="margin-top:0.8rem" onclick="getRelationAdvice()">🔮 AIに関係性のアドバイスを聞く</button>
  </div>

  <!-- AIアドバイス -->
  <div class="section hidden" id="adviceSection" style="margin-top:1rem">
    <div class="section-title">◆ 花人占術AIによる関係性アドバイス</div>
    <div id="adviceLoading" class="ai-loading" style="display:none">
      <span>🌸</span><span>鑑定中です<span class="dots"><span>.</span><span>.</span><span>.</span></span></span>
    </div>
    <div id="adviceText" class="ai-answer-box" style="display:none"></div>
    <div style="display:flex;gap:0.6rem;margin-top:0.8rem;flex-wrap:wrap">
      <button class="speak-btn" id="adviceSpeakBtn" onclick="speakAdvice(this)" style="display:none">🔊 読み上げ</button>
      <select id="adviceVoiceGender" style="font-size:0.82rem;padding:0.4rem 0.6rem;border:1px solid rgba(184,134,11,0.35);border-radius:6px;background:#faf6ef;color:#4a3c28;display:none">
        <option value="female">女性の声</option>
        <option value="male">男性の声</option>
      </select>
    </div>
    <div id="adviceChatArea" style="display:none;margin-top:1rem">
      <div id="adviceChatHistory" style="margin-bottom:0.6rem"></div>
      <div style="display:flex;gap:0.5rem;align-items:flex-end">
        <textarea id="adviceChatInput" rows="2" placeholder="さらに質問する..." style="flex:1;font-size:0.88rem;padding:0.55rem 0.7rem;border:1px solid rgba(184,134,11,0.4);border-radius:6px;background:#faf6ef;color:#1a1208;outline:none;resize:none;line-height:1.6"></textarea>
        <button onclick="sendAdviceChat()" style="padding:0.55rem 0.9rem;font-size:0.85rem;background:linear-gradient(135deg,#b8860b,#d4a017);color:#fff;border:none;border-radius:6px;cursor:pointer;white-space:nowrap">送信</button>
      </div>
      <div id="adviceChatLoading" class="ai-loading" style="display:none"><span>🌸</span><span>鑑定中<span class="dots"><span>.</span><span>.</span><span>.</span></span></span></div>
    </div>
    <div id="adviceCount" style="font-size:0.78rem;color:#7a6b52;text-align:right;margin-top:0.4rem"></div>
  </div>


<!-- テンプレート詳細ポップアップ -->
<div id="detail-popup" style="
  display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  background:#fff; border-radius:12px; padding:20px 24px; max-width:340px; width:92%;
  box-shadow:0 8px 32px rgba(0,0,0,0.18); z-index:200; font-family:'Noto Serif JP',serif;
">
  <div id="detail-title" style="font-size:0.85rem; margin-bottom:8px; font-weight:700;color:#b8860b"></div>
  <div id="detail-body" style="font-size:0.9rem; line-height:1.8; color:#333;"></div>
  <button onclick="closeDetail()" style="
    margin-top:16px; width:100%; padding:10px; border:none; border-radius:8px;
    background:#f5f0e8; color:#7a6b52; font-size:0.88rem; cursor:pointer;
  ">閉じる</button>
</div>
<div id="detail-overlay" onclick="closeDetail()" style="
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:199;
"></div>

<!-- 相性詳細モーダル -->
<div class="modal-overlay hidden" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-compat-mark" id="modalMark"></div>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-comment" id="modalComment"></div>
    <div id="modalDetails"></div>
    <button class="modal-close" onclick="closeModal()">閉じる</button>
  </div>
</div>

<!-- グループ追加モーダル -->
<div class="modal-overlay hidden" id="groupModalOverlay">
  <div class="group-modal">
    <div style="font-family:'Zen Old Mincho',serif;font-size:1rem;color:#b8860b;margin-bottom:1rem">グループ名を入力</div>
    <input type="text" id="groupNameInput" placeholder="例：家族、会社、友人" maxlength="10">
    <div class="group-modal-btns">
      <button class="cancel-btn" onclick="closeGroupModal()">キャンセル</button>
      <button class="confirm-btn" onclick="confirmAddGroup()">追加</button>
    </div>
  </div>
</div>

// ===== グローバルエラーキャッチ（index.htmlと同仕様） =====
window.onerror = function(msg, src, line, col, err) {
  var box = document.getElementById('errmsg');
  if (box) {
    box.textContent = '⚠ JS Error: ' + msg + ' [行' + line + ':' + col + ']';
    box.style.display = 'block';
    box.style.wordBreak = 'break-all';
  }
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  var box = document.getElementById('errmsg');
  if (box) {
    box.textContent = '⚠ 非同期エラー: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
    box.style.display = 'block';
  }
});
</script>

えがちで、打ち解けるまでに時間がかかる。マイペースで臨機応変な対応は苦手だが、一度信頼関係ができると誠意を尽くして動く。お世辞は言えず誤解されることもあるが、その責任感の強さが引き立てにつながる。おだてを見抜いて安易に乗らない堅実さも持ち合わせている。","恋愛":"突然のアタックには乗りにくく、相手を好きになるまでに時間がかかる。恋の駆け引きは不得意で、身近にいる相手に自然と惹かれていくタイプ。基本は受け身だが、ここぞという場面では正攻法で告白する。記念日を大切にし、一人の相手を思い続ける一途な恋愛スタイル。","弱点":"頑固になりすぎることが最大の課題。状況に応じて柔軟に対応する姿勢を身につけることが大切。見方を変え発想を転換できれば、大きな成功をつかめる。"},"剣鋒金":{"読み":"けんぼうきん","干支":["壬申","癸酉"],"性格":"鋭い閃きとシャープな感性に恵まれた、非凡な才能の持ち主。芸術家的な気質と強い正義感を持ち、改革者として力を発揮する。立ち振る舞いに無駄がなく鮮やかで、独自の美的哲学を内に持つ。表面はおおらかに見えるが、内心は自分の尺度で物事を判断する。発想の転換が得意で、その価値が認められて大きく成長していく人。","人間関係":"存在するだけで場の空気が変わる、静かな存在感の持ち主。普段は穏やかで無駄に攻撃しないが、必要なときはズバリと指摘し、一切ひるまない。正面から挑んでくる相手には真っ向からぶつかる。人に慕われ仰ぎ見られることが多い一方、感情に流されないクールな付き合いが得意。同志を大切にし、テンポの遅い相手にはいらつく面もある。","恋愛":"注目を集めやすくモテる存在。ドラマチックな恋愛を好み、一目惚れしやすくフィーリングを重視する。本音はなかなか見せず、察してくれる相手を求める。恋のピンチには弱く、面倒になると自分から距離を置く。自分のペースを崩さず、失恋しても立ち直りが早い。","弱点":"内に潜む短気な一面が課題。温かみのある表現と穏やかな気持ちを心がけることで、内外ともに丸くなれれば大きな成功をつかめる。"},"山頭火":{"読み":"さんとうか","干支":["甲戌","乙亥"],"性格":"ひときわ目立つ異色の存在。理想が高く、大きな目標を掲げる野心家。人と違う一面をアピールして差別化を図り、人知れず努力を重ねる。その裏には高いプライドが見え隠れする。感情の起伏が激しく怒りを爆発させることもあるが、孤独を愛するナルシストでもある。周囲からの支持を得ることで、本来の活躍の場が大きく広がっていく人。","人間関係":"カリスマ的な存在感を放ち、特別扱いされることを望む。近寄りがたい印象を与えることも多く、命令されることやこき使われるのを嫌う。相手を批判して理想論を語る一方、自分への批判はいつまでも忘れない。発言が周囲を唖然とさせることもあるが、いざという場面では頼られて担ぎ出されることが多い。","恋愛":"恋人への理想をはっきりと持っている。恋心を隠そうとするわりに周囲には気づかれやすく、自分からアプローチするのは苦手。恋が成就すると途端に冷静に相手を見始め、わがままを押しつける面も出てくる。恋が終わりに近づくと逆に情熱的になり、失恋からの立ち直りには時間がかかる。","弱点":"高すぎるプライドが壁になりやすい。時に折れる姿勢と、相手を受け入れる広い心が必要。実行力が伴えば人の上に立てる器を持っている。"},"澗下水":{"読み":"かんげすい","干支":["丙子","丁丑"],"性格":"実力本位の努力家で、自分のペースを貫きストイックに突き進む。器用さには欠けるが、ものをまとめ束ねる才能と抜群の記憶力を持つ。気性は激しくパワーにあふれるが、セルフコントロールは苦手。内面には保護されたい気持ちが潜んでいて、満たされない孤独感を抱えやすい。自分を神秘のベールで包むのが得意で、時流に乗ることで大きく伸びていく人。","人間関係":"叱咤激励が得意なボス的存在で、年下から慕われることが多い。対立を恐れずどんな相手にも向かっていく一方、同志は快く迎え入れる。年功序列より実力を重視し、自分のペースに人を巻き込みがち。強い姿勢を崩さず、親しくなるほど辛辣な態度や感情をぶつけることがある。言葉では語り尽くせない深い心の触れ合いを求めている。","恋愛":"フィーリングで恋をするミステリアスな存在。同じ方向を見つめる相手に惹かれ、自分から好きにならないと恋が始まらない。愛する人をわざと攻撃する言動をとることもあり、愛情表現の加減がつかめずうろたえることも。尽くすことで愛を示すタイプで、遊びと本気の間で揺れやすく、恋が終わってから自分の気持ちに気づくことも多い。","弱点":"何事も を重視し、愛する相手には精魂込めて尽くす。相手の心の変化を素早く見抜き、素直に謝られると何でも許す。同情から恋が生まれやすく、失恋しても立ち直りが早い。過去にこだわらないタイプ。","弱点":"人の良さが裏目に出やすい。受け入れて与えるだけが愛情ではなく、時に厳しく突き放す姿勢も必要。その瞬間に何が必要かを考え行動できれば、大きく伸びる人。"},"屋上土":{"読み":"おくじょうど","干支":["丙戌","丁亥"],"性格":"知的好奇心が強く物事を理性的に捉える理知的な人。感情を露骨に出さず、凝り性で自分の物差しで判断する。常にトップを目指し、人前では悠然と構えてあくせくした面を見せない。体裁を整えたい気持ちが内面に潜んでいるが、根は真面目で陰の努力を惜しまない。ブランドやネームバリューを大切にし、周囲に大きな影響を与え物事の流れさえ変える人。","人間関係":"ブラックユーモアに富んだ相当な皮肉屋。余裕のポーズを見せたがり、形式にこだわる。適正な距離を保ちながら広く浅く付き合い、信用するまでに時間がかかる。弱みを見せず、人に頼られると煩わしさを感じる。自分の非は認めずその場を取り繕うが、いざとなると冷淡な判断を下す合理主義者。","恋愛":"好みはうるさく遊びと本気を使い分ける。グループ交際から恋に発展させるのが得意で、知的な相手に惹かれる。相手の心を見抜くのが上手く、恋のプロセスを客観的に楽しむ。愛されたい気持ちは強いが、べたべたした付き合いは好まない。スマートな恋を望み後腐れなく付き合おうとする。","弱点":"何でも理性で片付けようとするのが課題。時には情熱を前面に出す積極的な姿勢が必要。自分の心の声に気づいて人間味を打ち出せれば成功をつかめる。"},"霹靂火":{"読み":"へきれきか","干支":["戊子","己丑"],"性格":"抜群の瞬発力と集中力を持ち、度胸があって恐れを知らず勇敢に立ち向かう。閃きに優れ一発勝負を好む自信家で、気迫に満ちた大物タイプ。目立つことへの意欲が強く、情熱的な面と冷静な面を併せ持つ。内面は感情の起伏が激しくわがままな一面も。正義感が強く曲がったことが許せない頑固さがある。圧倒的なパワーで脚光を浴びるスター性の持ち主。","人間関係":"その場を明るくする存在だが、意見が衝突すると相手の立場を気にせず食ってかかる。押しが強く簡単に妥協しない。普段は温厚でも怒ると怖い、ただし根には持たない。意表をつく発言で周囲を唖然とさせることも。無視されるのが嫌いでちやほやされたがり、親しい人の前では短気な一面が出やすい。","恋愛":"一目惚れから始まる恋が多く、情熱的になるがプライドが邪魔してアプローチできないことも。恋の駆け引きは苦手で、告白はダイレクトに相手にぶつかっていく。邪魔されるほど燃え上がり、嫉妬心が強く不安になると相手を振り回す。わがままをぶつけることで愛情を表現するが、一方的になりがちで喧嘩別れになりやすい。","弱点":"自己中心的な考え方が最大の課題。称賛や喝采に酔わず、独りよがりを慎むことが大切。冷静さを保ち続けられれば、存分に活躍できる人。"},"松柏木":{"読み":"しょうはくぼく","干支":["庚寅","辛卯"],"性格":"努力家で打たれ強く逆境を耐え抜く強さを持つ。節操を守り信じるものに一途で、一面では頑固でマイペース。リスクを避けて安全策を選びながらも、したたかさも持ち合わせる。自己成長への意欲が強く、年齢とともに風格が増していく。技や特技を時間をかけて熟成させ認められる大器晩成型。","人間関係":"打ち解けるまでに時間がかかり、立ち回りが得意でないため周囲から浮きやすい。持論を曲げずに我が道を行き、好き嫌いがはっきりしている。口うるさい面もあるが、誰に対しても同じスタンスで接する公平さがある。内面では尊敬され慕われることを望んでおり、家族や親子の絆を大切にする。","恋愛":"恋をすると一途で、時間をかけて愛を育てる。モラルを大切にし相手を包み込む度量を持つ。ドラマチックな展開を夢見るが現実はワンパターンになりがち。恋のピンチも自力で乗り越える自信があり、浮気はできないし許せないタイプ。自分に合わせてくれる相手を望む。","弱点":"強すぎる信念が視野を狭めることがある。方向性に誤りがないか常に確認する姿勢が大切。狭量さを手放して正しい信念を持てれば、根を広げて大成できる人。"},"長流水":{"読み":"ちょうりゅうすい","干支":["壬辰","癸巳"],"性格":"度量が大きく着眼点に優れ、物事を多角的に捉える。研究熱心で熟考するが、内面では相反する考えが交錯して葛藤しやすい。気性は激しく完璧を目指す深い内省力を持ち、独自の世界観と野心を持つ。慌ただしさが性に合い手を止めることを好まない。時流に乗れば多くの人に影響を与えて活躍できる人。","人間関係":"一見気難しい印象を与えがちだが、親しくなると人間的な魅力が溢れ出す。相手の長所と欠点を鋭く見抜き、人をまとめる才能に恵まれている。自分の意見を押し通す強さがある一方、うまくいかないと周囲に八つ当たりすることも。おおらかさと繊細さを両方持ち合わせている。","恋愛":"相当なロマンチストで、恋をすると相手にのめり込む。しかし恋心とは裏腹に無関心を装うことが多く、わざと捨て台詞を吐いて恋の芽を自ら摘んでしまうことも。自分からアプローチするのは苦手だが、愛する相手とは酸いも甘いも共にできる。愛情が深く絆を大切にするが、失恋からの立ち直りには時間がかかる。","弱点":"感情が激発しやすいのが最大の課題。楽観的に物事を捉える姿勢と気分転換の工夫が必要。穏やかな心を保ち続けられれば大きく羽ばたける人。"},"沙中金":{"読み":"さちゅうきん","干支":["甲午","乙未"],"性格":"何でも器用にこなすが、順応性にはやや欠ける。独創的で人と違うやり方を好み、豊かな才能を内に秘めている。冷めた目で物事を見るナイーブな一面があり、内心には競争心と猜疑心が宿る。後押しされると見事にやり遂げる力があり、人に見出されることで世界が広がり大きく伸びていく人。","人間関係":"人に頭を下げるのが苦手で、相手が自分の真意に気づくのを待つタイプ。深く理解してくれる人を求めるが、対立すると一人で思い悩む。急に内気になったり過剰な期待を寄せすぎることも。孤独感を抱きやすいが、特別扱いされると喜ぶ。人との出会いが人生を一変させることが多い。","恋愛":"恋をすると詩人になるほどのロマンチスト。華やかな恋をひそかに望むが、自分からはっきり告白しない。ただし気持ちを隠しきれず表情に出やすく、プレゼントなど態度で気持ちをアピールする。恋敵がいると情熱が燃え上がり、察しの良い相手を好む。愛する相手を束縛しがちで、失恋からの立ち直りには時間がかかる。","弱点":"猜疑心が最大の課題。禍福は表裏一体と捉えてプラス思考を大切にすること。積極的に物事に向かえば才能が見出される人。"},"山下火":{"読み":"さんげか","干支":["丙申","丁酉"],"性格":"物腰は穏やかで落ち着いているが、内に秘めたパワーは人一倍で相当な自信家。向上心と志が高く、本心を見せたがらないシャイな面がある。いったん怒り出すと止まらず、白黒はっきりつけたがる。好きなことには寝食を忘れて没頭し、活躍の場を見つければ広く影響を与える存在になれる人。","人間関係":"心優しくそつなく対応し、面倒見が良くて熱心。対立を恐れず売られた喧嘩は買う。意思のはっきりしない人にいらつき、親しい人の前では短気になりやすい。自分の気持ちを話したがらないため誤解されることも多く、思いつきで動くように見られやすい。","恋愛":"ドラマチックな恋を求め、恋をするとポーカーフェイスを保とうとするが心底では情熱に燃えている。なかなか気持ちを打ち明けないが、ある日突然熱烈なアプローチを開始する。一方的に思いをぶつける強引さがあり、恋の決着を早めにつけたがる。愛する相手にはわがままを出し、マンネリを嫌う。失恋しても立ち直りは早い。","弱点":"入り乱れる心が最大の課題。目標を一つに絞ってパワーを集中させる姿勢が大切。一点集中主義を守り精魂を込めれば大成できる人。"},"平地木":{"読み":"へいちぼく","干支":["戊戌","己亥"],"性格":"上品で気位が高く、常識的で規律を守り紳士的・淑女的に振る舞う。純粋でまっすぐな性格で快適な環境を求め、独特の美意識と完璧さへのこだわりを持つ。人目を気にして体裁を整えようとするが、内心ではワイルドさやナチュラルさへの強い憧れがある。与えられた環境の中で自分を活かしきれば、多くの人に仰ぎ見られる存在になれる人。","人間関係":"人と接する時は常に気を張って緊張するが、引き受けたことは完璧にこなして信頼される。人の欠点に目が行きやすくわざと意地を張ることもあるが、スマートな付き合いを心がける。弱みを見せず取り乱すことは少ないが、親しい人の前ではくつろいで脆さを見せる。","恋愛":"恋のムードに弱く恋に恋しやすい。絵になるカップルを目指し、理性的に順序立てて恋を進める。相手を振り回すことが多く、愛する人の前では子供のように甘えたりすねたりする。愛する以上に愛されたいタイプで、失恋すると悲劇のヒーロー・ヒロインとなり恋を美化する。","弱点":"高すぎる美意識が課題。緊張感を解いて、完璧でない部分も自分の魅力と認めることが大切。人間性を高めることでさらに成長できる人。"},"壁上土":{"読み":"へきじょうど","干支":["庚子","辛丑"],"性格":"粘り強く地道で実直、不屈の精神を持ち少々のことではへこたれない。責任感が強く守りに徹するポイントを押さえた行動をする。自分のパワーを信じて計画通りに物事を進め、時間をかけて学び取る現実主義者。自分を犠牲にしすぎることもあるが、方向さえ見誤らなければ人に尽くして社会に貢献できる人。","人間関係":"自分の役割に忠実で黙々とこなす。立場をはっきりさせたがり、情に厚く義理堅い。慕われるととことん面倒を見て守ろうとする。言葉が不足しがちで面白みに欠けることもあるが、外見より内容を重視する。人見知りしやすく自分のテリトリーを大切にする。","恋愛":"愛情深く包容力にあふれ、二人だけの時間と絆を大切にする。自分から愛したいタイプで、言葉より態度で愛情を表現する。好きになると粘り強くあきらめない。曖昧な関係は苦手で、愛する相手にはしつこくなりがち。恋の終わりはきっちりけじめをつけたがる。","弱点":"強すぎる責任感が課題。抱え込みすぎる弊害に気づき、気持ちにゆとりを持つことが大切。自分のキャパシティを知ることで伸びていける人。"},"金箔金":{"読み":"きんぱくきん","干支":["壬寅","癸卯"],"性格":"優雅でおしゃれ、美観を大切にする。人との出会いで運が開ける人で、ロマンを持ち続ける。自己主張は苦手で縁の下の力持ちに徹しがち。周囲に気を配って物事を抱え込みやすく、内面には不安な気持ちが渦巻いている。パワーを秘めているが自分の長所に気づかないことも多い。心身を鍛えることで重要な役割を担える人。","人間関係":"人付き合いが良く社交性に富み、どんなジャンルの人とも仲良くなれる。友好的な雰囲気を作るのが上手で、相手の良さを引き出して引き立てる役に回ることが多い。おだて上手でほめ上手。聞く耳を持ち人の意見に従う。どこにいても重宝がられるが、強引な相手には心を乱されて傷つきやすい。","恋愛":"恋のムードを大切にしてフィーリングで恋をする。思わせぶりな態度に出やすく恋の噂が先行しやすい。愛情表現は得意で、愛する相手を喜ばせようと一途に尽くす。相手のライフスタイルに合わせようとするが、恋のピンチになるとしだいに身を引いていく。","弱点":"度が過ぎる優しさが課題。気配りも過剰になると双方のためにならない。シビアな判断を持って対処できれば成功をつかめる人。"},"覆燈火":{"読み":"ふくとうか","干支":["甲辰","乙巳"],"性格":"周囲を明るくさせる人で、一芸に秀でている。目先のことにこだわりやすく大局を見落としがちだが、あやふやなことには手を出さず確信を持てば一直線に突き進む。得意不得意がはっきりしており、用心深さが行動の裏にある。特技を磨いてその分野でトップに上り詰める人。","人間関係":"人に安らぎを与え、面倒見が良く親切で自然と人を引き付ける。行きつけの場所を作るのが得意で家族思い。初対面では人見知りしやすく、人の気持ちを分析して把握したがる。自分の意見ははっきり言うが口論は避けたいタイプ。","恋愛":"恋には慎重で、手応えを感じてから動く。周囲に焚き付けられてその気になることもある。ひとたび行動を起こすと大胆にストレートにアタックし、一途に燃焼する。愛する相手の面倒をよく見るがやや押しつけがましい面も。恋心が冷め始めると急速に気持ちが冷え、失恋後の立ち直りは早い。","弱点":"野心のなさが課題。ハングリー精神を持ち、失敗を恐れずに羽ばたく意欲を持てば頭角を現せる人。"},"天河水":{"読み":"てんがすい","干支":["丙午","丁未"],"性格":"自分の気持ちに忠実で嘘がつけない。気まぐれで自分のペースで行動したがるが、個性を打ち出すのが上手な自信家。感情が豊かで同情深く、内面には激しい気性が潜む。器用で多才、実力に富んで疲れを見せない。周囲の期待に応えて成長すれば、多くの人に影響を与える存在になれる人。","人間関係":"人に希望を与え、信頼と期待を集める存在。親しい人にはルーズな面を見せることもあるが、多くの人に愛されるキャラクター。どこにいても目立つ。頼まれるとノーと言えずに尽力し、感謝されることを望む。状況判断に優れて人の心を見抜き、アドバイスが上手。","恋愛":"一目惚れする傾向があり深く愛したい一方で移り気な面も。情にほだされやすく、自分で思う以上にモテる。愛する相手の前ではわがままになりがちで相手を振り回しやすい。失恋すると落ち込みが激しい。","弱点":"気まぐれさとルーズさが課題。どれほど褒められても図に乗らず、真摯な姿勢を貫けば多くの人から仰ぎ見られる存在になれる人。"},"大駅土":{"読み":"たいえきど","干支":["戊申","己酉"],"性格":"知的好奇心が旺盛で上昇志向が高く、情報に敏感で先を読むのが得意。多芸多能で物怖じせず、自由を好んで合理的に物事を解釈する。ルールやモラルを大切にし、できるできないをはっきりさせたがる。内面には寂しがり屋な面もある。人を引きつける力が増すほど強いカリスマ性を発揮する人。","人間関係":"ソフトでスマートな付き合いを好み、理性的な対応を心がける。内面は意外にクールで、交友関係が広く誰とでも仲良くなれる。人を引きつけて中心的存在になることが多い一方、誘惑や悪友も近づきやすい。謙遜上手でおだても得意だが、羨望される反面、敵も多い。","恋愛":"シビアな目で恋を捉え、本気と遊びのけじめをつける。人を魅了してモテるが、相手の内面を見ようとする。純粋に愛されると弱い。恋をすると積極的にアプローチし、自分から離れていくことが多い。マンネリを嫌いフレッシュな関係を求める。","弱点":"旺盛すぎる上昇志向が課題。甘い言葉に惑わされず誘惑に負けないことが大切。方向さえ間違えなければ必ず成功できる人。"},"釵釧金":{"読み":"さいせんきん","干支":["庚戌","辛亥"],"性格":"華やかなムードを持ち場を明るくする、華やかな場所が似合う人。女性的な優しさと快楽志向があり、ステイタスを求める傾向が強い。情報収集に長けていて、表面は優しいが内面は意外にクール。物事を割り切って形式にこだわる。系統立てて学べば人の上に立てる人。","人間関係":"争いを好まず和を大切にし、場をまとめて仕切るのが得意。頂点に立つことが好きで、精神面より形式的な手順を重視しやすい。心と態度が裏腹になって片意地を張ることも多い。一流の人と交流を深めたがり、礼儀正しくて年上からの受けが良い。","恋愛":"おしゃれで楽しいムードの中から恋が生まれやすい。現実的に恋を捉え、リスクのある恋は最初からパスする。好みはうるさく相手の将来性・財力・立場を重視し、理知的な相手を求める。恋をすると自分からアプローチするが恋のピンチには弱い。恋の終わりは新たな恋の始まりになりやすい。","弱点":"形式へのこだわりが課題。例外を認めて相手を理解する姿勢を持つことが大切。心と気持ちのつながりを大切にすれば大きく活躍できる人。"},"桑柘木":{"読み":"そうしゃぼく","干支":["壬子","癸丑"],"性格":"多くの人に夢を与える存在。現実的に物事を捉えて行動に無駄がなく、しっかりとしたポリシーを持つ。内面は打たれ強く忍耐力に優れ、多くの才能をじっくりと磨いていく。スロースターターで思いつきで動くと失敗しやすいが、時間をかけるほど大物へと成長する大器晩成型。","人間関係":"人見知りしやすく打ち解けるまでに時間がかかるが、心を許した相手には面倒見が良い。説明不足で誤解されやすく、来るものは拒まず去るものは追わないスタンスを持つ。媚びず人に合わせるのは苦手だが、間接的に人を育てていく力がある。","恋愛":"恋の始まりになかなか気づかないタイプ。恋をすると自分の良さをアピールしながら、相手からのアプローチを密かに望む。深い結びつきを求めてまめに尽くすが、恋が実っても長続きしないことも。熱心に口説かれるとなびき、なかなか踏ん切りがつかずよりが戻ることもある。","弱点":"言葉不足に陥りやすいのが課題。意思の疎通は会話してこそ図れるもので、コミュニケーションを軽視すると落とし穴にはまる。誤解されずに成長し続ければ成功が約束されている人。"},"大渓水":{"読み":"たいけいすい","干支":["甲寅","乙卯"],"性格":"純粋で心優しく、自由を求めて活発に行動する。向上心が旺盛でライバル意識が強く、状況把握が得意。無理強いせず機が熟すのを待つが、内心では考えが錯綜して迷いが多い。親しい人に対しては感情の起伏が激しい。時間をかけて実力をつけ頭角を現す、大器晩成型。","人間関係":"表面上は相手に合わせながら、最終的には自分の方向に話を進めるのが得意。表立ってもめることは少なく、年下や弱者には親切。ただし親切心が競争心に変わりやすい。裏切られると激怒して仕返しを考え、突然横柄な態度に出て敵を作ることも。賛同者を増やすのが上手。","恋愛":"ダメージを恐れて恋には引っ込み思案。付き合う前に相手をよく観察してデータを集める。誠心誠意尽くされると弱く、自分に合わせてくれる相手を望む。本気で人を好きになることは少なく、束縛を嫌う。失恋しても立ち直りは意外と早い。","弱点":"波打つ感情が最大の課題。感情の落差は不信感を招きやすいため、コントロールする姿勢が必要。自分自身を鍛えていけば大成できる人。"},"沙中土":{"読み":"さちゅうど","干支":["丙辰","丁巳"],"性格":"スケールが大きく後腐れのないさっぱりした気性の持ち主。純粋な目で物事を捉え、負けん気が強くわざと強がって見せることが多い。裏側には孤独な気持ちと劣等感が潜んでいる。力強いものへの憧れを持ち、物怖じせず自分らしさをアピールする。粘りにはやや欠けるが、一つのことに打ち込んで大成できる人。","人間関係":"多面的な魅力にあふれ人の心を癒す存在。人前では弱さを見せない外剛内柔型だが、敵には容赦なく立ち向かう。自分自身がエンターテイナーで、面倒見は良いが人を育てるタイプではない。一線を画して付き合うことが多く、親しい人の前ではわがままになりやすい。","恋愛":"恋のパーフェクトさを求めて急発進はしない。相手の前で本音を切り出せず、態度で意思表示する。優しくされるとリアクションに戸惑い、情に溺れない。愛する相手には愛するがゆえに手厳しく、不安を感じると冷たい態度で反応をうかがう。恋のピンチには弱いが、失恋後の立ち直りは早い。","弱点":"劣等感が最大の課題。強さも弱さも自分の一部と受け入れ、隠さないことが大切。すべてをさらけ出すことで成功をつかめる人。"},"天上火":{"読み":"てんじょうか","干支":["戊午","己未"],"性格":"行動力と実行力を兼ね備えた熱血漢。一つのことに熱を上げ、どんな時も堂々と意見を述べて確信を持って行動する。頭の回転が速く先を見通し、ルールを守ろうとする。内面は寂しがり屋で、元気でパワフルな面を見せたがる。自分がしなければという意識が強く、おごらなければ多くの人に尊敬される人。","人間関係":"天下無敵の存在感でひときわ目立ち、中心的な役割を果たす。親分肌で親身に面倒を見るが、自分が良いと思うことを人に強制しがち。強引さが反感を買うこともある。親しい人の前では横柄になりやすく、尊敬できる人とできない人をはっきり区別する。影響力が強い。","恋愛":"華やかでドラマチックな出会いを望む。恋をすると相手の気持ちを読んでから行動し、オープンな交際を心がける。一方的なサービス精神を発揮しがちで、自分のペースで相手を振り回すことも。恋心が失せると相手を冷たくあしらい、失恋すると悲劇の主人公と化す。","弱点":"おごる心が最大の課題。自信とおごりは紙一重で、身勝手な振る舞いを慎む姿勢が必要。自分の力を信じながら謙虚でいられれば、人の上に立って活躍できる人。"},"石榴木":{"読み":"せきりゅうぼく","干支":["庚申","辛酉"],"性格":"純朴で誠実、好みがはっきりしている。思い込みが激しく決めつけることが多いが、弱音をはかない。その裏にはダメージを受けたくない気持ちが潜んでいる。自信のある分野では積極的に行動し、人知れず技を磨く努力家。実力を蓄えて花開く大器晩成型。","人間関係":"初対面ではとっつきにくい印象を与えやすく、好き嫌いが激しい。年功序列にこだわりすぎて実力のない年上を軽視しがち。馬が合う人との交流を求め、合わない人は避けようとする。人前では弱みを見せず、心安らぐ人にだけ素顔を見せてわがままになる。一人の時間を好む。","恋愛":"恋愛の先に結婚を見据えるタイプ。自分の恋心になかなか気づかず、アプローチをためらう。ポーカーフェイスを装いながら密かに情熱を燃やし、相手の気持ちを探ったうえで突然情熱的に動く。心の結びつきを求めて信頼関係を築こうとする。シークレットな交際や復活愛もあり得る人。","弱点":"警戒心が最大の課題。オープンマインドを心がけて人と協力し合うことで成長できると気づくことが大切。良き理解者と相談者に恵まれれば成功していく人。"},"大海水":{"読み":"たいかいすい","干支":["壬戌","癸亥"],"性格":"感情豊かで直観力に優れ、同情深く涙もろい。人情家で心優しくお人好し。太っ腹でたいていのことは寛大に対応するが、一面ルーズな面も。いったん怒ると一時的に意地を張る。子供っぽい面と大人らしい面を持ち合わせ、調子の良い時と悪い時の差が激しい。人や社会のために貢献することで成功をつかむ人。","人間関係":"人なつっこく多面的な魅力を持ち、どんなジャンルの人とも付き合える。縁を大切にして心のつながりを求め、相手の能力を引き出す。悩みを打ち明けられて人の心を癒す場面が多い。状況に流されやすいが、世渡り上手で人付き合いの遊泳術を心得ている。","恋愛":"恋のムードやシチュエーションにこだわる。照れ屋で最初の一歩がなかなか踏み出せず、言い寄られると弱い。相手の全てを愛して全てを許そうとし、愛する相手のために全力で行動する。愛の証と記念日を大切にするが、別れを切り出すのが苦手で失恋すると相当落ち込む。","弱点":"情に流されやすいのが最大の課題。情だけに縛られると前に進めない。割り切るべき時は割り切る姿勢と、感情と理性の両面から判断する力を身につければ大きく飛躍できる人。"}};

function getDaysFromSetsu(y,m,d){const bd=new Date(y,m-1,d),s=getSetsuDate(y,m),sD=new Date(s.getFullYear(),s.getMonth(),s.getDate());if(bd>=sD)return Math.round((bd-sD)/86400000);let pm=m-1,py=y;if(pm<1){pm=12;py--;}const ps=getSetsuDate(py,pm),psD=new Date(ps.getFullYear(),ps.getMonth(),ps.getDate());return Math.max(0,Math.round((bd-psD)/86400000));}
function getDayKS(y,m,d){const diff=Math.round((new Date(y,m-1,d)-new Date(1900,0,1))/86400000);return ROKUJU[((diff+10)%60+60)%60];}
function getYearKS(y,m,d){const bd=new Date(y,m-1,d),rs=getSetsuDate(y,2),rsD=new Date(rs.getFullYear(),rs.getMonth(),rs.getDate());return ROKUJU[(((bd>=rsD?y:y-1)-1984)%60+60)%60];}
function getMonthKS(y,m,d){const bd=new Date(y,m-1,d),s=getSetsuDate(y,m),sD=new Date(s.getFullYear(),s.getMonth(),s.getDate());let mo=m,yo=y;if(bd<sD){mo--;if(mo<1){mo=12;yo--;}}const rs=getSetsuDate(yo,2),rsD=new Date(rs.getFullYear(),rs.getMonth(),rs.getDate());const refY=new Date(yo,Math.max(0,mo-1),1)>=rsD?yo:yo-1;const yk=ROKUJU[((refY-1984)%60+60)%60];const mkBase=[2,4,6,8,0][JIKKAN.indexOf(yk[0])%5];const mo2=(mo<=0?mo+12:mo)===1?11:(mo<=0?mo+12:mo)-2;return JIKKAN[(mkBase+mo2)%10]+JUNISHI[(2+mo2)%12];}
function getZokan(shi,days){const col=ZOKAN_SHI.indexOf(shi);if(col<0)return '—';let k=ZOKAN_DATA[0][1][col];for(const[mn,arr]of ZOKAN_DATA){if(days>=mn)k=arr[col];}return k;}
function getJuniUnki(ht,shi){const s=TEISHI[ht];if(s===undefined)return '—';const si=JUNISHI.indexOf(shi);if(si<0)return '—';return JUNI_NAMES[(si-s+12)%12]||'—';}
function getRokkaJin(y,m,d){const dayKS=getDayKS(y,m,d);const name=HOSHI_BY_IDX[ROKUJU.indexOf(dayKS)];const nenKS=getYearKS(y,m,d);const num=ROKUJU.indexOf(nenKS)+1;return name+(num%2===1?'＋':'－');}

  var nZ=getZokan(nenShi,nDays),tZ=getZokan(tsuShi,nDays),niZ=getZokan(nichiShi,0);
  var ht=getRokkaJin(y,m,d);
  var nenN=getNayin(nenKS),tsuN=getNayin(tsuKS),nichiN=getNayin(nichiKS);
  var nenYY=getNayinYinYang(nenKS),tsuYY=getNayinYinYang(tsuKS),nichiYY=getNayinYinYang(nichiKS);

// 大運リスト取得
function getDaiunList(y,m,d,gender,tsuKS){
  var nenKS2=getYearKS(y,m,d);
  var nenNum=ROKUJU.indexOf(nenKS2)+1;
  var isYo=nenNum%2===1;
  var isFwd=(isYo&&gender==='男')||(!isYo&&gender==='女');
  var sa=getDaiunStartAge(y,m,d,isFwd);
  var tsuKanIdx=JIKKAN.indexOf(tsuKS[0]);
  var tsuShiIdx=JUNISHI.indexOf(tsuKS[1]);
  var dl=[];
  for(var i=0;i<=14;i++){
    var ki,si;
    if(isFwd){ki=(tsuKanIdx+i)%10;si=(tsuShiIdx+i)%12;}
    else{ki=((tsuKanIdx-i)%10+10)%10;si=((tsuShiIdx-i)%12+12)%12;}
    dl.push({ks:JIKKAN[ki]+JUNISHI[si],kan:JIKKAN[ki],shi:JUNISHI[si],startAge:sa+i*10});
  }
  return {dl:dl,sa:sa,isFwd:isFwd};
}

// 現在の年齢（歳）
function getAge(y,m,d){
  var today=new Date();
  var age=today.getFullYear()-y;
  var mm=today.getMonth()+1;
  var dd=today.getDate();
  if(mm<m||(mm===m&&dd<d)) age--;
  return age;
}

// 今年の年運（十二運気）
function getNenUnki(ht,targetYear,birthY,birthM,birthD){
  var nenKS=getYearKS(targetYear,2,15);
  var shi=nenKS[1];
  return {ju:getJuniUnki(ht,shi),ks:nenKS,shi:shi};
}

// 今月の月運（十二運気）
function getTsuUnki(ht,targetYear,targetMonth){
  var MONTH_SHI=['丑','寅','卯','辰','巳','午','未','申','酉','戌','亥','子'];
  var shi=MONTH_SHI[targetMonth-1];
  return {ju:getJuniUnki(ht,shi),shi:shi};
}

// 来年の年運
function getNextNenUnki(ht,targetYear){
  return getNenUnki(ht,targetYear+1,0,1,1);
}

// 現在の大運干支と次の大運
function getCurrentDaiun(y,m,d,gender,tsuKS){
  var res=getDaiunList(y,m,d,gender,tsuKS);
  var age=getAge(y,m,d);
  var currentDaiun=null,nextDaiun=null;
  for(var i=0;i<res.dl.length-1;i++){
    var start=res.dl[i].startAge;
    var end=res.dl[i+1].startAge;
    if(age>=start&&age<end){
      currentDaiun=res.dl[i];
      nextDaiun=res.dl[i+1];
      break;
    }
  }
  if(!currentDaiun&&res.dl.length>0){
    currentDaiun=res.dl[0];
    nextDaiun=res.dl[1]||null;
  }
  return {current:currentDaiun,next:nextDaiun};
}

// 今年・来年の各月運気（相性観点）
function getMonthlyUnkiYear(ht, year){
  var MONTH_SHI=['丑','寅','卯','辰','巳','午','未','申','酉','戌','亥','子'];
  var MONTH_LABELS=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  var badJuni=['内省','狂咲','引寒','休眠','残雪'];
  var goodJuni=['開花','豊穣','青葉','発芽','成天'];
  var results=[];
  for(var i=0;i<12;i++){
    var ju=getJuniUnki(ht,MONTH_SHI[i]);
    var tag=goodJuni.indexOf(ju)>=0?'◎':badJuni.indexOf(ju)>=0?'▲':'○';
    results.push(MONTH_LABELS[i]+':'+ju+'('+tag+')');
  }
  return results;
}

// 全体の現在運気サマリーをプロンプト用に生成
function buildCurrentUnkiSummary(p,name,birthY,birthM,birthD,gender){
  var TODAY=new Date();
  var CY=TODAY.getFullYear();
  var CM=TODAY.getMonth()+1;
  var age=getAge(birthY,birthM,birthD);
  var nenNow=getNenUnki(p.ht,CY,birthY,birthM,birthD);
  var nenNext=getNextNenUnki(p.ht,CY);
  var tsuNow=getTsuUnki(p.ht,CY,CM);
  var daiun=getCurrentDaiun(birthY,birthM,birthD,gender,p.tsuKS);
  var goodJuni=['発芽','青葉','開花','成天','豊穣','穂分','平凪'];
  var badJuni=['内省','狂咲','引寒','休眠','残雪'];
  function rating(j){return goodJuni.indexOf(j)>=0?'良':badJuni.indexOf(j)>=0?'要注意':'普通';}
  var monthlyThis=getMonthlyUnkiYear(p.ht,CY);
  var s='【'+name+'の現在の運気】\n';
  s+='年齢：'+age+'歳\n';
  s+='今年('+CY+'年)の運気：'+nenNow.ju+'（'+rating(nenNow.ju)+'）\n';
  s+='来年('+(CY+1)+'年)の運気：'+nenNext.ju+'（'+rating(nenNext.ju)+'）\n';
  s+='今月('+CM+'月)の運気：'+tsuNow.ju+'（'+rating(tsuNow.ju)+'）\n';
  if(daiun.current){
    var daiunJu=getJuniUnki(p.ht,daiun.current.shi);
    s+='現在の大運('+daiun.current.startAge+'歳〜)：'+daiun.current.ks+'（運気：'+daiunJu+'・'+rating(daiunJu)+'）\n';
  }
  if(daiun.next){
    var nextJu=getJuniUnki(p.ht,daiun.next.shi);
    s+='次の大運('+daiun.next.startAge+'歳〜)：'+daiun.next.ks+'（運気：'+nextJu+'・'+rating(nextJu)+'）\n';
  }
  s+='今年の月別運気：'+monthlyThis.join('、')+'\n';
  return s;
}
function getNayinCompat(n1,n2){
  if(NAYIN_COMPAT[n1]&&NAYIN_COMPAT[n1][n2]) return NAYIN_COMPAT[n1][n2];
  if(NAYIN_COMPAT[n2]&&NAYIN_COMPAT[n2][n1]) return NAYIN_COMPAT[n2][n1];
  return '';
}

// 個人視点のスコア（自分→相手）
function getPersonalScore(myHt,theirNenShi,theirTsuShi,theirNichiShi,theirHt,myNenShi){
  var goodJuni=['発芽','青葉','成天','豊穣','穂分','平凪'];
  var badJuni=['内省','狂咲','引寒','休眠','残雪'];
  function sj(j,otherJ){
    if(j==='開花') return badJuni.indexOf(otherJ)>=0?-1:1;
    return goodJuni.indexOf(j)>=0?1:badJuni.indexOf(j)>=0?-1:0;
  }
  var nenJu=getJuniUnki(myHt,theirNenShi);
  var tsuJu=getJuniUnki(myHt,theirTsuShi);
  var nichiJu=getJuniUnki(myHt,theirNichiShi);
  var otherNen=getJuniUnki(theirHt,myNenShi);
  // 年柱x2+月柱x1（日柱は深層なので相性スコアには含めない）
  return sj(nenJu,otherNen)*2+sj(tsuJu,nenJu);
}

function getPersonalLabel(score){
  if(score>=3) return {mark:'◎',color:'#1a6b3a',bg:'#e8f5e8',line:'#2a8c4a'};
  if(score>=1) return {mark:'○',color:'#2a5ca8',bg:'#e8eef5',line:'#4a7acc'};
  if(score===0) return {mark:'△',color:'#8a6800',bg:'#f5f0e0',line:'#b8a000'};
  return {mark:'▲',color:'#c0392b',bg:'#fde8e8',line:'#e05040'};
}

function getCompatScore(p1,p2){
  var s1=getPersonalScore(p1.ht,p2.nenShi,p2.tsuShi,p2.nichiShi,p2.ht,p1.nenShi);
  var s2=getPersonalScore(p2.ht,p1.nenShi,p1.tsuShi,p1.nichiShi,p1.ht,p2.nenShi);
  var nc=getNayinCompat(p1.nichiN,p2.nichiN);
  var bonus=0;
  if(/名コンビ|相性は抜群|言葉がなくても|心が通じ|最強|ベスト/.test(nc)) bonus=1;
  if(/水と油|腹立たしく|うんざり|手こずる/.test(nc)) bonus=-1;
  return s1+s2+bonus;
}

function getCompatLabel(score){
  if(score>=2) return {mark:'◎',color:'#1a6b3a',bg:'#e8f5e8',text:'相性抜群'};
  if(score>=1) return {mark:'○',color:'#2a5ca8',bg:'#e8eef5',text:'良好'};
  if(score>=0) return {mark:'△',color:'#8a6800',bg:'#f5f0e0',text:'普通'};
  if(score>=-1) return {mark:'▲',color:'#b85a00',bg:'#fdf0e0',text:'要注意'};
  return {mark:'✕',color:'#8b1a1a',bg:'#fde8e8',text:'注意必要'};
}

var GROUPS=[{id:0,name:'メイングループ',persons:[],result:null}];
var CURRENT_GROUP=0;

function renderGroupTabs(){
  var bar=document.getElementById('groupTabBar');
  bar.innerHTML='';
  GROUPS.forEach(function(g){
    var btn=document.createElement('button');
    btn.className='group-tab'+(g.id===CURRENT_GROUP?' active':'');
    btn.textContent=g.name;
    btn.onclick=function(){switchGroup(g.id);};
    bar.appendChild(btn);
  });
  var addBtn=document.createElement('button');
  addBtn.className='group-tab-add';
  addBtn.textContent='＋ グループ追加';
  addBtn.onclick=openGroupModal;
  bar.appendChild(addBtn);
}

function switchGroup(id){
  // 現在のフォームを保存
  saveCurrentForms();
  CURRENT_GROUP=id;
  renderGroupTabs();
  loadGroupForms();
  var g=GROUPS.find(function(x){return x.id===id;});
  document.getElementById('groupTitle').textContent='◆ '+g.name;
  if(g.result){
    showResult(g.result);
  } else {
    document.getElementById('resultSection').classList.add('hidden');
  }
}

function saveCurrentForms(){
  var g=GROUPS.find(function(x){return x.id===CURRENT_GROUP;});
  if(!g) return;
  g.persons=collectPersonForms();
}

function collectPersonForms(){
  var cards=document.querySelectorAll('.person-form-card');
  var persons=[];
  cards.forEach(function(card,idx){
    persons.push({
      name:card.querySelector('.pfc-name').value,
      y:card.querySelector('.pfc-y').value,
      m:card.querySelector('.pfc-m').value,
      d:card.querySelector('.pfc-d').value,
      gender:card.querySelector('.pfc-gender').value,
      role:card.querySelector('.pfc-role').value
    });
  });
  return persons;
}

function loadGroupForms(){
  var g=GROUPS.find(function(x){return x.id===CURRENT_GROUP;});
  var container=document.getElementById('personForms');
  container.innerHTML='';
  personCount=0;
  if(g.persons&&g.persons.length>0){
    g.persons.forEach(function(p){
      addPersonForm(p);
    });
  } else {
    // デフォルト：あなた＋相手1人
    addPersonForm({role:'あなた（本人）'});
    addPersonForm({role:'相手'});
  }
  updateAddBtn();
}

// ===== フォーム管理 =====
var personCount=0;

function addPersonForm(preset){
  if(personCount>=5) return;
  personCount++;
  var idx=personCount;
  var g=GROUPS.find(function(x){return x.id===CURRENT_GROUP;});
  var isFirst=(idx===1);
  var p=preset||{};
  var card=document.createElement('div');
  card.className='person-form-card';
  card.dataset.idx=idx;
  // 年セレクト生成
  var yearOpts='<option value="">年</option>';
  var cy=new Date().getFullYear();
  for(var y=cy;y>=1900;y--) yearOpts+='<option value="'+y+'"'+(p.y==y?' selected':'')+'>'+y+'年</option>';
  // 月セレクト
  var monOpts='<option value="">月</option>';
  for(var mo=1;mo<=12;mo++) monOpts+='<option value="'+mo+'"'+(p.m==mo?' selected':'')+'>'+mo+'月</option>';
  // 日セレクト
  var dayOpts='<option value="">日</option>';
  for(var dd=1;dd<=31;dd++) dayOpts+='<option value="'+dd+'"'+(p.d==dd?' selected':'')+'>'+dd+'日</option>';
  // 続柄
  var roles=['あなた（本人）','恋人・パートナー','配偶者','父','母','子','兄','姉','弟','妹','友人','職場の同僚','上司・先輩','部下・後輩'];
  var roleOpts=roles.map(function(r){return '<option value="'+r+'"'+(p.role===r?' selected':'')+'>'+r+'</option>';}).join('');
  card.innerHTML='<div class="pfc-label"><span>人物 '+idx+'</span>'
    +(isFirst?'':'<span class="remove-btn" onclick="removePersonForm(this)">削除</span>')
    +'</div>'
    +'<input class="pfc-input pfc-name" type="text" placeholder="名前（任意）" maxlength="10" value="'+(p.name||'')+'">'
    +'<div class="pfc-date-row">'
    +'<select class="pfc-y">'+yearOpts+'</select>'
    +'<select class="pfc-m">'+monOpts+'</select>'
    +'<select class="pfc-d">'+dayOpts+'</select>'
    +'</div>'
    +'<select class="pfc-select pfc-gender"><option value="男">男（陽）</option><option value="女"'+(p.gender==='女'?' selected':'')+'>女（陰）</option></select>'
    +'<select class="pfc-select pfc-role" style="margin-top:0.4rem">'+roleOpts+'</select>';
  document.getElementById('personForms').appendChild(card);
  updateAddBtn();
}

function removePersonForm(btn){
  var card=btn.closest('.person-form-card');
  card.remove();
  personCount--;
  // 番号振り直し
  document.querySelectorAll('.person-form-card').forEach(function(c,i){
    c.dataset.idx=i+1;
    c.querySelector('.pfc-label span:first-child').textContent='人物 '+(i+1);
  });
  updateAddBtn();
}

function updateAddBtn(){
  var btn=document.getElementById('addPersonBtn');
  btn.style.display=personCount>=5?'none':'block';
}

function renderMarkdown(t){
  if(!t) return "";
  var h3s="font-size:1rem;color:#b8860b;margin:1rem 0 0.5rem;padding-bottom:0.3rem;border-bottom:1px solid rgba(184,134,11,0.25)";
  var h4s="font-size:0.92rem;color:#4a3c28;margin:0.8rem 0 0.4rem;font-weight:700";
  t=t.replace(/^## (.+)$/gm,function(m,g){return "<h3 style=\""+h3s+"\">"+g+"</h3>";});
  t=t.replace(/^### (.+)$/gm,function(m,g){return "<h4 style=\""+h4s+"\">"+g+"</h4>";});
  t=t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  t=t.replace(/^\d+\. (.+)$/gm,"<div style=\"display:flex;gap:0.4rem;margin:0.3rem 0;line-height:1.8\"><span style=\"color:#b8860b;font-weight:700;flex-shrink:0\">•</span><span>$1</span></div>");
  t=t.replace(/^\* (.+)$/gm,"<div style=\"display:flex;gap:0.4rem;margin:0.25rem 0;line-height:1.8\"><span style=\"color:#b8860b;flex-shrink:0\">・</span><span>$1</span></div>");
  t=t.replace(/\n\n/g,"</p><p style=\"margin:0.5rem 0;line-height:1.9\">");
  t=t.replace(/\n/g,"<br>");
  return "<div style=\"font-size:0.9rem;line-height:1.9;color:#1a1208\">"+t+"</div>";
}

function showError(msg){

  setTimeout(function(){el.style.display='none';},5000);
}

  var valid=true;
  var errName='';
  cards.forEach(function(card,ci){
    var y=+card.querySelector('.pfc-y').value;
    var m=+card.querySelector('.pfc-m').value;
    var d=+card.querySelector('.pfc-d').value;
    var name=card.querySelector('.pfc-name').value||('人物'+(ci+1));
    var gender=card.querySelector('.pfc-gender').value;
    var role=card.querySelector('.pfc-role').value;
    if(!y||!m||!d){
      valid=false;
      errName=name;
      // カードをハイライト
      card.style.border='1.5px solid #c0392b';
      card.style.background='#fff5f5';
    } else {
      card.style.border='';
      card.style.background='';
    }
    if(!valid&&y&&m&&d) return;
    if(valid||y&&m&&d){
      try{
        var pp=calcPerson(y,m,d,gender);
        pp.name=name;pp.role=role;
        persons.push(pp);
      }catch(e){
        valid=false;errName=name;
      }
    }
  });
  // 再チェック
  persons=[];
  valid=true;
  cards.forEach(function(card,ci){
    var y=+card.querySelector('.pfc-y').value;
    var m=+card.querySelector('.pfc-m').value;
    var d=+card.querySelector('.pfc-d').value;
    var name=card.querySelector('.pfc-name').value||('人物'+(ci+1));
    var gender=card.querySelector('.pfc-gender').value;
    var role=card.querySelector('.pfc-role').value;
    if(!y||!m||!d){valid=false;return;}
    var pp=calcPerson(y,m,d,gender);
    pp.name=name;pp.role=role;
    persons.push(pp);
  });
  if(persons.length<2){
    showError('生年月日を入力できた人物が2人未満です。すべて入力してください。');
    return;
  }
  if(!valid){
    showError('すべての人物の生年月日を入力してください。赤くなっているカードを確認してください。');
    return;
  }
  // 全ペアの相性を計算
  var pairs=[];
  for(var i=0;i<persons.length;i++){
    for(var j=i+1;j<persons.length;j++){
      var score=getCompatScore(persons[i],persons[j]);
      var label=getCompatLabel(score);
      var comment=getNayinCompat(persons[i].nichiN,persons[j].nichiN);
      var nenJu1=getJuniUnki(persons[i].ht,persons[j].nenShi);
      var nenJu2=getJuniUnki(persons[j].ht,persons[i].nenShi);
      var tsuJu1=getJuniUnki(persons[i].ht,persons[j].tsuShi);
      var tsuJu2=getJuniUnki(persons[j].ht,persons[i].tsuShi);
      var nichiJu1=getJuniUnki(persons[i].ht,persons[j].nichiShi);
      var nichiJu2=getJuniUnki(persons[j].ht,persons[i].nichiShi);
      // 個人視点のスコアとラベル
      var score1=getPersonalScore(persons[i].ht,persons[j].nenShi,persons[j].tsuShi,persons[j].nichiShi,persons[j].ht,persons[i].nenShi);
      var score2=getPersonalScore(persons[j].ht,persons[i].nenShi,persons[i].tsuShi,persons[i].nichiShi,persons[i].ht,persons[j].nenShi);
      var label1=getPersonalLabel(score1);
      var label2=getPersonalLabel(score2);
      pairs.push({i:i,j:j,score:score,label:label,label1:label1,label2:label2,comment:comment,nenJu1:nenJu1,nenJu2:nenJu2,tsuJu1:tsuJu1,tsuJu2:tsuJu2,nichiJu1:nichiJu1,nichiJu2:nichiJu2});
    }
  }
  var result={persons:persons,pairs:pairs};
  var g=GROUPS.find(function(x){return x.id===CURRENT_GROUP;});
  if(g) g.result=result;
  showResult(result);
}

var camX=0,camY=0,camScale=1;
var dDN=null,dDTId=null,dDSX=0,dDSY=0,dDNSX=0,dDNSY=0;
var dndMoved=false,dragMode=null;
var activeTouches={};

function initDiagramEngine(nodes,edges){
  diagNodes=nodes; diagEdges=edges;
  var wrap=document.getElementById('diagramWrap');
  var svgEl=document.getElementById('ln');
  var nc=document.getElementById('nodes-container');
  if(!wrap||!svgEl||!nc) return;
  nc.querySelectorAll('.dnd,.dmemo').forEach(function(el){el.remove();});
  camX=0; camY=0; camScale=1; updateStageTransform();

  var R=38, OFFSET=12;
  var CL_D=[
    {bg:'#e8eef5',tx:'#1a2a7a',st:'#4a7acc'},
    {bg:'#e8f0e4',tx:'#2d5a1b',st:'#5a8c3a'},
    {bg:'#f5e8e8',tx:'#7a1a1a',st:'#c04040'},
    {bg:'#e8ecf5',tx:'#1a2a7a',st:'#5a6abf'},
    {bg:'#eef5e8',tx:'#3a6b1a',st:'#7aaa4a'},
    {bg:'#ebebf5',tx:'#2b2b7a',st:'#6b6bbf'}
  ];
  var MC={red:'#c04040',orange:'#b8a000',green:'#2a8c4a',blue:'#4a7acc',gray:'#aaa'};

  function hasPair(e){return diagEdges.some(function(o){return o.id!==e.id&&o.from===e.to&&o.to===e.from;});}

  // ===== SVG描画（Gemini最新版: groupでカメラ変換） =====
  function renderEdgesD(){
    svgEl.innerHTML='';
    var defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
    Object.keys(MC).forEach(function(n){
      var mk=document.createElementNS('http://www.w3.org/2000/svg','marker');
      mk.setAttribute('id','ar-'+n);mk.setAttribute('markerWidth','8');mk.setAttribute('markerHeight','8');
      mk.setAttribute('refX','6');mk.setAttribute('refY','3');mk.setAttribute('orient','auto');
      var mp=document.createElementNS('http://www.w3.org/2000/svg','path');
      mp.setAttribute('d','M0,0 L0,6 L8,3 z');mp.setAttribute('fill',MC[n]);
      mk.appendChild(mp);defs.appendChild(mk);
    });
    svgEl.appendChild(defs);
    // groupなし: svgElに直接描画（stageがCSS変換するので座標変換不要）
    diagEdges.forEach(function(e){
      var fn=diagNodes.find(function(n){return n.id===e.from;});
      var tn=diagNodes.find(function(n){return n.id===e.to;});
      if(!fn||!tn) return;
      var dx=tn.x-fn.x,dy=tn.y-fn.y,d=Math.sqrt(dx*dx+dy*dy)||1;
      var nx=-dy/d,ny=dx/d,paired=hasPair(e);
      var ox=paired?nx*OFFSET:0,oy=paired?ny*OFFSET:0;
      var x1=fn.x+(dx/d)*R+ox,y1=fn.y+(dy/d)*R+oy;
      var x2=tn.x-(dx/d)*(R+9)+ox,y2=tn.y-(dy/d)*(R+9)+oy;
      var lbl=e.label||'',lColor='#aaa',mid='gray';
      if(lbl.indexOf('◎')>=0){lColor='#2a8c4a';mid='green';}
      else if(lbl.indexOf('○')>=0){lColor='#4a7acc';mid='blue';}
      else if(lbl.indexOf('▲')>=0){lColor='#b8a000';mid='orange';}
      else if(lbl.indexOf('✕')>=0||lbl.indexOf('×')>=0){lColor='#c04040';mid='red';}
      var line=document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',x1);line.setAttribute('y1',y1);
      line.setAttribute('x2',x2);line.setAttribute('y2',y2);
      line.setAttribute('stroke',lColor);line.setAttribute('stroke-width','2');
      line.setAttribute('marker-end','url(#ar-'+mid+')');
      svgEl.appendChild(line);
      if(lbl){
        var lOx=paired?nx*16:0,lOy=paired?ny*16:0;
        var mx=(x1+x2)/2+lOx,my=(y1+y2)/2+lOy,tw=lbl.length*11+28,fh=26;
        var hit=document.createElementNS('http://www.w3.org/2000/svg','rect');
        hit.setAttribute('x',mx-tw/2-8);hit.setAttribute('y',my-fh/2-8);
        hit.setAttribute('width',tw+16);hit.setAttribute('height',fh+16);
        hit.setAttribute('fill','transparent');
        hit.setAttribute('style','pointer-events:visiblePainted;cursor:pointer');
        (function(ee,c){
          hit.onclick=function(ev){ev.stopPropagation();showDiagDetail(ee.label,ee.detail||'',c);};
          hit.ontouchstart=function(ev){ev.stopPropagation();ev.preventDefault();showDiagDetail(ee.label,ee.detail||'',c);};
        })(e,lColor);
        svgEl.appendChild(hit);
        var bg=document.createElementNS('http://www.w3.org/2000/svg','rect');
        bg.setAttribute('x',mx-tw/2);bg.setAttribute('y',my-fh/2);
        bg.setAttribute('width',tw);bg.setAttribute('height',fh);
        bg.setAttribute('rx','13');bg.setAttribute('fill','#fff');
        bg.setAttribute('stroke',lColor);bg.setAttribute('stroke-width','1.8');
        bg.setAttribute('pointer-events','none');
        svgEl.appendChild(bg);
        var tx=document.createElementNS('http://www.w3.org/2000/svg','text');
        tx.setAttribute('x',mx);tx.setAttribute('y',my+5);tx.setAttribute('text-anchor','middle');
        tx.setAttribute('fill',lColor);tx.setAttribute('font-size','12');tx.setAttribute('font-weight','600');
        tx.setAttribute('pointer-events','none');
        tx.setAttribute('font-family','-apple-system,Hiragino Sans,sans-serif');
        tx.textContent=lbl;svgEl.appendChild(tx);
      }
    });
  }

  function syncNodesDOMD(){
    diagNodes.forEach(function(n){
      var el=document.getElementById('dnd'+n.id);
      var memo=document.getElementById('dmemo'+n.id);
      var c=CL_D[n.color||0];
      if(!el){
        el=document.createElement('div');el.className='dnd';el.id='dnd'+n.id;
        el.style.cssText='position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;text-align:center;user-select:none;-webkit-user-select:none;touch-action:none;pointer-events:auto;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,0.1)';
        nc.appendChild(el);
      }
      if(!memo){
        memo=document.createElement('div');memo.id='dmemo'+n.id;memo.className='dmemo';
        memo.style.cssText='position:absolute;font-size:12px;font-weight:700;color:#3a2a00;text-align:center;pointer-events:none;white-space:nowrap;z-index:4;transform:translate(-50%,0);letter-spacing:0.02em';
        nc.appendChild(memo);
      }
      el.style.width=(R*2)+'px';el.style.height=(R*2)+'px';
      el.style.left=(n.x-R)+'px';el.style.top=(n.y-R)+'px';
      el.style.background=c.bg;el.style.border='2.5px solid '+c.st;el.style.color=c.tx;
      el.textContent=n.name.length>4?n.name.slice(0,4)+'\u2026':n.name;
      memo.style.left=n.x+'px';memo.style.top=(n.y+R+5)+'px';
      memo.textContent=n.memo||'';
    });
  }

  // ===== Gemini最新版タッチエンジン（endDragで完全リセット） =====
  var dMode=null,dNode=null,aTouch={};
  var startDist2=0,startScale2=1,pMX=0,pMY=0,pCX=0,pCY=0;
  var panSX=0,panSY=0,panCX=0,panCY=0;
  var nodeSX=0,nodeSY=0,nNSX=0,nNSY=0;
  var totalDist=0;

  function endDragD(){
    dMode=null; dNode=null; aTouch={};
  }

  function getNodeAt(cx,cy){
    for(var i=diagNodes.length-1;i>=0;i--){
      var n=diagNodes[i];
      if((cx-n.x)*(cx-n.x)+(cy-n.y)*(cy-n.y)<=R*R) return n;
    }
    return null;
  }

  wrap.addEventListener('touchstart',function(e){
    if(e.target.closest('.modal-overlay')||e.target.closest('#detail-popup')) return;
    e.preventDefault();
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i];
      aTouch[t.identifier]={x:t.clientX,y:t.clientY};
    }
    var ids=Object.keys(aTouch);
    totalDist=0;
    if(ids.length===1){
      var t=e.targetTouches[0];
      var rect=wrap.getBoundingClientRect();
      var wx=(t.clientX-rect.left-camX)/camScale;
      var wy=(t.clientY-rect.top-camY)/camScale;
      var hit=getNodeAt(wx,wy);
      if(hit){
        dMode='node';dNode=hit;
        nodeSX=t.clientX;nodeSY=t.clientY;nNSX=hit.x;nNSY=hit.y;
      } else {
        dMode='canvas';
        panSX=t.clientX;panSY=t.clientY;panCX=camX;panCY=camY;
      }
    } else if(ids.length===2){
      dMode='zoom';
      var t1=aTouch[ids[0]],t2=aTouch[ids[1]];
      startDist2=Math.sqrt((t2.x-t1.x)*(t2.x-t1.x)+(t2.y-t1.y)*(t2.y-t1.y))||1;
      startScale2=camScale;
      var rect=wrap.getBoundingClientRect();
      pMX=((t1.x+t2.x)/2)-rect.left;
      pMY=((t1.y+t2.y)/2)-rect.top;
      pCX=(pMX-camX)/camScale;
      pCY=(pMY-camY)/camScale;
    }
  },{passive:false});

  window.addEventListener('touchmove',function(e){
    if(!dMode) return;
    for(var i=0;i<e.touches.length;i++){
      var t=e.touches[i];
      if(aTouch[t.identifier]) aTouch[t.identifier]={x:t.clientX,y:t.clientY};
    }
    var ids=Object.keys(aTouch);
    // 1本→2本になったらzoomに切り替え
    if(ids.length>=2&&dMode!=='zoom'){
      var t1=aTouch[ids[0]],t2=aTouch[ids[1]];
      startDist2=Math.sqrt((t2.x-t1.x)*(t2.x-t1.x)+(t2.y-t1.y)*(t2.y-t1.y))||1;
      startScale2=camScale;
      var rect=wrap.getBoundingClientRect();
      pMX=((t1.x+t2.x)/2)-rect.left;
      pMY=((t1.y+t2.y)/2)-rect.top;
      pCX=(pMX-camX)/camScale;
      pCY=(pMY-camY)/camScale;
      dMode='zoom';
    }
    if(dMode==='node'&&dNode){
      var t=e.touches[0];
      var dx=t.clientX-nodeSX,dy=t.clientY-nodeSY;
      totalDist+=Math.sqrt(dx*dx+dy*dy);
      dNode.x=nNSX+dx/camScale;dNode.y=nNSY+dy/camScale;
      var el=document.getElementById('dnd'+dNode.id);
      if(el){el.style.left=(dNode.x-R)+'px';el.style.top=(dNode.y-R)+'px';}
      var mm=document.getElementById('dmemo'+dNode.id);
      if(mm){mm.style.left=dNode.x+'px';mm.style.top=(dNode.y+R+5)+'px';}
      renderEdgesD();
    } else if(dMode==='canvas'){
      var t=e.touches[0];
      var dx=t.clientX-panSX,dy=t.clientY-panSY;
      totalDist+=Math.sqrt(dx*dx+dy*dy);
      camX=panCX+dx;camY=panCY+dy;
      updateStageTransform();
    } else if(dMode==='zoom'){
      if(ids.length<2) return;
      var t1=aTouch[ids[0]],t2=aTouch[ids[1]];
      var dist=Math.sqrt((t2.x-t1.x)*(t2.x-t1.x)+(t2.y-t1.y)*(t2.y-t1.y))||1;
      camScale=Math.max(0.3,Math.min(3,startScale2*(dist/startDist2)));
      camX=pMX-pCX*camScale;camY=pMY-pCY*camScale;
      updateStageTransform();
    }
  },{passive:false});

  window.addEventListener('touchend',function(e){
    // タップ判定（状態リセット前に保存）
    var wasTap=totalDist<10&&dNode&&dMode==='node';
    var tapped=dNode;
    // 指を削除
    for(var i=0;i<e.changedTouches.length;i++){
      delete aTouch[e.changedTouches[i].identifier];
    }
    if(Object.keys(aTouch).length===0){
      endDragD(); // 完全リセット（Gemini推奨: activeTouches={}）
    } else {
      dMode=null;dNode=null; // 残った指でパンに備える
    }
    if(wasTap&&tapped){
      var kb=NAYIN_KB[tapped.person?tapped.person.nichiN:'']||{};
      var htBase=tapped.person?tapped.person.ht.replace(/[＋－]/g,''):'';
      var detail=htBase+'\n'+(tapped.person?tapped.person.nenKS+' / '+tapped.person.tsuKS+' / '+tapped.person.nichiKS:'')+'\n\n'+(kb['性格']||'');
      showDiagDetail(tapped.name+'\uff08'+tapped.memo+'\uff09',detail,'#b8860b');
    }
  });

  window.addEventListener('touchcancel',function(){endDragD();});

  // マウス（PC用）
  var mMode=null,mNode=null,mSX=0,mSY=0,mNSX=0,mNSY=0,mCX=0,mCY=0,mDist=0;
  wrap.addEventListener('mousedown',function(e){
    if(e.button!==0) return;
    mDist=0;
    var rect=wrap.getBoundingClientRect();
    var wx=(e.clientX-rect.left-camX)/camScale;
    var wy=(e.clientY-rect.top-camY)/camScale;
    var hit=getNodeAt(wx,wy);
    if(hit){mMode='node';mNode=hit;mSX=e.clientX;mSY=e.clientY;mNSX=hit.x;mNSY=hit.y;}
    else{mMode='canvas';mSX=e.clientX;mSY=e.clientY;mCX=camX;mCY=camY;}
  });
  window.addEventListener('mousemove',function(e){
    if(!mMode) return;
    var dx=e.clientX-mSX,dy=e.clientY-mSY;
    mDist+=Math.sqrt(dx*dx+dy*dy);
    if(mMode==='node'&&mNode){
      mNode.x=mNSX+dx/camScale;mNode.y=mNSY+dy/camScale;
      var el=document.getElementById('dnd'+mNode.id);
      if(el){el.style.left=(mNode.x-R)+'px';el.style.top=(mNode.y-R)+'px';}
      var mm=document.getElementById('dmemo'+mNode.id);
      if(mm){mm.style.left=mNode.x+'px';mm.style.top=(mNode.y+R+5)+'px';}
      renderEdgesD();
    } else if(mMode==='canvas'){
      camX=mCX+dx;camY=mCY+dy;updateStageTransform();
    }
  });
  window.addEventListener('mouseup',function(){
    var wasTap=mDist<10&&mNode&&mMode==='node';
    var tapped=mNode;
    mMode=null;mNode=null;
    if(wasTap&&tapped){
      var kb=NAYIN_KB[tapped.person?tapped.person.nichiN:'']||{};
      var htBase=tapped.person?tapped.person.ht.replace(/[＋－]/g,''):'';
      var detail=htBase+'\n'+(tapped.person?tapped.person.nenKS+' / '+tapped.person.tsuKS+' / '+tapped.person.nichiKS:'')+'\n\n'+(kb['性格']||'');
      showDiagDetail(tapped.name+'\uff08'+tapped.memo+'\uff09',detail,'#b8860b');
    }
  });
  wrap.addEventListener('wheel',function(e){
    e.preventDefault();
    var rect=wrap.getBoundingClientRect();
    var mx=e.clientX-rect.left,my=e.clientY-rect.top;
    var cx=(mx-camX)/camScale,cy=(my-camY)/camScale;
    camScale=Math.max(0.3,Math.min(3,camScale*(e.deltaY<0?1.1:0.91)));
    camX=mx-cx*camScale;camY=my-cy*camScale;
    updateStageTransform();
  },{passive:false});

  syncNodesDOMD();renderEdgesD();
  wrap.style.height='420px';
}

function drawDiagram(result){
  var persons=result.persons,pairs=result.pairs;
  var W=document.getElementById('diagramWrap').offsetWidth||360;
  var H=420,R=36,n=persons.length;
  var nodes=persons.map(function(p,i){
    var htBase=p.ht.replace(/[＋－]/g,'');
    var angle=(i/n)*Math.PI*2-Math.PI/2;
    var radius=130;
    return {id:i+1,x:Math.round(200+radius*Math.cos(angle)),y:Math.round(210+radius*Math.sin(angle)),
      name:p.name,memo:p.role.replace('あなた（本人）','本人'),color:ROKKA_TO_CL[htBase]||0,person:p};
  });
  var edges=[],eid=1;
  pairs.forEach(function(pair){
    var pa=persons[pair.i],pb=persons[pair.j];
    edges.push({id:eid++,from:pair.i+1,to:pair.j+1,label:buildEdgeLabel(pair.label1),
      detail:buildEdgeDetail(pa.name,pb.name,pair.nenJu1,pair.tsuJu1,pair.nichiJu1)});
    edges.push({id:eid++,from:pair.j+1,to:pair.i+1,label:buildEdgeLabel(pair.label2),
      detail:buildEdgeDetail(pb.name,pa.name,pair.nenJu2,pair.tsuJu2,pair.nichiJu2)});
  });
  initDiagramEngine(nodes,edges);
  buildPeopleTab(result);buildRelationTab(result);
}

// ===== AI関係性アドバイス =====
var ADVICE_CHAT_HISTORY=[];
var currentAudio=null;

async function getRelationAdvice(){
  if(!RESULT_DATA) return;
  var qs=document.getElementById('questionSection');
  var ads=document.getElementById('adviceSection');
  if(ads) ads.classList.remove('hidden');
  var loadEl=document.getElementById('adviceLoading');
  if(loadEl) loadEl.style.display='flex';
  var at=document.getElementById('adviceText');
  if(at) at.style.display='none';

  var persons=RESULT_DATA.persons;
  var me=persons[0];
  var pairs=RESULT_DATA.pairs;
  var goodJ=['発芽','青葉','成天','豊穣','穂分','平凪'];
  var badJ=['内省','狂咲','引寒','休眠','残雪'];
  function jr(j){return goodJ.indexOf(j)>=0?'良':badJ.indexOf(j)>=0?'要注意':'普通';}

  var compatSummary=pairs.filter(function(pair){return pair.i===0;}).map(function(pair){
    var p=persons[pair.j];
    var pid=pair.i+'-'+pair.j;
    var contact=document.getElementById('contact-'+pid);
    var feeling=document.getElementById('feeling-'+pid);
    var wish=document.getElementById('wish-'+pid);
    return me.name+'と'+p.name+'('+p.role+') '
      +'長期：'+pair.nenJu1+'('+jr(pair.nenJu1)+') 日常：'+pair.tsuJu1+'('+jr(pair.tsuJu1)+')'
      +(contact?' 接触：'+contact.value:'')
      +(feeling?' 気持ち：'+feeling.value:'')
      +(wish?' 望み：'+wish.value:'');
  }).join(' / ');

  var allPairs=pairs.map(function(pair){
    var pa=persons[pair.i],pb=persons[pair.j];
    return pa.name+'→'+pb.name+'：'+buildEdgeLabel(pair.label1)+' / '+pb.name+'→'+pa.name+'：'+buildEdgeLabel(pair.label2);
  }).join(', ');

  var parts=[
    '主人公：'+me.name+'（'+me.role+'）',
    '登場人物：'+persons.map(function(p){return p.name+'('+p.role+')';}).join('、'),
    '相性データ：'+allPairs,
    '状況：'+compatSummary,
    me.name+'を主人公として関係性全体を分析し具体的なアドバイスを。500〜700文字。Markdown必須（##・###・箇条書き）。干支漢字・納音・蔵干などの専門用語は使わないこと。'
  ];

  var sysPrompt='あなたは花人占術の鑑定師です。相関図全体を俯瞰して、主人公にとっての人間関係を読み解き、具体的で温かいアドバイスをしてください。距離の置き方・付き合い方の工夫など現実的な提案を含めてください。';

  try{
    var res=await fetch('https://polished-flower-2524.cniokun.workers.dev/api/chat',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({systemPrompt:sysPrompt,messages:[{role:'user',content:parts.join(' ')}]})
    });
    var data=await res.json();
    var text='';
    if(data.content) text=data.content.map(function(b){return b.text||'';}).join('');
    if(loadEl) loadEl.style.display='none';
    if(at){
      at.innerHTML=renderMarkdown(text);
      at.style.display='block';
    }
    var asb=document.getElementById('adviceSpeakBtn');
    var avg=document.getElementById('adviceVoiceGender');
    if(asb) asb.style.display='block';
    if(avg) avg.style.display='block';
    var aca=document.getElementById('adviceChatArea');
    if(aca) aca.style.display='block';
    ADVICE_CHAT_HISTORY=[{role:'assistant',content:text}];
    var ac=document.getElementById('adviceCount');
    if(ac&&data.remaining!==undefined) ac.textContent='本日の残り鑑定回数：'+data.remaining+'回';
    if(ads) ads.scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){
    if(loadEl) loadEl.style.display='none';
    if(at){at.textContent='通信エラーが発生しました。';at.style.display='block';}
  }
}

async function speakAdvice(btn){
  if(currentAudio&&!currentAudio.paused){currentAudio.pause();currentAudio=null;btn.textContent='🔊 読み上げ';return;}
  var rawText=document.getElementById('adviceText').textContent||'';
  if(!rawText) return;
  var gender=document.getElementById('adviceVoiceGender').value||'female';
  var t=rawText;
  ['#','*','【','】','「','」'].forEach(function(c){while(t.indexOf(c)>=0)t=t.replace(c,'');});
  [['風花人','ふうかじん'],['天花人','てんかじん'],['水花人','すいかじん'],['白花人','はくかじん'],['離花人','りかじん'],['仙花人','せんかじん']].forEach(function(p){while(t.indexOf(p[0])>=0)t=t.replace(p[0],p[1]);});
  btn.textContent='⏳ 生成中...';btn.disabled=true;
  try{
    var res=await fetch('https://polished-flower-2524.cniokun.workers.dev/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t,gender:gender})});
    if(!res.ok) throw new Error('失敗');
    var data=await res.json();
    var audio=new Audio('data:audio/mp3;base64,'+data.audioContent);
    currentAudio=audio;
    audio.onplay=function(){btn.textContent='⏹ 停止';btn.disabled=false;};
    audio.onended=function(){btn.textContent='🔊 読み上げ';currentAudio=null;};
    audio.onerror=function(){btn.textContent='🔊 読み上げ';btn.disabled=false;currentAudio=null;};
    await audio.play();
  }catch(e){btn.textContent='🔊 読み上げ';btn.disabled=false;}
}

async function speakChatBubble(btn){
  if(currentAudio&&!currentAudio.paused){currentAudio.pause();currentAudio=null;btn.textContent='🔊 読み上げ';return;}
  var rawText=btn.getAttribute('data-text')||'';
  if(!rawText) return;
  btn.textContent='⏳ 生成中...';btn.disabled=true;
  try{
    var res=await fetch('https://polished-flower-2524.cniokun.workers.dev/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:rawText,gender:'female'})});
    var data=await res.json();
    var audio=new Audio('data:audio/mp3;base64,'+data.audioContent);
    currentAudio=audio;
    audio.onplay=function(){btn.textContent='⏹ 停止';btn.disabled=false;};
    audio.onended=function(){btn.textContent='🔊 読み上げ';currentAudio=null;};
    audio.onerror=function(){btn.textContent='🔊 読み上げ';btn.disabled=false;currentAudio=null;};
    await audio.play();
  }catch(e){btn.textContent='🔊 読み上げ';btn.disabled=false;}
}

async function sendAdviceChat(){
  var input=document.getElementById('adviceChatInput');
  if(!input) return;
  var userMsg=input.value.trim();
  if(!userMsg) return;
  input.value='';
  ADVICE_CHAT_HISTORY.push({role:'user',content:userMsg});
  var histEl=document.getElementById('adviceChatHistory');
  if(histEl){var ud=document.createElement('div');ud.className='chat-bubble-user';ud.textContent=userMsg;histEl.appendChild(ud);}
  var loadEl=document.getElementById('adviceChatLoading');
  if(loadEl) loadEl.style.display='flex';
  var messages=ADVICE_CHAT_HISTORY.slice(-10);
  try{
    var res=await fetch('https://polished-flower-2524.cniokun.workers.dev/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({systemPrompt:'あなたは花人占術の鑑定師です。Markdown不可。',messages:messages})});
    var data=await res.json();
    var text='';
    if(data.content) text=data.content.map(function(b){return b.text||'';}).join('');
    text=text.replace(/^#{1,4}\s*/gm,'').replace(/\*{1,2}([^*]+)\*{1,2}/g,'$1').trim();
    ADVICE_CHAT_HISTORY.push({role:'assistant',content:text});
    if(loadEl) loadEl.style.display='none';
    if(histEl){
      var ad=document.createElement('div');ad.className='chat-bubble-ai';ad.textContent=text;
      var sb=document.createElement('button');sb.className='chat-speak-btn';sb.textContent='🔊 読み上げ';sb.setAttribute('data-text',text);sb.onclick=function(){speakChatBubble(this);};
      var wrap=document.createElement('div');wrap.appendChild(ad);wrap.appendChild(sb);histEl.appendChild(wrap);
      wrap.scrollIntoView({behavior:'smooth',block:'nearest'});
    }
    var ac=document.getElementById('adviceCount');
    if(ac&&data.remaining!==undefined) ac.textContent='本日の残り回数：'+data.remaining+'回';
  }catch(e){if(loadEl) loadEl.style.display='none';}
}
