<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>精密命式鑑定 - 花人占術</title>
<!-- v1.0 -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Serif+JP:wght@300;400;600;700&family=Zen+Old+Mincho:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#fff9f6;
  --bg-grad:linear-gradient(135deg,#fff5f2 0%,#feeef0 50%,#fdf0f7 100%);
  --card:#ffffff;--card2:#fff5f6;
  --gold:#d4a373;--gold2:#b58255;
  --gold-grad:linear-gradient(135deg,#fae1dd 0%,#fec5bb 100%);
  --glow:rgba(254,197,187,0.3);
  --text:#4a3f3d;--text2:#8a7a77;
  --border:rgba(254,197,187,0.4);--border2:rgba(212,163,115,0.5);
  --r:22px;--rm:14px;
  --serif:'Zen Old Mincho','Noto Serif JP',serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
body.theme-gold{
  --bg:#fdf8ef;
  --bg-grad:linear-gradient(135deg,#fdf6e8 0%,#f7e8c8 50%,#fdf3e0 100%);
  --card:#ffffff;--card2:#fdf6eb;
  --gold:#b8860b;--gold2:#8b6508;
  --gold-grad:linear-gradient(135deg,#f5e6b0 0%,#d4a017 100%);
  --glow:rgba(184,134,11,0.2);
  --text:#2a1c08;--text2:#7a6b52;
  --border:rgba(184,134,11,0.25);--border2:rgba(184,134,11,0.5);
}
body.theme-dark{
  --bg:#0b0a08;
  --bg-grad:linear-gradient(135deg,#110e08 0%,#1a1610 50%,#0f0c09 100%);
  --card:#14120e;--card2:#1c1914;
  --gold:#e6c687;--gold2:#b89146;
  --gold-grad:linear-gradient(135deg,#e6c687 0%,#b89146 100%);
  --glow:rgba(230,198,135,0.15);
  --text:#f4f0ea;--text2:#b5ae9f;
  --border:rgba(230,198,135,0.15);--border2:rgba(230,198,135,0.4);
}
body.theme-dark .glass{background:var(--card);box-shadow:0 12px 40px rgba(0,0,0,0.6)}
body.theme-dark .fld input,body.theme-dark .fld select{background:rgba(255,255,255,0.06);color:var(--text);border-color:rgba(230,198,135,0.2)}
body.theme-dark .date-grp select{background:rgba(255,255,255,0.06);color:var(--text);border-color:rgba(230,198,135,0.2)}
body.theme-dark input[type="text"],body.theme-dark select{background:rgba(255,255,255,0.06);color:var(--text);border-color:rgba(230,198,135,0.2)}
body.theme-dark select option{background:#1c1914;color:var(--text)}
body.theme-dark .sec{background:var(--card)}
body.theme-dark .topbar{background:rgba(17,14,10,0.92);border-bottom-color:rgba(230,198,135,0.15)}
body.theme-dark .meishiki-col{background:rgba(255,255,255,0.04);border-color:rgba(230,198,135,0.15)}
body.theme-dark .meishiki-col.active{background:rgba(230,198,135,0.08);border-color:rgba(230,198,135,0.4)}
body.theme-dark .daiun-row:hover{background:rgba(230,198,135,0.05)}
body.theme-dark .daiun-row.current{background:rgba(230,198,135,0.1);border-left-color:var(--gold)}
body.theme-dark .chat-inp{background:rgba(255,255,255,0.06);color:var(--text);border-color:rgba(230,198,135,0.2)}
body.theme-dark .bbl.ai .msg{background:var(--card2)}
body.theme-dark .chip{background:rgba(230,198,135,0.06);color:var(--text2)}
body.theme-dark .layer-card{background:var(--card2)}
body.theme-dark .unki-detail{background:var(--card2)}
body.theme-dark .tab-btn{color:var(--text2)}
body.theme-dark .tab-btn.on{background:var(--card);border-color:var(--border2)}
body.theme-dark .input-card{background:var(--card)}
body.theme-dark #errmsg{background:rgba(200,80,80,0.95)}

html,body{min-height:100vh;background:var(--bg);color:var(--text);
  font-family:'Noto Serif JP',serif;line-height:1.6;font-size:16px}
body{background-image:var(--bg-grad);background-attachment:fixed}

#errmsg{display:none;position:fixed;top:0;left:0;right:0;z-index:9999;
  background:rgba(230,100,100,0.95);color:#fff;padding:0.7rem 1rem;
  font-size:0.8rem;word-break:break-all}

/* トップバー */
.topbar{position:fixed;top:0;left:0;right:0;z-index:500;
  background:rgba(255,255,255,0.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding-top:var(--safe-t);height:calc(var(--safe-t) + 48px);
  display:flex;align-items:flex-end;
  padding-left:1rem;padding-right:1rem;padding-bottom:0.5rem}
.topbar-left{display:flex;align-items:center;width:80px;flex-shrink:0}
.topbar-left button{background:none;border:none;color:var(--text2);
  font-family:'Noto Serif JP',serif;font-size:0.78rem;cursor:pointer;
  padding:0;letter-spacing:0.04em;display:flex;align-items:center;gap:0.3rem}
body.theme-dark .topbar-left button{color:var(--gold)}
.topbar-logo{flex:1;text-align:center;
  font-family:'Zen Old Mincho','Noto Serif JP',serif;
  font-size:1rem;font-weight:600;letter-spacing:0.2em;
  background:var(--gold-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  white-space:nowrap;pointer-events:none}
.topbar-right{width:80px;flex-shrink:0}

/* メインコンテンツ */
.page{padding:calc(var(--safe-t) + 56px) 0 calc(var(--safe-b) + 2rem)}

/* 入力カード */
.input-card{background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);padding:1.4rem 1.2rem;margin:1rem 1rem 1.2rem;
  box-shadow:0 6px 20px var(--glow)}
.input-card-ttl{font-family:var(--serif);color:var(--gold2);font-size:0.88rem;
  font-weight:600;margin-bottom:0.8rem;letter-spacing:0.08em}
.date-grp{display:flex;gap:0.4rem}
.date-grp select{flex:1;padding:0.75rem 0.3rem;border:1px solid var(--border);
  border-radius:var(--rm);background:var(--card);color:var(--text);
  font-family:'Noto Serif JP',serif;font-size:0.9rem;text-align:center;
  outline:none;cursor:pointer;transition:border-color 0.2s}
.date-grp select:focus{border-color:var(--gold)}
.calc-btn{width:100%;padding:0.9rem;background:var(--gold-grad);color:var(--text);
  border:none;border-radius:var(--rm);font-family:var(--serif);font-size:0.95rem;
  font-weight:700;cursor:pointer;letter-spacing:0.1em;margin-top:0.8rem;
  box-shadow:0 4px 12px var(--glow);transition:all 0.2s}
.calc-btn:active{transform:scale(0.98)}
.input-hint{font-size:0.75rem;color:var(--text2);text-align:center;margin-top:0.4rem;
  letter-spacing:0.04em}

/* ヒーローエリア */
.hero-area{margin:0 1rem 1.2rem;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);padding:1.8rem 1.4rem;text-align:center;
  box-shadow:0 8px 24px var(--glow)}
.hero-ht{font-family:var(--serif);font-size:2rem;font-weight:700;letter-spacing:0.12em;
  background:linear-gradient(135deg,#c8a84b 0%,#f5e17a 40%,#b8860b 70%,#e6c96a 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 1px 3px rgba(184,134,11,0.3));margin-bottom:0.3rem}
.hero-bd{font-size:0.85rem;color:var(--text2);margin-bottom:0.3rem;letter-spacing:0.04em}
.hero-today{display:inline-flex;align-items:center;gap:0.4rem;
  background:var(--gold-grad);border-radius:20px;padding:0.3rem 0.9rem;
  font-family:var(--serif);font-size:0.82rem;font-weight:600;color:var(--text);
  margin-top:0.5rem;box-shadow:0 2px 8px var(--glow)}

/* セクション共通 */
.sec{background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);margin:0 1rem 1.2rem;
  box-shadow:0 4px 14px rgba(254,197,187,0.1)}
.sec-head{padding:1.2rem 1.4rem 0.8rem;border-bottom:1px solid var(--border)}
.sec-ttl{font-family:var(--serif);color:var(--gold2);font-size:1rem;
  font-weight:600;letter-spacing:0.1em;border-left:3px solid var(--gold);
  padding-left:0.6rem}
.sec-body{padding:1.2rem 1.4rem}

/* 命式グリッド */
.meishiki-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.7rem;margin-bottom:1rem}
.meishiki-col{border:1.5px solid var(--border);border-radius:var(--rm);
  padding:0.9rem 0.5rem;text-align:center;transition:all 0.2s;background:rgba(255,255,255,0.5)}
.meishiki-col.active{border-color:var(--gold2);box-shadow:0 4px 12px var(--glow);
  background:rgba(254,240,240,0.6)}
.meishiki-col-lbl{font-size:0.7rem;color:var(--text2);letter-spacing:0.06em;
  margin-bottom:0.4rem;font-weight:600}
.meishiki-ks{font-family:var(--serif);font-size:1.5rem;font-weight:700;
  color:var(--gold2);letter-spacing:0.05em;margin-bottom:0.3rem}
.meishiki-kan{font-size:0.72rem;color:var(--text2);margin-bottom:0.15rem}
.meishiki-juni{font-family:var(--serif);font-size:0.78rem;font-weight:600;margin-top:0.2rem}

/* 三層構造 */
.layer-list{display:flex;flex-direction:column;gap:0.7rem}
.layer-card{background:var(--card2);border-radius:var(--rm);padding:1rem 1.2rem;
  border-left:4px solid var(--gold);position:relative}
.layer-card.layer-1{border-left-color:#e07a9b}
.layer-card.layer-2{border-left-color:#d4a373}
.layer-card.layer-3{border-left-color:#6fa874}
.layer-tag{font-size:0.68rem;font-weight:700;letter-spacing:0.08em;
  background:var(--gold-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:0.2rem}
.layer-card.layer-1 .layer-tag{background:linear-gradient(135deg,#e07a9b,#b85070);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.layer-card.layer-2 .layer-tag{background:linear-gradient(135deg,#d4a373,#b58255);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.layer-card.layer-3 .layer-tag{background:linear-gradient(135deg,#6fa874,#4a8a50);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.layer-ks{font-family:var(--serif);font-size:1.1rem;font-weight:700;color:var(--text);
  margin-bottom:0.3rem}
.layer-desc{font-size:0.82rem;color:var(--text2);line-height:1.7}

/* 今日の運気 */
.unki-detail{background:var(--card2);border-radius:var(--rm);padding:1.2rem;
  text-align:center;margin-bottom:0.7rem}
.unki-name-big{font-family:var(--serif);font-size:1.8rem;font-weight:700;
  margin-bottom:0.2rem}
.unki-kikkyo{display:inline-block;padding:0.2rem 0.8rem;border-radius:12px;
  font-size:0.78rem;font-weight:600;margin-bottom:0.6rem;
  background:var(--gold-grad);color:var(--text)}
.unki-desc{font-size:0.82rem;color:var(--text2);line-height:1.7;text-align:left}

/* 大運表 */
.daiun-table{width:100%;border-collapse:collapse;font-size:0.78rem}
.daiun-table th{background:linear-gradient(135deg,rgba(212,163,115,0.15),rgba(254,197,187,0.2));
  color:var(--gold2);font-weight:600;padding:0.45rem 0.3rem;text-align:center;
  border-bottom:2px solid var(--border2);font-family:var(--serif);letter-spacing:0.03em;font-size:0.65rem}
.daiun-row td{padding:0.5rem 0.3rem;text-align:center;border-bottom:1px solid var(--border);
  vertical-align:middle;font-size:0.75rem}
.daiun-row:hover{background:rgba(254,197,187,0.05)}
.daiun-row.current{background:rgba(254,197,187,0.12);border-left:3px solid var(--gold)}
.daiun-row.current td:first-child{padding-left:0.2rem}
.daiun-ks{font-family:var(--serif);font-size:1rem;font-weight:700;color:var(--gold2)}
.daiun-age{font-family:var(--serif);font-size:0.82rem;font-weight:600}
.daiun-juni{font-family:var(--serif);font-size:0.82rem;font-weight:600}
.current-marker{font-size:0.62rem;color:var(--gold);font-weight:700;display:block;margin-top:1px}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* チャット */
.chat-room{display:flex;flex-direction:column;height:360px}
.chat-disp{flex:1;overflow-y:auto;padding:0.8rem 0;-webkit-overflow-scrolling:touch}
.bbl{margin-bottom:0.8rem}
.slbl{font-size:0.65rem;color:var(--text2);letter-spacing:0.04em;display:block;
  margin-bottom:0.2rem}
.bbl.ai .slbl{padding-left:0.2rem}
.bbl.usr .slbl{text-align:right;padding-right:0.2rem}
.msg{max-width:85%;padding:0.7rem 0.9rem;border-radius:14px;
  font-size:0.85rem;line-height:1.7;word-break:break-word}
.bbl.ai .msg{background:var(--card2);border:1px solid var(--border);border-radius:4px 14px 14px 14px}
.bbl.usr .msg{background:var(--gold-grad);margin-left:auto;border-radius:14px 4px 14px 14px;color:var(--text)}
.chat-chips{display:flex;flex-wrap:wrap;gap:0.4rem;padding:0.5rem 0}
.chip{padding:0.35rem 0.7rem;background:rgba(254,197,187,0.15);border:1px solid var(--border);
  border-radius:12px;font-size:0.72rem;cursor:pointer;color:var(--text2);
  font-family:'Noto Serif JP',serif;transition:all 0.2s;letter-spacing:0.03em}
.chip:active{background:var(--glow)}
.chat-input-row{display:flex;gap:0.5rem;align-items:center;padding-top:0.6rem;
  border-top:1px solid var(--border)}
.chat-inp{flex:1;padding:0.7rem 0.9rem;border:1px solid var(--border);border-radius:var(--rm);
  background:var(--card);color:var(--text);font-family:'Noto Serif JP',serif;
  font-size:0.88rem;outline:none;transition:border-color 0.2s}
.chat-inp:focus{border-color:var(--gold)}
.chat-send{width:40px;height:40px;border-radius:50%;background:var(--gold-grad);
  border:none;color:var(--text);font-size:1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 2px 8px var(--glow)}

/* タブ */
.tab-wrap{display:flex;gap:0.4rem;margin-bottom:0.8rem;overflow-x:auto;
  scrollbar-width:none;-ms-overflow-style:none}
.tab-wrap::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:0.4rem 0.9rem;background:rgba(254,197,187,0.12);
  border:1px solid var(--border);border-radius:14px;font-size:0.78rem;
  color:var(--text2);cursor:pointer;font-family:'Noto Serif JP',serif;
  letter-spacing:0.04em;transition:all 0.2s;white-space:nowrap}
.tab-btn.on{background:var(--card);border-color:var(--gold2);color:var(--gold2);font-weight:600}

/* ボトムナビ */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:500;
  background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  padding-bottom:var(--safe-b);display:flex}
body.theme-dark .bnav{background:rgba(17,14,10,0.95);border-top-color:rgba(230,198,135,0.1)}
.nbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:0.15rem;
  padding:0.5rem 0.2rem;background:none;border:none;cursor:pointer;
  font-family:'Noto Serif JP',serif;font-size:0.62rem;color:var(--text2);
  letter-spacing:0.03em;transition:color 0.2s}
.nbtn.on{color:var(--gold2)}
.ni{font-size:1.1rem;display:block}
.nl{display:block;font-size:0.6rem}

/* アニメーション */
.fade-in{animation:fadeIn 0.4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* 花びら canvas */
canvas#petalCanvas{position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:1;opacity:0.75;display:none}

/* リザルト非表示 */
#result{display:none}
#result.show{display:block}

/* ラッキーカラーウィジェット */
.lc-swatches{display:flex;flex-wrap:wrap;gap:0.6rem;justify-content:center;margin-top:0.8rem}
.lc-swatch-item{display:flex;flex-direction:column;align-items:center;gap:4px}
.lc-dot{width:36px;height:36px;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,0.15);
  border:2px solid rgba(255,255,255,0.8)}
.lc-name{font-size:0.62rem;color:var(--text2)}
.gogyo-bar{display:flex;gap:0.35rem;margin-top:0.8rem;justify-content:center}
.gogyo-item{display:flex;flex-direction:column;align-items:center;gap:2px}
.gogyo-badge{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:0.82rem;font-weight:700;color:#fff;font-family:var(--serif)}
.gogyo-lbl{font-size:0.6rem;color:var(--text2)}
.gogyo-cnt{font-size:0.72rem;font-weight:600;color:var(--text)}
</style>
</head>
<body>

<div id="errmsg"></div>

<!-- 花びら -->
<canvas id="petalCanvas"></canvas>

<!-- トップバー -->
<div class="topbar">
  <div class="topbar-left">
    <button onclick="goBack()">← 戻る</button>
  </div>
  <div class="topbar-logo">花人占術</div>
  <div class="topbar-right"></div>
</div>

<!-- メインページ -->
<div class="page">

  <!-- 入力カード -->
  <div class="input-card" id="inputCard">
    <div class="input-card-ttl">🌸 生年月日・性別を入力</div>
    <div class="date-grp">
      <select id="byY"></select>
      <select id="byM"></select>
      <select id="byD"></select>
    </div>
    <div class="date-grp" style="margin-top:0.5rem">
      <select id="byG" style="flex:1;padding:0.75rem 0.5rem;border:1px solid var(--border);border-radius:var(--rm);background:var(--card);color:var(--text);font-family:'Noto Serif JP',serif;font-size:0.9rem;outline:none">
        <option value="male">男性</option>
        <option value="female">女性</option>
      </select>
    </div>
    <button class="calc-btn" onclick="doCalc()">精密命式を鑑定する</button>
    <div class="input-hint">年柱・月柱・日柱・大運を自動計算します</div>
  </div>

  <!-- 結果エリア -->
  <div id="result">

    <!-- ヒーローカード -->
    <div class="hero-area fade-in" id="heroArea">
      <div style="font-size:0.78rem;color:var(--text2);margin-bottom:0.5rem;letter-spacing:0.06em" id="heroBd"></div>
      <div class="hero-ht" id="heroHt">天花人＋</div>
      <div style="font-size:0.8rem;color:var(--text2);margin-top:0.3rem" id="heroSub"></div>
      <div class="hero-today" id="heroToday"></div>
    </div>

    <!-- 命式セクション -->
    <div class="sec fade-in">
      <div class="sec-head">
        <div class="sec-ttl">📿 命式（三柱）</div>
      </div>
      <div class="sec-body">
        <div class="meishiki-grid" id="meishikiGrid"></div>
        <div style="font-size:0.75rem;color:var(--text2);text-align:center;margin-top:0.4rem;letter-spacing:0.04em">
          タップで三層構造解説へ
        </div>
      </div>
    </div>

    <!-- 三層構造セクション -->
    <div class="sec fade-in">
      <div class="sec-head">
        <div class="sec-ttl">🔮 三層構造の本質</div>
      </div>
      <div class="sec-body">
        <div style="font-size:0.78rem;color:var(--text2);line-height:1.7;margin-bottom:1rem;
          background:rgba(254,197,187,0.1);border-radius:var(--rm);padding:0.8rem;
          border-left:3px solid var(--gold)">
          命式は3つの柱から成ります。<br>
          年柱は他者から見た<ruby>超自我<rt>スーパーエゴ</rt></ruby>（社会的仮面）、
          月柱は自己認識の<ruby>自我<rt>エゴ</rt></ruby>（意識的自己）、
          日柱は本質的な<ruby>本我<rt>イド</rt></ruby>（無意識の核）を表します。
        </div>
        <div class="layer-list" id="layerList"></div>
      </div>
    </div>

    <!-- 今日の運気セクション -->
    <div class="sec fade-in">
      <div class="sec-head">
        <div class="sec-ttl">⭐ 今日の運気</div>
      </div>
      <div class="sec-body">
        <div class="tab-wrap" id="unkiTabs">
          <button class="tab-btn on" onclick="switchUnkiTab('day',this)">日運</button>
          <button class="tab-btn" onclick="switchUnkiTab('month',this)">月運</button>
          <button class="tab-btn" onclick="switchUnkiTab('year',this)">年運</button>
        </div>
        <div id="unkiContent"></div>
      </div>
    </div>

  // gが'不明'の場合はnenNumから推定
  if(gRaw==='不明'){
    gender=nenNum%2===1?'男':'女';
  }
  isFwd=(nenNum%2===1&&gender==='男')||(nenNum%2===0&&gender==='女');

  var sa=getDaiunStartAge(y,m,d,isFwd);
  var tsuKanIdx=JIKKAN.indexOf(tsuKS[0]);
  var tsuShiIdx=JUNISHI.indexOf(tsuKS[1]);
  var DL=[];
  for(var i=0;i<=14;i++){
    var ki,si;
    if(isFwd){ki=(tsuKanIdx+i)%10;si=(tsuShiIdx+i)%12;}
    else{ki=((tsuKanIdx-i)%10+10)%10;si=((tsuShiIdx-i)%12+12)%12;}
    DL.push({ks:JIKKAN[ki]+JUNISHI[si],kan:JIKKAN[ki],shi:JUNISHI[si]});
  }
  var MAX_AGE=120;
  var A2D=[],A2K=[];var ap=0;
  for(var di=0;di<DL.length&&ap<MAX_AGE;di++){
    var sp=Math.min(di===0?sa:10,MAX_AGE-ap);
    for(var a=0;a<sp;a++,ap++){A2D.push(DL[di]);A2K.push(di);}
  }
  while(A2D.length<MAX_AGE){A2D.push(DL[DL.length-1]);A2K.push(A2K[A2K.length-1]);}

  G={y:y,m:m,d:d,ht:ht,nenKS:nenKS,tsuKS:tsuKS,nichiKS:nichiKS,DL:DL,A2D:A2D,sa:sa,isFwd:isFwd,nichiKanIdx:nichiKanIdx,dfs:dfs,T:T,sats:sats};

  renderResult();
  document.getElementById('result').className='show';
  chatCtx=[];
  renderChatChips();
  addBubble('ai','命式を読み込みました。何でもご質問ください🌸');
}

// ===== 花びら演出 =====
var petalAnim=null,petalActive=false;
var petalCanvas,petalCtx,petals=[];

function initPetals(){
  petalCanvas=document.getElementById('petalCanvas');
  petalCtx=petalCanvas.getContext('2d');
  petalCanvas.width=window.innerWidth;petalCanvas.height=window.innerHeight;
  window.addEventListener('resize',function(){
    petalCanvas.width=window.innerWidth;petalCanvas.height=window.innerHeight;
  });
}

var PETAL_COLORS=[['#ffb7c5','#ff6b8a'],['#ffc8d4','#ff85a1'],['#b8e8b8','#5cbd5c'],
  ['#fff0a0','#ffd020'],['#d4a0ff','#9040ff'],['#a0d4ff','#40a0ff'],
  ['#ffc090','#ff7830'],['#ff90b0','#ff3070'],['#c0a0ff','#7040ff'],
  ['#a0ffcc','#20c060'],['#ffb080','#ff6020'],['#80c8ff','#2080e0']];
var wind={strength:0,target:0,timer:0};

function updateWind(){
  wind.timer--;
  if(wind.timer<=0){
    var r=Math.random();
    if(r<0.5){wind.target=(Math.random()-0.5)*1.5;wind.timer=60+Math.random()*120;}
    else if(r<0.8){wind.target=(Math.random()-0.3)*3.0;wind.timer=40+Math.random()*80;}
    else{wind.target=(Math.random()>0.5?1:-1)*(2.5+Math.random()*3.0);wind.timer=20+Math.random()*40;}
  }
  wind.strength+=(wind.target-wind.strength)*0.02;
}

function createPetal(){
  var cp=PETAL_COLORS[Math.floor(Math.random()*PETAL_COLORS.length)];
  var depth=Math.random();var sz=6+depth*18;
  var startX=Math.random()*petalCanvas.width;
  if(wind.strength>2.0)startX=-sz;
  else if(wind.strength<-2.0)startX=petalCanvas.width+sz;
  return{x:startX,y:-sz*2,size:sz,depth:depth,shape:Math.floor(Math.random()*8),
    speedY:(0.2+depth*0.8)+Math.random()*0.4,speedX:(Math.random()-0.5)*0.4,
    rotation:Math.random()*Math.PI*2,rotSpeed:(Math.random()-0.5)*0.02,
    sway:Math.random()*Math.PI*2,swaySpeed:0.004+Math.random()*0.008,swayAmt:0.5+depth*2.5,
    color:cp[0],colorDark:cp[1],opacity:0.3+depth*0.55,
    flip:Math.random()*Math.PI*2,flipSpeed:(Math.random()>0.5?1:-1)*(0.008+depth*0.02),
    windResponse:0.3+Math.random()*0.7};
}

function drawPetal(p){
  petalCtx.save();petalCtx.translate(p.x,p.y);petalCtx.rotate(p.rotation);
  var flipScale=Math.cos(p.flip);petalCtx.scale(flipScale,1);var s=p.size;
  petalCtx.beginPath();
  switch(p.shape){
    case 0:petalCtx.moveTo(0,s*0.75);petalCtx.bezierCurveTo(-s*0.1,s*0.3,-s*0.85,s*0.05,-s*0.65,-s*0.45);petalCtx.bezierCurveTo(-s*0.45,-s*0.95,s*0.45,-s*0.95,s*0.65,-s*0.45);petalCtx.bezierCurveTo(s*0.85,s*0.05,s*0.1,s*0.3,0,s*0.75);break;
    case 1:petalCtx.moveTo(0,s*0.95);petalCtx.bezierCurveTo(-s*0.08,s*0.5,-s*0.38,-s*0.1,-s*0.32,-s*0.6);petalCtx.bezierCurveTo(-s*0.22,-s*1.0,s*0.22,-s*1.0,s*0.32,-s*0.6);petalCtx.bezierCurveTo(s*0.38,-s*0.1,s*0.08,s*0.5,0,s*0.95);break;
    case 2:petalCtx.moveTo(0,s*0.85);petalCtx.bezierCurveTo(-s*0.06,s*0.4,-s*0.42,s*0.05,-s*0.38,-s*0.5);petalCtx.bezierCurveTo(-s*0.28,-s*0.95,s*0.28,-s*0.95,s*0.38,-s*0.5);petalCtx.bezierCurveTo(s*0.42,s*0.05,s*0.06,s*0.4,0,s*0.85);break;
    case 3:petalCtx.moveTo(0,s*0.7);petalCtx.bezierCurveTo(-s*0.25,s*0.4,-s*0.8,s*0.15,-s*0.72,-s*0.35);petalCtx.bezierCurveTo(-s*0.55,-s*0.88,s*0.55,-s*0.88,s*0.72,-s*0.35);petalCtx.bezierCurveTo(s*0.8,s*0.15,s*0.25,s*0.4,0,s*0.7);break;
    default:petalCtx.moveTo(0,s*0.8);petalCtx.bezierCurveTo(-s*0.08,s*0.3,-s*0.75,s*0.0,-s*0.6,-s*0.4);petalCtx.bezierCurveTo(-s*0.45,-s*0.95,s*0.45,-s*0.95,s*0.6,-s*0.4);petalCtx.bezierCurveTo(s*0.75,s*0.0,s*0.08,s*0.3,0,s*0.8);break;
  }
  petalCtx.closePath();
  var grad=petalCtx.createRadialGradient(0,-s*0.1,s*0.05,0,s*0.1,s*1.1);
  grad.addColorStop(0,'rgba(255,255,255,0.95)');
  grad.addColorStop(0.3,p.color+'cc');
  grad.addColorStop(1,p.colorDark+'aa');
  petalCtx.globalAlpha=p.opacity;petalCtx.fillStyle=grad;petalCtx.fill();
  petalCtx.restore();
}

function animatePetals(){
  if(!petalActive)return;
  petalCtx.clearRect(0,0,petalCanvas.width,petalCanvas.height);
  updateWind();
  var spawnRate=Math.abs(wind.strength)>2?0.08:0.04;
  var maxPetals=Math.abs(wind.strength)>2?40:25;
  if(Math.random()<spawnRate&&petals.length<maxPetals)petals.push(createPetal());
  petals=petals.filter(function(p){return p.y<petalCanvas.height+40&&p.x>-100&&p.x<petalCanvas.width+100;});
  petals.sort(function(a,b){return a.depth-b.depth;});
  petals.forEach(function(p){
    p.sway+=p.swaySpeed;
    p.x+=p.speedX+Math.sin(p.sway)*p.swayAmt+wind.strength*p.windResponse*0.4;
    p.y+=p.speedY;p.rotation+=p.rotSpeed+wind.strength*0.003;
    p.flip+=p.flipSpeed+Math.abs(wind.strength)*0.002;
    drawPetal(p);
  });
  petalAnim=requestAnimationFrame(animatePetals);
}
function startPetals(){
  if(petalActive||!petalCanvas)return;
  petalActive=true;petalCanvas.style.display='block';animatePetals();
}

// ===== 初期化 =====
window.addEventListener('DOMContentLoaded',function(){
  initDateSel();
});
</script>
