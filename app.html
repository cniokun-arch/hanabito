<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>花人占術 — マイページ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;700&family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#b8860b;--gold2:#d4a017;--gold-light:rgba(184,134,11,0.15);
  --purple:#7c3aed;--ink:#1a1208;--ink2:#4a3c28;--ink3:#7a6b52;
  --bg:#faf6ef;--bg2:#f2ead8;--bg3:#e8dcc4;
  --green:#1a6b3a;--red:#8b1a1a;
}
html,body{height:100%;background:var(--bg);font-family:'Noto Serif JP',serif;color:var(--ink)}

/* ===== SCREENS ===== */
.screen{display:none}
.screen.active{display:block}

/* ===== LOGIN ===== */
#screen-login{
  background:linear-gradient(160deg,#1a0830 0%,#2a1a4a 40%,#3a2a00 100%);
  position:fixed;inset:0;z-index:9000;overflow-y:auto;
  display:none;align-items:center;justify-content:center;padding:2rem 1rem
}
#screen-login.active{display:flex}
.login-box{width:min(380px,100%);text-align:center}
.login-logo{font-family:'Zen Old Mincho',serif;font-size:2.2rem;letter-spacing:0.4em;color:#e8d9b0;font-weight:700;margin-bottom:0.3rem}
.login-sub{font-size:0.82rem;color:rgba(232,217,176,0.6);letter-spacing:0.25em;margin-bottom:2.5rem}
.login-card{background:rgba(255,255,255,0.06);border:1px solid rgba(184,134,11,0.35);border-radius:16px;padding:2rem 1.8rem;backdrop-filter:blur(8px)}
.login-tabs{display:flex;border-bottom:1px solid rgba(184,134,11,0.3);margin-bottom:1.5rem}
.login-tab{flex:1;padding:0.6rem;font-family:'Noto Serif JP',serif;font-size:0.88rem;color:rgba(232,217,176,0.55);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;background:none;border-top:none;border-left:none;border-right:none}
.login-tab.active{color:#e8d9b0;border-bottom-color:var(--gold)}
.login-field{margin-bottom:1rem;text-align:left}
.login-field label{display:block;font-size:0.75rem;color:rgba(232,217,176,0.6);margin-bottom:0.4rem;letter-spacing:0.1em}
.login-field input,.login-field select{width:100%;padding:0.65rem 0.9rem;background:rgba(255,255,255,0.08);border:1px solid rgba(184,134,11,0.4);border-radius:8px;color:#e8d9b0;font-family:'Noto Serif JP',serif;font-size:0.95rem;outline:none}
.login-field input:focus,.login-field select:focus{border-color:var(--gold)}
.login-field input::placeholder{color:rgba(232,217,176,0.3)}
.login-field select option{background:#2a1a4a;color:#e8d9b0}
.login-date-row{display:flex;gap:0.4rem}
.login-date-row select{flex:1;font-size:0.82rem;padding:0.55rem 0.3rem}
.btn-login{width:100%;padding:0.9rem;background:linear-gradient(135deg,var(--purple),var(--gold));color:#fff;border:none;border-radius:10px;font-family:'Zen Old Mincho',serif;font-size:1rem;letter-spacing:0.2em;cursor:pointer;margin-top:0.5rem;transition:opacity 0.2s}
.btn-login:hover{opacity:0.88}
.login-note{font-size:0.72rem;color:rgba(232,217,176,0.4);margin-top:1rem;line-height:1.8}
.login-err{background:rgba(180,40,40,0.2);border:1px solid rgba(180,40,40,0.5);color:#ffaaaa;border-radius:6px;padding:0.6rem 0.9rem;font-size:0.82rem;margin-bottom:0.8rem;display:none}

/* ===== MAIN LAYOUT ===== */
#screen-main{padding-bottom:70px}
#screen-main.active{display:block}

/* ===== TOP HEADER ===== */
.top-header{
  background:linear-gradient(135deg,#1a0830,var(--purple) 55%,var(--gold));
  padding:0.8rem 1rem 0.6rem;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100
}
.top-header-title{font-family:'Zen Old Mincho',serif;font-size:1rem;color:#fff;letter-spacing:0.2em}
.top-header-right{display:flex;align-items:center;gap:0.6rem}
.top-header-name{font-size:0.8rem;color:rgba(255,255,255,0.8)}
.btn-logout{font-size:0.72rem;padding:4px 10px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.4);border-radius:10px;color:#fff;cursor:pointer}

/* ===== MEMBER TABS ===== */
.member-tab-bar{background:var(--bg2);border-bottom:2px solid var(--gold-light);display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 0.5rem}
.member-tab-bar::-webkit-scrollbar{height:2px}
.member-tab{flex-shrink:0;padding:0.6rem 0.9rem;font-size:0.78rem;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all 0.15s;background:none;border-top:none;border-left:none;border-right:none;font-family:'Noto Serif JP',serif}
.member-tab.active{color:var(--gold);border-bottom-color:var(--gold);font-weight:700}
.member-tab-add{flex-shrink:0;padding:0.6rem 0.8rem;font-size:0.78rem;color:var(--purple);cursor:pointer;white-space:nowrap;background:none;border:none;font-family:'Noto Serif JP',serif}

/* ===== PAGE SECTIONS ===== */
.page{display:none;padding:1rem 1rem 1.5rem}
.page.active{display:block}

/* ===== CARDS ===== */
.card{background:#fff;border:1px solid rgba(184,134,11,0.2);border-radius:12px;padding:1.1rem;margin-bottom:1rem;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.card-title{font-family:'Zen Old Mincho',serif;font-size:0.88rem;letter-spacing:0.15em;color:var(--gold);border-bottom:1px solid var(--gold-light);padding-bottom:0.4rem;margin-bottom:0.8rem}

/* ===== TODAY UNKI WIDGET ===== */
.unki-tabs{display:flex;gap:0;margin-bottom:0.8rem;border-radius:8px;overflow:hidden;border:1.5px solid rgba(184,134,11,0.4)}
.unki-tab{flex:1;padding:8px 0;text-align:center;font-size:0.82rem;font-weight:600;border:none;background:var(--bg2);color:var(--ink3);cursor:pointer;transition:all 0.2s;border-right:1px solid rgba(184,134,11,0.3);font-family:'Noto Serif JP',serif}
.unki-tab:last-child{border-right:none}
.unki-tab.active{background:var(--gold);color:#fff;font-weight:700}
.unki-tab:not(.active):hover{background:var(--bg3)}
.unki-body{min-height:80px}
.unki-main{font-family:'Zen Old Mincho',serif;font-size:1.6rem;font-weight:700}
.unki-bars{display:flex;gap:2px;margin:4px 0}
.unki-bar{width:15px;height:7px;border-radius:2px}

/* ===== MEISHIKI ===== */
.meishiki-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(184,134,11,0.2);border:1px solid rgba(184,134,11,0.2);border-radius:4px;overflow:hidden;margin-bottom:0.8rem}
.ms-col{background:var(--bg);padding:0.7rem 0.4rem;text-align:center}
.ms-lbl{font-size:0.65rem;color:var(--ink3);margin-bottom:0.4rem}
.ms-ks{font-family:'Zen Old Mincho',serif;font-size:1.6rem}
.ms-zo{font-size:0.68rem;color:var(--ink2);margin-top:0.25rem}
.ms-th{font-size:0.75rem;color:#7a1a1a;margin-top:0.2rem}
.ms-ju{font-size:0.75rem;margin-top:0.15rem}

/* ===== DAIUN TABLE ===== */
.daiun-table{width:100%;border-collapse:collapse;font-size:0.75rem}
.daiun-table th{background:var(--bg3);color:var(--ink2);padding:0.4rem 0.3rem;border:1px solid rgba(184,134,11,0.2);font-weight:500;font-size:0.68rem;text-align:center}
.daiun-table td{text-align:center;padding:0.38rem 0.25rem;border:1px solid rgba(184,134,11,0.12)}
.daiun-table tr.current td{background:rgba(184,134,11,0.1)!important}
.daiun-table tr.sk td{background:rgba(124,58,237,0.06)!important}

/* ===== COMPAT PAGE ===== */
.compat-person-card{background:var(--bg2);border:1px solid rgba(184,134,11,0.25);border-radius:10px;padding:0.9rem;margin-bottom:0.8rem}
.compat-person-card .cpc-label{font-size:0.72rem;color:var(--ink3);letter-spacing:0.1em;margin-bottom:0.5rem;font-weight:700}
.compat-select-row{display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap}
.compat-select-row select,.compat-select-row input{font-size:0.85rem;padding:0.5rem 0.6rem;border:1px solid rgba(184,134,11,0.3);border-radius:6px;background:#fff;color:var(--ink);outline:none;font-family:'Noto Serif JP',serif}
.compat-date-row{display:flex;gap:0.3rem;margin-top:0.5rem}
.compat-date-row select{flex:1;font-size:0.8rem;padding:0.5rem 0.25rem;border:1px solid rgba(184,134,11,0.3);border-radius:6px;background:#fff;color:var(--ink);outline:none}
.compat-result{background:#fff;border:1px solid rgba(184,134,11,0.2);border-radius:12px;padding:1.1rem;margin-top:0.8rem}
.compat-score-row{display:flex;gap:0.8rem;margin-bottom:1rem}
.compat-score-card{flex:1;text-align:center;padding:0.8rem 0.5rem;border-radius:8px}
.compat-score-card .cs-mark{font-size:1.8rem;font-weight:700}
.compat-score-card .cs-label{font-size:0.7rem;color:var(--ink3);margin-top:0.3rem}
.compat-fixed-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.5rem;margin-bottom:0.8rem}
.compat-fixed-item{background:var(--bg2);border-radius:8px;padding:0.6rem;text-align:center}
.cfi-lbl{font-size:0.65rem;color:var(--ink3);margin-bottom:0.3rem}
.cfi-val{font-size:0.95rem;font-weight:700}
.compat-now-section{background:var(--bg2);border-radius:8px;padding:0.8rem;margin-bottom:0.8rem}
.ai-compat-area{border-top:1px solid rgba(184,134,11,0.15);padding-top:0.8rem}

/* ===== AI CHAT ===== */
.ai-messages{display:flex;flex-direction:column;gap:10px;padding:0.8rem;min-height:200px;max-height:50vh;overflow-y:auto}
.ai-msg{max-width:88%;padding:8px 12px;border-radius:10px;font-size:0.82rem;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.ai-msg.user{background:linear-gradient(135deg,var(--purple),#6d28d9);color:#fff;align-self:flex-end;border-bottom-right-radius:2px}
.ai-msg.ai{background:#fff;border:1px solid rgba(184,134,11,0.2);color:var(--ink);align-self:flex-start;border-bottom-left-radius:2px}
.ai-msg.loading{color:var(--ink3);font-style:italic;align-self:flex-start}
.ai-input-area{display:flex;gap:6px;padding:0.7rem;border-top:1px solid rgba(184,134,11,0.15);background:var(--bg2)}
.ai-input-area textarea{flex:1;font-size:0.9rem;padding:7px 10px;border:1px solid rgba(184,134,11,0.3);border-radius:6px;resize:none;height:56px;font-family:'Noto Serif JP',serif;background:#fff;color:var(--ink);outline:none}
.ai-send-btn{padding:0 14px;background:linear-gradient(135deg,var(--purple),var(--gold));color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:1.1rem}
.ai-quick{padding:4px 8px;display:flex;flex-wrap:wrap;gap:4px;border-top:1px solid rgba(184,134,11,0.1);background:var(--bg)}
.ai-quick button{font-size:0.68rem;padding:3px 8px;background:#fff;border:1px solid rgba(124,58,237,0.3);border-radius:12px;cursor:pointer;color:var(--purple);font-family:'Noto Serif JP',serif}

/* ===== SETTINGS ===== */
.setting-section{background:#fff;border:1px solid rgba(184,134,11,0.2);border-radius:12px;padding:1.1rem;margin-bottom:1rem}
.setting-section h3{font-family:'Zen Old Mincho',serif;font-size:0.88rem;color:var(--gold);margin-bottom:0.8rem}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:0.6rem 0;border-bottom:1px solid rgba(184,134,11,0.1)}
.setting-row:last-child{border-bottom:none}
.setting-row label{font-size:0.85rem;color:var(--ink2)}
.theme-btns{display:flex;gap:0.4rem}
.theme-btn{padding:4px 12px;border-radius:6px;font-size:0.78rem;cursor:pointer;border:1px solid rgba(184,134,11,0.35);font-family:'Noto Serif JP',serif;background:var(--bg2);color:var(--ink2)}
.theme-btn.active{background:var(--gold);color:#fff;border-color:var(--gold)}
.history-list{display:flex;flex-direction:column;gap:0.5rem;max-height:300px;overflow-y:auto}
.history-item{background:var(--bg2);border-radius:6px;padding:0.6rem 0.8rem;font-size:0.78rem;color:var(--ink2);line-height:1.6}
.history-item .hi-date{font-size:0.68rem;color:var(--ink3);margin-bottom:0.2rem}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:#fff;border-top:1px solid rgba(184,134,11,0.2);
  display:flex;z-index:200;
  box-shadow:0 -2px 12px rgba(0,0,0,0.08)
}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:0.45rem 0.3rem 0.5rem;cursor:pointer;transition:all 0.15s;background:none;border:none;font-family:'Noto Serif JP',serif}
.nav-btn .nav-icon{font-size:1.25rem;line-height:1}
.nav-btn .nav-lbl{font-size:0.58rem;color:var(--ink3);margin-top:2px;letter-spacing:0.05em}
.nav-btn.active .nav-lbl{color:var(--gold);font-weight:700}
.nav-btn.active .nav-icon{filter:none}

/* ===== MEMBER MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:500;display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:var(--bg);border-radius:16px 16px 0 0;padding:1.5rem 1.2rem 2rem;width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
.modal-handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 1.2rem}
.modal-title{font-family:'Zen Old Mincho',serif;font-size:1rem;color:var(--gold);margin-bottom:1rem}
.modal-field{margin-bottom:0.8rem}
.modal-field label{display:block;font-size:0.75rem;color:var(--ink3);margin-bottom:0.35rem}
.modal-field input,.modal-field select{width:100%;padding:0.6rem 0.8rem;border:1px solid rgba(184,134,11,0.35);border-radius:8px;font-family:'Noto Serif JP',serif;font-size:0.92rem;color:var(--ink);background:#fff;outline:none}
.modal-date-row{display:flex;gap:0.35rem}
.modal-date-row select{flex:1;font-size:0.82rem;padding:0.55rem 0.25rem}
.btn-primary{width:100%;padding:0.9rem;background:linear-gradient(135deg,var(--purple),var(--gold));color:#fff;border:none;border-radius:10px;font-family:'Zen Old Mincho',serif;font-size:0.95rem;letter-spacing:0.15em;cursor:pointer;margin-top:0.5rem}
.btn-secondary{width:100%;padding:0.75rem;background:var(--bg2);color:var(--ink2);border:1px solid rgba(184,134,11,0.3);border-radius:10px;font-family:'Noto Serif JP',serif;font-size:0.88rem;cursor:pointer;margin-top:0.5rem}
.btn-danger{background:#fff0f0;color:#c0392b;border:1px solid rgba(192,57,43,0.3)}

/* ===== ROKKA COLORS ===== */
.rokka-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:0.75rem;font-weight:700}
.rokka-天花人{background:#e8f0e4;color:#2d5a1b;border:1px solid #5a8c3a}
.rokka-白花人{background:#ebebf5;color:#2b2b7a;border:1px solid #6b6bbf}
.rokka-離花人{background:#f5e8e8;color:#7a1a1a;border:1px solid #c04040}
.rokka-風花人{background:#eef5e8;color:#3a6b1a;border:1px solid #7aaa4a}
.rokka-仙花人{background:#e8f2f5;color:#1a4a6b;border:1px solid #4a8aaa}
.rokka-水花人{background:#e8ecf5;color:#1a2a7a;border:1px solid #5a6abf}

/* ===== LOADING ===== */
.dots span{animation:dot 1.4s infinite;display:inline-block}
.dots span:nth-child(2){animation-delay:0.2s}
.dots span:nth-child(3){animation-delay:0.4s}
@keyframes dot{0%,80%,100%{opacity:0.3;transform:scale(0.8)}40%{opacity:1;transform:scale(1)}}

/* ===== GRAPH LINK BUTTON ===== */
.graph-link-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0.8rem 1rem;background:#fff;border:1.5px solid var(--gold);border-radius:10px;color:var(--gold);font-family:'Zen Old Mincho',serif;font-size:0.88rem;cursor:pointer;text-decoration:none;margin-top:0.5rem}
.graph-link-btn:hover{background:rgba(184,134,11,0.06)}

/* ===== INFO ROW ===== */
.info-3grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.6rem;margin-bottom:0.8rem}
.info-chip{background:var(--bg2);border:1px solid rgba(184,134,11,0.25);border-radius:8px;padding:0.6rem 0.5rem;text-align:center}
.info-chip .ic-lbl{font-size:0.65rem;color:var(--ink3);margin-bottom:0.25rem}
.info-chip .ic-val{font-size:0.95rem;color:var(--ink);font-weight:500}

/* ===== RESPONSIVE ===== */
@media(max-width:480px){
  .compat-fixed-row{grid-template-columns:1fr 1fr}
  .info-3grid{grid-template-columns:1fr 1fr}
}

/* ===== THEMES ===== */
/* ゴールドテーマ */
body.theme-gold{
  --bg:#fdf8ef;--bg2:#fdf0d8;--bg3:#f5e6c0;
  --ink:#2a1c08;--ink2:#7a6b52;--ink3:#9a8a6a;
  --gold:#b8860b;--gold2:#d4a017;--gold-light:rgba(184,134,11,0.15);
  --purple:#7c3aed
}
body.theme-gold .card,body.theme-gold .setting-section,body.theme-gold .compat-result{background:#fffdf5}
body.theme-gold .bottom-nav{background:#fffdf5}
body.theme-gold .modal-box{background:#fdf8ef}
body.theme-gold .top-header{background:linear-gradient(135deg,#5a3800,#b8860b 55%,#d4a017)}
/* ダークテーマ */
body.theme-dark{
  --bg:#0b0a08;--bg2:#14120e;--bg3:#1c1914;
  --ink:#f4f0ea;--ink2:#b5ae9f;--ink3:#7a7060;
  --gold:#e6c687;--gold2:#b89146;--gold-light:rgba(230,198,135,0.15);
  --purple:#a78bfa
}
body.theme-dark .card,body.theme-dark .setting-section,body.theme-dark .compat-result{background:#14120e}
body.theme-dark .ai-msg.ai{background:#14120e;color:var(--ink)}
body.theme-dark .bottom-nav{background:#14120e;border-top-color:rgba(230,198,135,0.15)}
body.theme-dark .modal-box{background:#14120e}
body.theme-dark .top-header{background:linear-gradient(135deg,#0b0a08,#1c1914 55%,#2a2010)}
body.theme-dark input,body.theme-dark select,body.theme-dark textarea{background:rgba(255,255,255,0.06)!important;color:var(--ink)!important;border-color:rgba(230,198,135,0.2)!important}
body.theme-dark .login-card{background:rgba(255,255,255,0.04)}
body.theme-dark .ai-input-area{background:#1c1914}

/* ===== 花びら演出 ===== */
#petalCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:50;display:none}
</style>
</head>
<body>
<canvas id="petalCanvas"></canvas>

<!-- ===== GLOBAL ERROR ===== -->
<div id="errmsg" style="display:none;position:fixed;top:0;left:0;right:0;background:#fff0f0;border-bottom:2px solid #c00;color:#900;padding:0.7rem 1rem;font-size:0.82rem;z-index:9999;word-break:break-all"></div>

<!-- ===== LOGIN SCREEN ===== -->
<div id="screen-login" class="screen active">
  <div class="login-box">
    <div class="login-logo">花人占術</div>
    <div class="login-sub">HANA-BITO SENJUTSU</div>
    <div class="login-card">
      <div class="login-tabs">
        <button class="login-tab active" onclick="switchLoginTab('login',this)">ログイン</button>
        <button class="login-tab" onclick="switchLoginTab('register',this)">新規登録</button>
      </div>
      <div id="login-err" class="login-err"></div>

      <!-- ログイン -->
      <div id="login-form">
        <div class="login-field">
          <label>ニックネーム</label>
          <input type="text" id="login-nick" placeholder="登録したニックネーム" autocomplete="username">
        </div>
        <div class="login-field">
          <label>PINコード（4桁）</label>
          <input type="password" id="login-pin" placeholder="0000〜9999" maxlength="4" inputmode="numeric" autocomplete="current-password">
        </div>
        <button class="btn-login" onclick="doLogin()">ログイン</button>
      </div>

      <!-- 新規登録 -->
      <div id="register-form" style="display:none">
        <div class="login-field">
          <label>ニックネーム</label>
          <input type="text" id="reg-nick" placeholder="あなたの呼び名" autocomplete="username">
        </div>
        <div class="login-field">
          <label>PINコード（4桁）</label>
          <input type="password" id="reg-pin" placeholder="4桁の数字を設定" maxlength="4" inputmode="numeric" autocomplete="new-password">
        </div>
        <div class="login-field">
          <label>生年月日</label>
          <div class="login-date-row">
            <select id="reg-y"><option value="">年</option></select>
            <select id="reg-m"><option value="">月</option></select>
            <select id="reg-d"><option value="">日</option></select>
          </div>
        </div>
        <div class="login-field">

const TROPICAL_YEAR_MS=365.24219879*86400000;

function getSetsuDate(y,m){var b=SETSU_BASE_MS[m-1],by=m<=3?2001:2000;return new Date(b+(y-by)*TROPICAL_YEAR_MS);}
function getDaysFromSetsu(y,m,d){var bd=new Date(y,m-1,d),s=getSetsuDate(y,m),sD=new Date(s.getFullYear(),s.getMonth(),s.getDate());if(bd>=sD)return Math.round((bd-sD)/86400000);var pm=m-1,py=y;if(pm<1){pm=12;py--;}var ps=getSetsuDate(py,pm),psD=new Date(ps.getFullYear(),ps.getMonth(),ps.getDate());return Math.max(0,Math.round((bd-psD)/86400000));}
function getDayKS(y,m,d){var diff=Math.round((new Date(y,m-1,d)-new Date(1900,0,1))/86400000);return ROKUJU[((diff+10)%60+60)%60];}
function getYearKS(y,m,d){var bd=new Date(y,m-1,d),rs=getSetsuDate(y,2),rsD=new Date(rs.getFullYear(),rs.getMonth(),rs.getDate());return ROKUJU[(((bd>=rsD?y:y-1)-1984)%60+60)%60];}
function getMonthKS(y,m,d){var bd=new Date(y,m-1,d),s=getSetsuDate(y,m),sD=new Date(s.getFullYear(),s.getMonth(),s.getDate());var mo=m,yo=y;if(bd<sD){mo--;if(mo<1){mo=12;yo--;}}var rs=getSetsuDate(yo,2),rsD=new Date(rs.getFullYear(),rs.getMonth(),rs.getDate());var refY=new Date(yo,Math.max(0,mo-1),1)>=rsD?yo:yo-1;var yk=ROKUJU[((refY-1984)%60+60)%60];var mkBase=[2,4,6,8,0][JIKKAN.indexOf(yk[0])%5];var mo2=(mo<=0?mo+12:mo)===1?11:(mo<=0?mo+12:mo)-2;return JIKKAN[(mkBase+mo2)%10]+JUNISHI[(2+mo2)%12];}
function getZokan(shi,days){var col=ZOKAN_SHI.indexOf(shi);if(col<0)return '—';var k=ZOKAN_DATA[0][1][col];for(var i=0;i<ZOKAN_DATA.length;i++){if(days>=ZOKAN_DATA[i][0])k=ZOKAN_DATA[i][1][col];}return k;}
function getJuniUnki(ht,shi){var s=TEISHI[ht];if(s===undefined)return '—';var si=JUNISHI.indexOf(shi);if(si<0)return '—';return JUNI_NAMES[(si-s+12)%12]||'—';}

// doCalc: 生年月日・性別からGオブジェクト生成
function doCalc(y,m,d,gender){
  var nenKS=getYearKS(y,m,d),nenKan=nenKS[0],nenShi=nenKS[1],nenKanIdx=JIKKAN.indexOf(nenKan);
  var tsuKS=getMonthKS(y,m,d),tsuKan=tsuKS[0],tsuShi=tsuKS[1],tsuKanIdx=JIKKAN.indexOf(tsuKan),tsuShiIdx=JUNISHI.indexOf(tsuShi);
  var nichiKS=getDayKS(y,m,d),nichiKan=nichiKS[0],nichiShi=nichiKS[1],nichiKanIdx=JIKKAN.indexOf(nichiKan);
  var dfs=getDaysFromSetsu(y,m,d);
  var T=TSUHEN[nichiKanIdx]||TSUHEN[0];
  var nZ=getZokan(nenShi,dfs),tZ=getZokan(tsuShi,dfs),niZ=getZokan(nichiShi,0);
  var ht=getHoshiType(y,m,d),hn=getHoshiName(y,m,d),sats=SATSKAI[hn]||[];
  var nJu=getJuniUnki(ht,nenShi),tJu=getJuniUnki(ht,tsuShi),niJu=getJuniUnki(ht,nichiShi);
  var nenNum=ROKUJU.indexOf(nenKS)+1,isYo=nenNum%2===1,isFwd=(isYo&&gender==='男')||(!isYo&&gender==='女');
  var sa=getDaiunStartAge(y,m,d,isFwd);
  var DL=[];
  for(var i=0;i<=14;i++){var ki,si;if(isFwd){ki=(tsuKanIdx+i)%10;si=(tsuShiIdx+i)%12;}else{ki=((tsuKanIdx-i)%10+10)%10;si=((tsuShiIdx-i)%12+12)%12;}DL.push({ks:JIKKAN[ki]+JUNISHI[si],kan:JIKKAN[ki],shi:JUNISHI[si]});}
  var A2D=[],A2K=[];var ap=0;
  for(var di=0;di<DL.length&&ap<MAX_AGE;di++){var sp=Math.min(di===0?sa:10,MAX_AGE-ap);for(var a=0;a<sp;a++,ap++){A2D.push(DL[di]);A2K.push(di);}}
  while(A2D.length<MAX_AGE){A2D.push(DL[DL.length-1]);A2K.push(A2K[A2K.length-1]);}
  return {y,m,d,gender,ht,nenKS,tsuKS,nichiKS,nenShi,tsuShi,nichiShi,nenKan,tsuKan,nichiKan,nZ,tZ,niZ,T,DL,A2D,sa,sats,isFwd,dfs};
}

// 今日・今月・今年・大運の十二運気
function getCurrentUnki(G){
  var now=new Date(),cy=now.getFullYear(),cm=now.getMonth()+1,cd=now.getDate();
  var dayKS=getDayKS(cy,cm,cd),dayJu=getJuniUnki(G.ht,dayKS[1]);
  var monKS=getMonthKS(cy,cm,cd),monJu=getJuniUnki(G.ht,monKS[1]);
  var yrKS=getYearKS(cy,cm,cd),yrJu=getJuniUnki(G.ht,yrKS[1]);
  var age=cy-G.y;
  var currDaiun=G.DL[0];
  var ap=0;
  for(var di=0;di<G.DL.length;di++){var sp=di===0?G.sa:10;if(age>=ap&&age<ap+sp){currDaiun=G.DL[di];break;}ap+=sp;}
  var daiJu=getJuniUnki(G.ht,currDaiun.shi);
  return {dayKS,dayJu,monKS,monJu,yrKS,yrJu,age,currDaiun,daiJu};
}

// 大運テーブル用データ
function getDaiunRows(G){
  var now=new Date().getFullYear();
  var rows=[];
  var ap=0;
  for(var di=0;di<G.DL.length&&ap<MAX_AGE;di++){
    var sp=di===0?G.sa:10;
    var sp2=Math.min(sp,MAX_AGE-ap);
    var dk=G.DL[di];
    var ju=getJuniUnki(G.ht,dk.shi);
    var startY=G.y+ap,endY=G.y+ap+sp2-1;
    var isCurr=now>=startY&&now<=endY;
    var isSk=G.sats.indexOf(dk.shi)>=0;
    rows.push({age:ap,sp:sp2,ks:dk.ks,shi:dk.shi,ju,startY,endY,isCurr,isSk,th:(G.T||[])[JIKKAN.indexOf(dk.kan)]||'—'});
    ap+=sp2;
  }
  return rows;
}

  save:function(data){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));}catch(e){}}
};
function initData(nick,y,m,d,gender){
  var G=doCalc(y,m,d,gender);
  return {
    account:{nickname:nick,birthday:{y,m,d},gender,G,_profile:{personality:[],concerns:[],preferences:[],lifestage:'',history:[]}},
    people:[],
    settings:{theme:'default'}
  };
}
function getAccountG(){var data=S.load();return data&&data.account?data.account.G:null;}
function getPeopleGs(){var data=S.load();if(!data||!data.people)return [];return data.people.map(function(p){return{id:p.id,nickname:p.nickname,relation:p.relation,G:p.G};});}
function getCurrentTargetG(){
  // 現在選択中のメンバーのG（自分=account, 登録者=people[n]）
  var data=S.load();if(!data)return null;
  if(currentMemberIdx===0)return data.account.G;
  var p=data.people[currentMemberIdx-1];
  return p?p.G:null;
}
function getCurrentTargetName(){
  var data=S.load();if(!data)return '';
  if(currentMemberIdx===0)return data.account.nickname;
  var p=data.people[currentMemberIdx-1];
  return p?p.nickname:'';
}
</script>
<script>
// ============================================================
// APP STATE
// ============================================================
var currentNav='home';
var currentMemberIdx=0;
var aiHistory=[];
var KB={};
var WORKER_BASE='https://polished-flower-2524.cniokun.workers.dev';

// KB読み込み
async function loadKB(){
  try{
    var res=await fetch(WORKER_BASE+'/api/kb');
    if(res.ok)KB=await res.json();
  }catch(e){}
}

// ============================================================
// LOGIN / REGISTER
// ============================================================
function initYearSelect(selId,from,to){
  var sel=document.getElementById(selId);
  if(!sel)return;
  for(var y=to;y>=from;y--){var o=document.createElement('option');o.value=y;o.textContent=y+'年';sel.appendChild(o);}
}
function initMonthSelect(selId){
  var sel=document.getElementById(selId);
  if(!sel)return;
  for(var m=1;m<=12;m++){var o=document.createElement('option');o.value=m;o.textContent=m+'月';sel.appendChild(o);}
}
function initDaySelect(selId){
  var sel=document.getElementById(selId);
  if(!sel)return;
  for(var d=1;d<=31;d++){var o=document.createElement('option');o.value=d;o.textContent=d+'日';sel.appendChild(o);}
}
function switchLoginTab(tab,btn){
  document.querySelectorAll('.login-tab').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('login-form').style.display=tab==='login'?'block':'none';
  document.getElementById('register-form').style.display=tab==='register'?'block':'none';
  document.getElementById('login-err').style.display='none';
}
function doLogin(){
  var nick=document.getElementById('login-nick').value.trim();
  var pin=document.getElementById('login-pin').value.trim();
  var data=S.load();
  var err=document.getElementById('login-err');
  if(!nick){err.textContent='ニックネームを入力してください';err.style.display='block';return;}
  if(!pin){err.textContent='PINコードを入力してください';err.style.display='block';return;}
  if(!data||!data.account){err.textContent='登録が見つかりません。新規登録してください。';err.style.display='block';return;}
  if(data.account.nickname!==nick){err.textContent='ニックネームが一致しません。';err.style.display='block';return;}
  if(data.account.pin&&data.account.pin!==pin){err.textContent='PINコードが違います。';err.style.display='block';return;}
  startApp(data);
}
function doRegister(){
  var nick=document.getElementById('reg-nick').value.trim();
  var pin=document.getElementById('reg-pin').value.trim();
  var y=+document.getElementById('reg-y').value;
  var m=+document.getElementById('reg-m').value;
  var d=+document.getElementById('reg-d').value;
  var gender=document.getElementById('reg-gender').value;
  var err=document.getElementById('login-err');
  if(!nick){err.textContent='ニックネームを入力してください';err.style.display='block';return;}
  if(!pin||pin.length!==4||!/^\d{4}$/.test(pin)){err.textContent='PINコードは4桁の数字で設定してください';err.style.display='block';return;}
  if(!y||!m||!d){err.textContent='生年月日を入力してください';err.style.display='block';return;}
  var data=initData(nick,y,m,d,gender);
  data.account.pin=pin;
  S.save(data);
  startApp(data);
}
function doLogout(){
  document.getElementById('screen-main').classList.remove('active');
  document.getElementById('screen-login').classList.add('active');
  stopPetals();
  currentMemberIdx=0;aiHistory=[];
}
function startApp(data){
  // Gが未計算または不正な場合、再計算
  try{
    var b=data.account.birthday,g=data.account.gender;
    var by=+(b&&b.y),bm=+(b&&b.m),bd=+(b&&b.d);
    if(!data.account.G||!data.account.G.ht||!data.account.G.nenKS){
      if(!by||!bm||!bd){
        // データ破損 → ログアウト状態に戻す
        S.save(null);localStorage.removeItem(STORAGE_KEY);
        return;
      }
      data.account.G=doCalc(by,bm,bd,g);
      S.save(data);
    }
  }catch(e){
    // データ破損時はリセット
    localStorage.removeItem(STORAGE_KEY);
    return;
  }
  // 登録メンバーも同様
  (data.people||[]).forEach(function(p,i){
    try{
      var b=p.birthday;
      var by=+(b&&b.y),bm=+(b&&b.m),bd=+(b&&b.d);
      if((!p.G||!p.G.ht||!p.G.nenKS)&&by&&bm&&bd){
        data.people[i].G=doCalc(by,bm,bd,p.gender);
      }
    }catch(e){}
  });
  S.save(data);
  document.getElementById('screen-login').classList.remove('active');
  document.getElementById('screen-main').classList.add('active');
  document.getElementById('header-name').textContent=data.account.nickname;
  if(!data.settings||data.settings.petals!==false)startPetals();
  currentMemberIdx=0;
  loadKB();
  renderMemberTabs();
  switchNav('home',document.querySelector('.nav-btn'));
}
</script>
<script>
// ============================================================
// MEMBER MANAGEMENT
// ============================================================
function renderMemberTabs(){
  var data=S.load();if(!data)return;
  var bar=document.getElementById('member-tab-bar');
  bar.innerHTML='';
  // 自分
  var selfBtn=document.createElement('button');
  selfBtn.className='member-tab'+(currentMemberIdx===0?' active':'');
  selfBtn.textContent=data.account.nickname;
  selfBtn.onclick=(function(i){return function(){switchMember(i);};})(0);
  bar.appendChild(selfBtn);
  // 登録メンバー
  (data.people||[]).forEach(function(p,i){
    var btn=document.createElement('button');
    btn.className='member-tab'+(currentMemberIdx===i+1?' active':'');
    btn.textContent=p.nickname;
    btn.onclick=(function(idx){return function(){switchMember(idx);};})(i+1);
    // 長押しで編集
    btn.oncontextmenu=function(e){e.preventDefault();openMemberModal(i+1);};
    bar.appendChild(btn);
  });
  // 追加ボタン
  var addBtn=document.createElement('button');
  addBtn.className='member-tab-add';
  addBtn.textContent='＋ 追加';
  addBtn.onclick=function(){openMemberModal(-1);};
  bar.appendChild(addBtn);
}
function switchMember(idx){
  currentMemberIdx=idx;
  renderMemberTabs();
  renderCurrentPage();
}

var editingMemberIdx=-1;
function openMemberModal(idx){
  editingMemberIdx=idx;
  var data=S.load();
  var modal=document.getElementById('member-modal');
  var delBtn=document.getElementById('mm-del-btn');
  document.getElementById('mm-err').style.display='none';
  if(idx===-1){
    // 新規
    document.getElementById('member-modal-title').textContent='人物を追加';
    document.getElementById('mm-nick').value='';
    document.getElementById('mm-rel').value='気になる人';
    document.getElementById('mm-y').value='';
    document.getElementById('mm-m').value='';
    document.getElementById('mm-d').value='';
    document.getElementById('mm-gender').value='男';
    delBtn.style.display='none';
  } else {
    // 編集（idx は 1始まりのpeople配列インデックス）
    var p=data.people[idx-1];
    document.getElementById('member-modal-title').textContent=p.nickname+'を編集';
    document.getElementById('mm-nick').value=p.nickname;
    document.getElementById('mm-rel').value=p.relation||'その他';
    document.getElementById('mm-y').value=p.birthday.y;
    document.getElementById('mm-m').value=p.birthday.m;
    document.getElementById('mm-d').value=p.birthday.d;
    document.getElementById('mm-gender').value=p.gender;
    delBtn.style.display='block';
  }
  modal.style.display='flex';
}
function closeMemberModal(){document.getElementById('member-modal').style.display='none';}
function saveMember(){
  var nick=document.getElementById('mm-nick').value.trim();
  var rel=document.getElementById('mm-rel').value;
  var y=+document.getElementById('mm-y').value;
  var m=+document.getElementById('mm-m').value;
  var d=+document.getElementById('mm-d').value;
  var gender=document.getElementById('mm-gender').value;
  var err=document.getElementById('mm-err');
  if(!nick){err.textContent='名前を入力してください';err.style.display='block';return;}
  if(!y||!m||!d){err.textContent='生年月日を入力してください';err.style.display='block';return;}
  var data=S.load();
  var G=doCalc(y,m,d,gender);
  var person={nickname:nick,relation:rel,birthday:{y,m,d},gender,G,id:Date.now(),_profile:{personality:[],concerns:[],preferences:[],lifestage:'',history:[]}};
  if(editingMemberIdx===-1){
    if((data.people||[]).length>=5){err.textContent='登録できるのは最大5人です';err.style.display='block';return;}
    if(!data.people)data.people=[];
    data.people.push(person);
  } else {
    person.id=data.people[editingMemberIdx-1].id;
    person._profile=data.people[editingMemberIdx-1]._profile||person._profile;
    data.people[editingMemberIdx-1]=person;
  }
  S.save(data);
  closeMemberModal();
  renderMemberTabs();
  renderCurrentPage();
}
function deleteMember(){
  if(!confirm('この人物を削除しますか？'))return;
  var data=S.load();
  data.people.splice(editingMemberIdx-1,1);
  S.save(data);
  if(currentMemberIdx===editingMemberIdx)currentMemberIdx=0;
  closeMemberModal();
  renderMemberTabs();
  renderCurrentPage();
}
</script>
<script>
// ============================================================
// NAV / PAGE ROUTING
// ============================================================
function switchNav(nav,btn){
  currentNav=nav;
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
  if(btn)btn.classList.add('active');
  renderCurrentPage();
}
function renderCurrentPage(){
  var ca=document.getElementById('content-area');
  if(currentNav==='home')ca.innerHTML=buildHomePage();
  else if(currentNav==='meishiki')ca.innerHTML=buildMeishikiPage();
  else if(currentNav==='compat')ca.innerHTML=buildCompatPage();
  else if(currentNav==='ai'){ca.innerHTML=buildAIPage();initAIPage();}
  else if(currentNav==='setting')ca.innerHTML=buildSettingPage();
}

<script>

// HOME PAGE

  var G=getCurrentTargetG();

  // 大運の通変星（干から計算）
  var daiTh=(G.T||[])[JIKKAN.indexOf(u.currDaiun.kan)]||'—';
  // 情報チップ（4つ）
  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;margin-bottom:0.8rem">'
    +'<div class="info-chip"><div class="ic-lbl">年　齢</div><div class="ic-val">'+u.age+'歳</div></div>'
    +'<div class="info-chip"><div class="ic-lbl">現在の大運</div><div class="ic-val">'+u.currDaiun.ks+'</div></div>'
    +'<div class="info-chip"><div class="ic-lbl">大運の通変星</div><div class="ic-val" style="color:var(--purple)">'+daiTh+'</div></div>'
    +'<div class="info-chip"><div class="ic-lbl">大運の運気</div><div class="ic-val" style="color:'+getJuniColor(u.daiJu)+'">'+u.daiJu+'</div></div>'

  // 相関図リンク（自分タブのみ表示）

  html+='</div>';
  // タブ初期描画はDOMに追加後に実行
  setTimeout(function(){

var currentUnkiTab='day';
function switchUnkiTab(tab){
  currentUnkiTab=tab;
  // タブのactive切り替え
  var tabs=document.querySelectorAll('.unki-tab');
  tabs.forEach(function(el){
    var id=el.id;
    if(id==='ut-day')el.classList.toggle('active',tab==='day');
    else if(id==='ut-mon')el.classList.toggle('active',tab==='month');
    else if(id==='ut-yr')el.classList.toggle('active',tab==='year');
  });
  renderUnkiBody(tab);
}
function renderUnkiBody(tab){
  var body=document.getElementById('unki-body-home');
  if(!body)return;
  var G=getCurrentTargetG();
  if(!G){body.innerHTML='';return;}
  var now=new Date(),y=now.getFullYear(),m=now.getMonth()+1,d=now.getDate();
  var ks,label;
  if(tab==='day'){ks=getDayKS(y,m,d);label='今日の日干支：'+ks;}
  else if(tab==='month'){ks=getMonthKS(y,m,d);label='今月の月干支：'+ks;}
  else{ks=getYearKS(y,m,d);label='今年の年干支：'+ks;}
  var juni=getJuniUnki(G.ht,ks[1]);
  var wave=JUNI_WAVE[juni]||0;
  var color=getJuniColor(juni);
  var bars=Math.round((wave+4)/9*10);
  var barsHtml='<div style="display:flex;gap:2px;margin-top:4px">';
  for(var i=0;i<10;i++)barsHtml+='<div class="unki-bar" style="background:'+(i<bars?color:'rgba(184,134,11,0.15)')+'"></div>';
  barsHtml+='<span style="font-size:0.68rem;color:'+color+';margin-left:4px;font-weight:700">'+(wave>=3?'好調':wave>=0?'普通':'要注意')+'</span></div>';
  body.innerHTML='<div style="display:flex;align-items:flex-start;gap:0.8rem">'
    +'<div style="font-size:2rem;flex-shrink:0">'+(JUNI_EMOJI[juni]||'🌸')+'</div>'
    +'<div style="flex:1">'
    +'<div style="font-size:0.68rem;color:var(--ink3);margin-bottom:2px">'+label+'</div>'
    +'<div style="font-family:\'Zen Old Mincho\',serif;font-size:1.5rem;font-weight:700;color:'+color+'">'+juni+'</div>'
    +barsHtml
    +'<p style="font-size:0.78rem;color:var(--ink2);line-height:1.7;margin-top:0.4rem">'+(JUNI_DESC[juni]||'')+'</p>'
    +'</div></div>';
}

// graph.htmlに登録データを送る

<script>
// ============================================================
// COMPAT PAGE
// ============================================================
var compatG1=null,compatG2=null,compatN1='',compatN2='';
var compatResult=null;

function buildCompatPage(){
  var data=S.load();

  // 人物2

function onCompat1Change(){
  var v=document.getElementById('cp1-sel').value;
  document.getElementById('cp1-new').style.display=v==='new'?'block':'none';
}
function onCompat2Change(){
  var v=document.getElementById('cp2-sel').value;

function getCompatPersonG(prefix){
  var sel=document.getElementById(prefix+'-sel').value;
  var data=S.load();
  var G=null,name='';
  if(sel==='me'){G=data.account.G;name=data.account.nickname;}
  else if(sel.indexOf('p')===0){var idx=+sel.slice(1);G=data.people[idx].G;name=data.people[idx].nickname;}
  else if(sel==='new'){
    var y=+document.getElementById(prefix+'-y').value;
    var m=+document.getElementById(prefix+'-m').value;
    var d=+document.getElementById(prefix+'-d').value;
    var gender=document.getElementById(prefix+'-gender').value;
    var nick=document.getElementById(prefix+'-nick').value.trim()||'相手';
    if(!y||!m||!d)return null;
    G=doCalc(y,m,d,gender);name=nick;
  }
  return G?{G,name}:null;
}

function calcCompat(){
  var r1=getCompatPersonG('cp1'),r2=getCompatPersonG('cp2');
  if(!r1){alert('1人目を選択または入力してください');return;}
  if(!r2){alert('2人目を選択または入力してください');return;}
  compatG1=r1.G;compatG2=r2.G;compatN1=r1.name;compatN2=r2.name;
  var result=buildCompatResult(compatG1,compatG2,compatN1,compatN2);
  document.getElementById('compat-result-area').innerHTML=result;
  // AI鑑定ボタンのイベント
  setTimeout(function(){
    var btn=document.getElementById('compat-ai-btn');
    if(btn)btn.onclick=function(){runCompatAI();};
  },50);
}

function buildCompatResult(G1,G2,n1,n2){
  var now=new Date(),cy=now.getFullYear(),cm=now.getMonth()+1;

  // 固定相性（一生）: 相手の年月日支が自分の六花人で何運気か
  function fixedCompat(myG,theirG){
    return {
      nen:getJuniUnki(myG.ht,theirG.nenShi),
      tsu:getJuniUnki(myG.ht,theirG.tsuShi),
      nichi:getJuniUnki(myG.ht,theirG.nichiShi)
    };
  }

  // スコア計算
  function juScore(ju){
    var w=JUNI_WAVE[ju]||0;
    return w>=4?2:w>=2?1:w>=-2?0:-1;
  }
  function totalScore(fc){
    return juScore(fc.nen)*2+juScore(fc.tsu)+juScore(fc.nichi);
  }
  function scoreLabel(s){
    if(s>=4)return {mark:'◎',label:'相性抜群',bg:'rgba(30,120,60,0.12)',col:'#1a6b3a'};
    if(s>=2)return {mark:'○',label:'良　好',bg:'rgba(42,92,168,0.1)',col:'#2a5ca8'};
    if(s>=0)return {mark:'△',label:'普　通',bg:'rgba(184,134,11,0.1)',col:'#8a6800'};
    return {mark:'▲',label:'要注意',bg:'rgba(192,57,43,0.1)',col:'#c0392b'};
  }

  // fc1 = G2（n2）の支 → G1（n1）に与える運気
  // fc2 = G1（n1）の支 → G2（n2）に与える運気
  var fc1=fixedCompat(G1,G2);
  var fc2=fixedCompat(G2,G1);
  var s1=totalScore(fc1),s2=totalScore(fc2);
  var l1=scoreLabel(s1),l2=scoreLabel(s2);
  var overall=scoreLabel(Math.round((s1+s2)/2));
  var u1=getCurrentUnki(G1),u2=getCurrentUnki(G2);
  var ht1=G1.ht,ht2=G2.ht;

  function markSym(w){return w>=4?'◎':w>=2?'○':w>=-2?'△':'▲';}
  function markCol(w){return w>=4?'#1a6b3a':w>=2?'#2a5ca8':w>=-2?'#8a6800':'#c0392b';}

  var html='<div class="compat-result">';

  // ===== ヘッダー：名前・六花人・総合 =====
  html+='<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:0.5rem;align-items:center;margin-bottom:1.2rem">'
    +'<div style="text-align:center;background:var(--bg2);border-radius:10px;padding:0.8rem 0.5rem">'
    +'<div style="font-size:0.9rem;font-weight:700;color:var(--ink)">'+n1+'</div>'
    +'<div style="font-size:0.75rem;color:var(--purple);margin-top:0.3rem;font-weight:600">'+ht1+'</div>'
    +'<div style="font-size:0.65rem;color:var(--ink3);margin-top:0.2rem">自分にとっての<br>相手の運気</div>'
    +'</div>'
    +'<div style="text-align:center;padding:0 0.3rem">'
    +'<div style="font-size:0.65rem;color:var(--ink3);margin-bottom:0.3rem">総合</div>'
    +'<div style="font-size:1.8rem;color:'+overall.col+'">'+overall.mark+'</div>'
    +'<div style="font-size:0.65rem;color:'+overall.col+'">'+overall.label+'</div>'
    +'</div>'
    +'<div style="text-align:center;background:var(--bg2);border-radius:10px;padding:0.8rem 0.5rem">'
    +'<div style="font-size:0.9rem;font-weight:700;color:var(--ink)">'+n2+'</div>'
    +'<div style="font-size:0.75rem;color:var(--purple);margin-top:0.3rem;font-weight:600">'+ht2+'</div>'
    +'<div style="font-size:0.65rem;color:var(--ink3);margin-top:0.2rem">自分にとっての<br>相手の運気</div>'
    +'</div>'
    +'</div>';

  // ===== 固定相性ラベル =====
  html+='<div style="font-size:0.82rem;font-weight:700;color:var(--ink2);margin-bottom:0.3rem">◆ 固定の相性（一生変わらない）</div>';
  html+='<div style="font-size:0.7rem;color:var(--ink3);margin-bottom:0.8rem">'
    +'年支＝本質　月支＝日常　日支＝熱中・衝突時'
    +'</div>';

  // ===== 1行：左の運気 ／ 矢印2本 ／ 右の運気 =====
  // fc1.xxx = n2の支がn1に与える運気 → 左側に表示
  // fc2.xxx = n1の支がn2に与える運気 → 右側に表示
  // SVGで矢印中央にマークを乗せる関数
  // rightArrow: 左から右（→）、マークを中央に
  function svgArrow(toRight, markStr, markColor){
    var w=64,h=24,mx=w/2,my=h/2;
    var arrowColor='#bbb';
    var markFontSize=11;
    if(toRight){
      // →矢印、マーク中央上に
      return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'
        +'<line x1="4" y1="'+my+'" x2="'+(w-10)+'" y2="'+my+'" stroke="'+arrowColor+'" stroke-width="1.5" stroke-dasharray="4,3"/>'
        +'<polygon points="'+(w-10)+','+(my-4)+' '+w+','+my+' '+(w-10)+','+(my+4)+'" fill="'+markColor+'"/>'
        +'<text x="'+mx+'" y="'+(my-2)+'" text-anchor="middle" dominant-baseline="auto" font-size="'+markFontSize+'" font-weight="bold" fill="'+markColor+'">'+markStr+'</text>'
        +'</svg>';
    } else {
      // ←矢印、マーク中央上に
      return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'
        +'<line x1="10" y1="'+my+'" x2="'+(w-4)+'" y2="'+my+'" stroke="'+arrowColor+'" stroke-width="1.5" stroke-dasharray="4,3"/>'
        +'<polygon points="10,'+(my-4)+' 0,'+my+' 10,'+(my+4)+'" fill="'+markColor+'"/>'
        +'<text x="'+mx+'" y="'+(my-2)+'" text-anchor="middle" dominant-baseline="auto" font-size="'+markFontSize+'" font-weight="bold" fill="'+markColor+'">'+markStr+'</text>'
        +'</svg>';
    }
  }

  // juLeft = n1が受け取る運気（n2の支→n1）
  // juRight = n2が受け取る運気（n1の支→n2）
  function compatRow(rowLabel, juLeft, juRight, isFirst){
    var wL=JUNI_WAVE[juLeft]||0, wR=JUNI_WAVE[juRight]||0;
    var cL=getJuniColor(juLeft), cR=getJuniColor(juRight);
    var mL=markSym(wL), mR=markSym(wR);
    var mcL=markCol(wL), mcR=markCol(wR);
    var rowBg=rowLabel.indexOf('本質')>=0?'rgba(184,134,11,0.06)':rowLabel.indexOf('日常')>=0?'rgba(42,92,168,0.04)':'rgba(30,120,60,0.04)';
    // 上段：n2→n1（右向き→、まことが受け取る）
    // 下段：n1→n2（左向き←、えいこが受け取る）
    return '<div style="background:'+rowBg+';border-radius:10px;padding:0.7rem 0.6rem;margin-bottom:0.5rem">'
      +'<div style="font-size:0.68rem;color:var(--ink3);text-align:center;margin-bottom:0.5rem;font-weight:600">'+rowLabel+'</div>'
      +'<div style="display:grid;grid-template-columns:1fr 68px 1fr;align-items:center;gap:0.2rem">'
      // 左：n1が受け取る運気
      +'<div style="text-align:center">'
      +(isFirst?'<div style="font-size:0.62rem;color:var(--ink3);margin-bottom:0.25rem">自分にとっての<br>相手の運気</div>':'')
      +'<div style="font-family:\'Zen Old Mincho\',serif;font-size:1.35rem;font-weight:700;color:'+cL+'">'+juLeft+'</div>'
      +'</div>'
      // 中央：矢印2本（上→、下←）
      +'<div style="display:flex;flex-direction:column;align-items:center;gap:1px">'
      +svgArrow(false, mL, mcL)
      +svgArrow(true, mR, mcR)
      +'</div>'
      // 右：n2が受け取る運気
      +'<div style="text-align:center">'
      +(isFirst?'<div style="font-size:0.62rem;color:var(--ink3);margin-bottom:0.25rem">自分にとっての<br>相手の運気</div>':'')
      +'<div style="font-family:\'Zen Old Mincho\',serif;font-size:1.35rem;font-weight:700;color:'+cR+'">'+juRight+'</div>'
      +'</div>'
      +'</div>'
      +'</div>';
  }

  html+=compatRow('年支（本質）', fc1.nen, fc2.nen, true);
  html+=compatRow('月支（日常）', fc1.tsu, fc2.tsu, false);
  html+=compatRow('日支（衝突時）', fc1.nichi, fc2.nichi, false);

  // ===== 今の変動運気 =====
  html+='<div class="compat-now-section">'
    +'<div style="font-size:0.8rem;font-weight:700;color:var(--ink2);margin-bottom:0.5rem">今の運気状況（変動）</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem">'
    +nowChip(n1,u1)
    +nowChip(n2,u2)
    +'</div></div>';

  // AI鑑定ボタン
  html+='<div class="ai-compat-area">'
    +'<div id="compat-ai-loading" style="display:none;font-style:italic;font-size:0.82rem;color:var(--ink3);padding:0.5rem">🌸 鑑定中<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>'
    +'<div id="compat-ai-result" style="font-size:0.82rem;line-height:1.8;color:var(--ink2);white-space:pre-wrap"></div>'
    +'<button class="btn-primary" id="compat-ai-btn" style="margin-top:0.5rem">🔮 AIに詳しく鑑定してもらう</button>'
    +'</div>';

  html+='</div>';
  return html;
}

function nowChip(name,u){
  var c=getJuniColor(u.dayJu);
  return '<div style="background:#fff;border-radius:6px;padding:0.5rem 0.6rem;border:1px solid rgba(184,134,11,0.15)">'
    +'<div style="font-size:0.65rem;color:var(--ink3);margin-bottom:0.2rem">'+name+'</div>'
    +'<div style="font-size:0.72rem;color:var(--ink2)">今年 <span style="color:'+getJuniColor(u.yrJu)+';font-weight:700">'+u.yrJu+'</span></div>'
    +'<div style="font-size:0.72rem;color:var(--ink2)">大運 <span style="color:'+getJuniColor(u.daiJu)+';font-weight:700">'+u.daiJu+'</span>（'+u.currDaiun.ks+'）</div>'
    +'</div>';
}

async function runCompatAI(){
  if(!compatG1||!compatG2)return;
  var btn=document.getElementById('compat-ai-btn');
  var loading=document.getElementById('compat-ai-loading');
  var result=document.getElementById('compat-ai-result');
  if(btn)btn.style.display='none';
  if(loading)loading.style.display='block';

  var u1=getCurrentUnki(compatG1),u2=getCurrentUnki(compatG2);
  function fixedText(myG,theirG,myN,theirN){
    return '【'+theirN+'の命式が'+myN+'に与える固定の運気】\n'
      +'相手年支→自分：'+getJuniUnki(myG.ht,theirG.nenShi)+' （長期の根源的影響）\n'
      +'相手月支→自分：'+getJuniUnki(myG.ht,theirG.tsuShi)+' （社会的・日常的影響）\n'
      +'相手日支→自分：'+getJuniUnki(myG.ht,theirG.nichiShi)+' （深層・本能的影響）';
  }
  var now=new Date(),cy=now.getFullYear(),cm=now.getMonth()+1;
  var prompt=
    '【2人の相性鑑定依頼】\n\n'
    +'【年月日支の読み方（必ず守ること）】\n'
    +'・年支の相性＝本質・根源的な相性。ここが悪いと根本的に合わない。一方通行または双方向に悪影響が出る。最も重要。\n'
    +'・月支の相性＝普段の日常的な付き合いの中で出る相性。\n'
    +'・日支の相性＝何かに熱中した時・話し合い・喧嘩した時に出てくる相性。\n'
    +'必ず年支→月支→日支の順に重みをつけて解説すること。データに忠実に、良い面も悪い面も正直に伝えること。\n\n'
    +'1人目: '+compatN1+'（'+compatG1.ht+'・'+compatG1.y+'年生）\n'
    +'2人目: '+compatN2+'（'+compatG2.ht+'・'+compatG2.y+'年生）\n\n'
    +fixedText(compatG1,compatG2,compatN1,compatN2)+'\n\n'
    +fixedText(compatG2,compatG1,compatN2,compatN1)+'\n\n'
    +'【'+compatN1+'の今の状態】年運:'+u1.yrJu+' 大運:'+u1.daiJu+'（'+u1.currDaiun.ks+'） 今日:'+u1.dayJu+'\n'
    +'【'+compatN2+'の今の状態】年運:'+u2.yrJu+' 大運:'+u2.daiJu+'（'+u2.currDaiun.ks+'） 今日:'+u2.dayJu+'\n\n'
    +'上記を踏まえて: ①一生通じての2人の相性の本質 ②今この時期に2人がどう向き合うべきか ③もし恋愛・結婚を考えるなら最適なタイミング をアドバイスしてください。Markdown禁止。親しみやすい日本語で400〜600文字。';

  // 通常AIと同じKBを使ってシステムプロンプトを構築
  var starKey=KB['星人']?'星人':(KB['花人']?'花人':null);
  var juniInfo=Object.keys(KB['十二運気']||{}).map(function(k){
    var v=KB['十二運気'][k];
    return k+'：'+(v['説明']||'')+(v['独自解釈']?' '+v['独自解釈']:'');
  }).join('\n');
  var standardKeys=['_meta','星人','花人','十二運気','転化天蛹','十二大従星','大運','使い方ガイド'];
  var customInfo=Object.keys(KB).filter(function(k){return standardKeys.indexOf(k)<0;}).map(function(k){
    var v=KB[k];if(typeof v!=='object')return '【'+k+'】'+v;
    return '【'+k+'】'+Object.keys(v).map(function(name){
      var data=v[name];
      if(typeof data==='object')return name+'('+Object.keys(data).map(function(fk){return fk+':'+data[fk];}).join(',')+')';
      return name+':'+data;
    }).join(' / ');
  }).join('\n');
  var daiInfo=KB['転化天蛹']
    ?'【転化天蛹とは】大運干支がその人の転化天蛹の対象支にあたる10年間。命式の干支が転化天蛹の支でも転化天蛹ではない。'+(KB['転化天蛹']['説明']||'')+' 過ごし方：'+(KB['転化天蛹']['過ごし方']||'')
    :'';
  var sysPrompt='あなたは花人占術AIです。2人の命式データを使って相性鑑定を行います。\n\n'
    +'【知識ベース（通常のAI相談と同じデータ）】\n'
    +'【十二運気】\n'+juniInfo+'\n\n'
    +daiInfo+'\n\n'
    +(customInfo?'【追加知識】\n'+customInfo+'\n\n':'')
    +'【絶対守ること】干支の漢字を回答に出さない。Markdown禁止。親しみやすい日本語。';
  try{
    var res=await fetch(WORKER_BASE+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:sysPrompt,messages:[{role:'user',content:prompt}]})});
    var data=await res.json();
    var text='';
    if(data.content)text=data.content.map(function(b){return b.text||'';}).join('');
    if(loading)loading.style.display='none';
    if(result)result.textContent=text;
  }catch(e){
    if(loading)loading.style.display='none';
    if(result)result.textContent='通信エラーが発生しました。';
    if(btn){btn.style.display='block';btn.textContent='🔮 再試行';}
  }
}
</script>
<script>
// ============================================================

var currentAudio=null;
var recognition=null;
var micActive=false;

function getVoiceGender(){
  var sel=document.getElementById('ai-voice-gender');
  return sel?sel.value:'female';
}

async function speakText(text,btn){
  // 再生中なら停止
  if(currentAudio&&!currentAudio.paused){
    currentAudio.pause();currentAudio=null;
    if(btn)btn.textContent='🔊';
    return;
  }
  if(!text)return;
  // 干支漢字を読み仮名に
  var t=text;
  [['風花人','ふうかじん'],['天花人','てんかじん'],['水花人','すいかじん'],['白花人','はくかじん'],['離花人','りかじん'],['仙花人','せんかじん'],
   ['開花','かいか'],['豊穣','ほうじょう'],['青葉','あおば'],['発芽','はつが'],['穂分','ほわけ'],['平凪','ひらなぎ'],
   ['成天','せいてん'],['内省','ないせい'],['狂咲','くるいざき'],['引寒','いんかん'],['休眠','きゅうみん'],['残雪','ざんせつ'],
   ['転化天蛹','てんかてんよう'],['大運','だいうん'],['命式','めいしき'],['六花人','ろっかじん'],['納音','ないん']
  ].forEach(function(p){while(t.indexOf(p[0])>=0)t=t.replace(p[0],p[1]);});
  if(btn){btn.textContent='⏳';btn.disabled=true;}
  try{
    var res=await fetch(WORKER_BASE+'/api/tts',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:t,gender:getVoiceGender()})
    });
    var data=await res.json();
    if(!data.audioContent)throw new Error('音声データなし');
    var audio=new Audio('data:audio/mp3;base64,'+data.audioContent);
    currentAudio=audio;
    audio.onplay=function(){if(btn){btn.textContent='⏹';btn.disabled=false;}};
    audio.onended=function(){if(btn)btn.textContent='🔊';currentAudio=null;};
    audio.onerror=function(){if(btn){btn.textContent='🔊';btn.disabled=false;}currentAudio=null;};
    await audio.play();
  }catch(e){
    if(btn){btn.textContent='🔊';btn.disabled=false;}
  }
}

function addAIMessageWithSpeak(role,text){
  var msgs=document.getElementById('ai-messages');
  if(!msgs)return;
  var wrap=document.createElement('div');
  var div=document.createElement('div');
  div.className='ai-msg '+role;
  div.textContent=text;
  wrap.appendChild(div);
  if(role==='ai'){
    var speakBtn=document.createElement('button');
    speakBtn.textContent='🔊';
    speakBtn.style.cssText='font-size:0.7rem;padding:2px 8px;background:var(--bg2);border:1px solid rgba(184,134,11,0.3);border-radius:10px;cursor:pointer;color:var(--ink3);margin-top:3px;display:block';
    speakBtn.onclick=function(){speakText(text,speakBtn);};
    wrap.appendChild(speakBtn);
  }
  msgs.appendChild(wrap);
  msgs.scrollTop=msgs.scrollHeight;
}

function toggleMic(){
  var btn=document.getElementById('ai-mic-btn');
  if(micActive){
    if(recognition)recognition.stop();
    micActive=false;
    if(btn){btn.textContent='🎤';btn.style.color='var(--gold)';}
    return;
  }
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('このブラウザは音声入力に対応していません');return;}
  recognition=new SR();
  recognition.lang='ja-JP';
  recognition.interimResults=false;
  recognition.onresult=function(e){
    var transcript=e.results[0][0].transcript;
    var inp=document.getElementById('ai-input');
    if(inp)inp.value=transcript;
    micActive=false;
    if(btn){btn.textContent='🎤';btn.style.color='var(--gold)';}
    sendAI();
  };
  recognition.onerror=function(){
    micActive=false;
    if(btn){btn.textContent='🎤';btn.style.color='var(--gold)';}
  };
  recognition.onend=function(){
    micActive=false;
    if(btn){btn.textContent='🎤';btn.style.color='var(--gold)';}
  };
  recognition.start();
  micActive=true;
  if(btn){btn.textContent='🔴';btn.style.color='#c0392b';}
}

function addAIMessage(role,text){
  addAIMessageWithSpeak(role,text);
}

  if(!inp)return;
  var msg=inp.value.trim();
  if(!msg)return;
  inp.value='';

  // メッセージをキャプチャしてからDOM操作
  var userMsg=msg;
  aiHistory.push({role:'user',content:userMsg});

  // ローディング表示（IDで毎回取得）
  function getMsgs(){return document.getElementById('ai-messages');}
  var userDiv=document.createElement('div');
  userDiv.className='ai-msg user';
  userDiv.textContent=userMsg;
  var m=getMsgs();if(m){m.appendChild(userDiv);m.scrollTop=m.scrollHeight;}

  var loadId='load-'+Date.now();
  var loadDiv=document.createElement('div');
  loadDiv.className='ai-msg loading';
  loadDiv.id=loadId;
  loadDiv.innerHTML='🌸 鑑定中<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
  m=getMsgs();if(m){m.appendChild(loadDiv);m.scrollTop=m.scrollHeight;}

  try{
    var res=await fetch(WORKER_BASE+'/api/chat',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({system:AI_PAGE_SYS,messages:aiHistory.slice(-10)})
    });

    // ローディング削除（IDで再取得）
    var ld=document.getElementById(loadId);
    if(ld&&ld.parentNode)ld.parentNode.removeChild(ld);

    if(!res.ok){
      var errBody=await res.text().catch(function(){return 'no body';});
      addAIMessage('ai','⚠ サーバーエラー('+res.status+'): '+errBody.slice(0,100));
      return;
    }
    var data=await res.json();
    var text='';
    if(data.content)text=data.content.map(function(b){return b.text||'';}).join('');
    if(!text&&data.error)text='⚠ Worker: '+data.error;
    if(!text)text='⚠ 返答が空でした。('+JSON.stringify(data).slice(0,80)+')';
    addAIMessage('ai',text);
    aiHistory.push({role:'assistant',content:text});
    updateProfileFromChat(userMsg,text);
    if(data.remaining!==undefined){
      var m2=getMsgs();
      if(m2){var cnt=document.createElement('div');cnt.style.cssText='font-size:0.65rem;color:var(--ink3);text-align:right;padding:0 0.8rem 0.3rem';cnt.textContent='残り'+data.remaining+'回';m2.appendChild(cnt);}
    }
  }catch(e){
    var ld2=document.getElementById(loadId);
    if(ld2&&ld2.parentNode)ld2.parentNode.removeChild(ld2);
    addAIMessage('ai','⚠ 通信エラー: '+e.message);
  }
}

// プロファイル更新（会話履歴の蓄積）
async function updateProfileFromChat(userMsg,aiReply){
  var data=S.load();if(!data)return;
  var prof;
  if(currentMemberIdx===0){
    if(!data.account._profile)data.account._profile={personality:[],concerns:[],preferences:[],lifestage:'',history:[]};
    prof=data.account._profile;
  } else {
    var p=data.people[currentMemberIdx-1];
    if(!p)return;
    if(!p._profile)p._profile={personality:[],concerns:[],preferences:[],lifestage:'',history:[]};
    prof=p._profile;
  }
  try{
    var prompt='以下の会話からユーザーの特徴をJSON形式のみで返してください。\nユーザー:'+userMsg+'\nAI:'+aiReply.slice(0,200)+'\n既存:'+JSON.stringify({personality:prof.personality,concerns:prof.concerns,lifestage:prof.lifestage})+'\n{"personality":[],"concerns":[],"preferences":[],"lifestage":"","summary":"20字以内","keywords":[],"changed":true}\nchangedは新情報があればtrue。JSONのみ返答。';
    var res=await fetch(WORKER_BASE+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:'JSONのみ返答。',messages:[{role:'user',content:prompt}]})});
    if(!res.ok)return;
    var dat=await res.json();
    var txt=dat.content?dat.content.map(function(b){return b.text||'';}).join('').trim():'';
    txt=txt.replace(/```json|```/g,'').trim();
    var ex=JSON.parse(txt);if(!ex.changed)return;
    function mergeArr(e,n,max){var m=e.slice();(n||[]).forEach(function(item){if(item&&m.indexOf(item)<0)m.push(item);});return m.slice(-max);}
    prof.personality=mergeArr(prof.personality,ex.personality,8);
    prof.concerns=mergeArr(prof.concerns,ex.concerns,5);
    prof.preferences=mergeArr(prof.preferences,ex.preferences,8);
    if(ex.lifestage)prof.lifestage=ex.lifestage;
    if(ex.summary){var today=new Date(),ds=today.getFullYear()+'/'+(today.getMonth()+1)+'/'+today.getDate();if(!prof.history)prof.history=[];prof.history.push({date:ds,summary:ex.summary,keywords:ex.keywords||[]});if(prof.history.length>20)prof.history=prof.history.slice(-20);}
    S.save(data);
  }catch(e){}
}
</script>
<script>
// ============================================================
// SETTING PAGE
// ============================================================
function buildSettingPage(){
  var data=S.load();if(!data)return '<div class="page active"></div>';
  var theme=(data.settings&&data.settings.theme)||'default';
  var prof=data.account._profile||{};

  var html='<div class="page active">';

  // アカウント情報
  html+='<div class="setting-section"><h3>アカウント</h3>'
    +'<div class="setting-row"><label>ニックネーム</label><span style="font-size:0.88rem;color:var(--ink2)">'+data.account.nickname+'</span></div>'
    +'<div class="setting-row"><label>生年月日</label><span style="font-size:0.88rem;color:var(--ink2)">'+data.account.birthday.y+'年'+data.account.birthday.m+'月'+data.account.birthday.d+'日</span></div>'
    +'<div class="setting-row"><label>性別</label><span style="font-size:0.88rem;color:var(--ink2)">'+data.account.gender+'</span></div>'
    +'</div>';

  // テーマ
  var petalsOn=(data.settings&&data.settings.petals!==false);
  html+='<div class="setting-section"><h3>テーマ・演出</h3>'
    +'<div class="setting-row"><label>カラーモード</label>'
    +'<div class="theme-btns">'
    +'<button class="theme-btn'+(theme==='default'?' active':'')+'" onclick="setTheme(\'default\')">通常</button>'
    +'<button class="theme-btn'+(theme==='gold'?' active':'')+'" onclick="setTheme(\'gold\')">ゴールド</button>'
    +'<button class="theme-btn'+(theme==='dark'?' active':'')+'" onclick="setTheme(\'dark\')">ダーク</button>'
    +'</div></div>'
    +'<div class="setting-row"><label>花びら演出</label>'
    +'<div class="theme-btns">'
    +'<button class="theme-btn'+(petalsOn?' active':'')+'" onclick="setPetals(true)">オン</button>'
    +'<button class="theme-btn'+(!petalsOn?' active':'')+'" onclick="setPetals(false)">オフ</button>'
    +'</div></div>'
    +'</div>';

  // AI会話履歴
  html+='<div class="setting-section"><h3>AI会話の記録（'+data.account.nickname+'）</h3>';
  var hist=(prof.history||[]).slice().reverse();
  if(hist.length===0){
    html+='<p style="font-size:0.8rem;color:var(--ink3)">まだ会話の記録がありません</p>';
  } else {
    html+='<div class="history-list">';
    hist.forEach(function(h){
      html+='<div class="history-item"><div class="hi-date">'+h.date+'</div>'+h.summary+'</div>';
    });
    html+='</div>';
  }
  if(hist.length>0){
    html+='<button class="btn-secondary btn-danger" style="margin-top:0.8rem;width:auto;padding:5px 14px;font-size:0.78rem" onclick="clearHistory()">履歴を削除</button>';
  }
  html+='</div>';

  // 登録メンバー一覧
  if(data.people&&data.people.length>0){
    html+='<div class="setting-section"><h3>登録メンバー</h3>';
    data.people.forEach(function(p,i){
      html+='<div class="setting-row"><label>'+p.nickname+'（'+p.relation+'）</label>'
        +'<button style="font-size:0.72rem;padding:3px 10px;border:1px solid rgba(184,134,11,0.3);border-radius:8px;background:var(--bg2);cursor:pointer" onclick="openMemberModal('+(i+1)+')">編集</button>'
        +'</div>';
    });
    html+='</div>';
  }

  // データリセット
  html+='<div class="setting-section"><h3>データ管理</h3>'
    +'<button class="btn-secondary btn-danger" style="width:auto;padding:6px 16px;font-size:0.82rem" onclick="resetAllData()">すべてのデータを削除</button>'
    +'<p style="font-size:0.72rem;color:var(--ink3);margin-top:0.5rem">削除後は再登録が必要です</p>'
    +'</div>';

  html+='</div>';
  return html;
}

function setTheme(theme){
  var data=S.load();if(!data)return;
  if(!data.settings)data.settings={};
  data.settings.theme=theme;
  S.save(data);
  applyTheme(theme);
  renderCurrentPage();
}
function applyTheme(theme){
  document.body.className=theme==='dark'?'theme-dark':theme==='gold'?'theme-gold':'';
}
function setPetals(on){
  var data=S.load();if(!data)return;
  if(!data.settings)data.settings={};
  data.settings.petals=on;
  S.save(data);
  if(on)startPetals();else stopPetals();
  renderCurrentPage();
}
function clearHistory(){
  if(!confirm('会話の記録を削除しますか？'))return;
  var data=S.load();if(!data)return;
  if(data.account._profile)data.account._profile.history=[];
  S.save(data);
  renderCurrentPage();
}
function resetAllData(){
  if(!confirm('すべてのデータを削除しますか？この操作は取り消せません。'))return;
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}
</script>
<script>

// ============================================================
// 花びら演出（indexと同じCanvasベース）
// ============================================================
var petalAnim=null,petalActive=false;
var petalCanvas=null,ctx=null,petals2=[];
var wind={strength:0,target:0,timer:0};

function initPetalCanvas(){
  petalCanvas=document.getElementById('petalCanvas');
  if(!petalCanvas)return false;
  ctx=petalCanvas.getContext('2d');
  petalCanvas.width=window.innerWidth;
  petalCanvas.height=window.innerHeight;
  return true;
}
window.addEventListener('resize',function(){
  if(petalCanvas){petalCanvas.width=window.innerWidth;petalCanvas.height=window.innerHeight;}
});

var PETAL_COLORS=[
  ['#ffb7c5','#ff6b8a'],['#ffc8d4','#ff85a1'],['#b8e8b8','#5cbd5c'],
  ['#fff0a0','#ffd020'],['#d4a0ff','#9040ff'],['#a0d4ff','#40a0ff'],
  ['#ffc090','#ff7830'],['#ff90b0','#ff3070'],['#c0a0ff','#7040ff'],
  ['#a0ffcc','#20c060'],['#ffb080','#ff6020'],['#80c8ff','#2080e0']
];

function updateWind(){
  wind.timer--;
  if(wind.timer<=0){
    var r=Math.random();
    if(r<0.5){wind.target=(Math.random()-0.5)*1.5;wind.timer=60+Math.random()*120;}
    else if(r<0.8){wind.target=(Math.random()-0.3)*3.0;wind.timer=40+Math.random()*80;}
    else{wind.target=(Math.random()>0.5?1:-1)*(2.5+Math.random()*3.0);wind.timer=20+Math.random()*40;}
  }
  wind.strength+=(wind.target-wind.strength)*0.02;
}

function createPetal(){
  var cp=PETAL_COLORS[Math.floor(Math.random()*PETAL_COLORS.length)];
  var depth=Math.random(),sz=6+depth*18,shape=Math.floor(Math.random()*8);
  var sx=Math.random()*petalCanvas.width;
  if(wind.strength>2.0)sx=-sz;else if(wind.strength<-2.0)sx=petalCanvas.width+sz;
  return{x:sx,y:-sz*2,size:sz,depth:depth,shape:shape,
    speedY:(0.2+depth*0.8)+Math.random()*0.4,speedX:(Math.random()-0.5)*0.4,
    rotation:Math.random()*Math.PI*2,rotSpeed:(Math.random()-0.5)*0.02,
    sway:Math.random()*Math.PI*2,swaySpeed:0.004+Math.random()*0.008,
    swayAmt:0.5+depth*2.5,color:cp[0],colorDark:cp[1],
    opacity:0.3+depth*0.55,flip:Math.random()*Math.PI*2,
    flipSpeed:(Math.random()>0.5?1:-1)*(0.008+depth*0.02),
    windResponse:0.3+Math.random()*0.7};
}

function drawPetal(p){
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rotation);
  var fs=Math.cos(p.flip);ctx.scale(fs,1);var s=p.size;
  ctx.beginPath();
  switch(p.shape){
    case 0:ctx.moveTo(0,s*0.75);ctx.bezierCurveTo(-s*0.1,s*0.3,-s*0.85,s*0.05,-s*0.65,-s*0.45);ctx.bezierCurveTo(-s*0.45,-s*0.95,s*0.45,-s*0.95,s*0.65,-s*0.45);ctx.bezierCurveTo(s*0.85,s*0.05,s*0.1,s*0.3,0,s*0.75);break;
    case 1:ctx.moveTo(0,s*0.95);ctx.bezierCurveTo(-s*0.08,s*0.5,-s*0.38,-s*0.1,-s*0.32,-s*0.6);ctx.bezierCurveTo(-s*0.22,-s*1.0,s*0.22,-s*1.0,s*0.32,-s*0.6);ctx.bezierCurveTo(s*0.38,-s*0.1,s*0.08,s*0.5,0,s*0.95);break;
    case 2:ctx.moveTo(0,s*0.85);ctx.bezierCurveTo(-s*0.06,s*0.4,-s*0.42,s*0.05,-s*0.38,-s*0.5);ctx.bezierCurveTo(-s*0.28,-s*0.95,s*0.28,-s*0.95,s*0.38,-s*0.5);ctx.bezierCurveTo(s*0.42,s*0.05,s*0.06,s*0.4,0,s*0.85);break;
    case 3:ctx.moveTo(0,s*0.7);ctx.bezierCurveTo(-s*0.25,s*0.4,-s*0.8,s*0.15,-s*0.72,-s*0.35);ctx.bezierCurveTo(-s*0.55,-s*0.88,s*0.55,-s*0.88,s*0.72,-s*0.35);ctx.bezierCurveTo(s*0.8,s*0.15,s*0.25,s*0.4,0,s*0.7);break;
    case 4:ctx.moveTo(0,s*0.8);ctx.bezierCurveTo(-s*0.08,s*0.3,-s*0.75,s*0.0,-s*0.6,-s*0.4);ctx.bezierCurveTo(-s*0.45,-s*0.75,-s*0.18,-s*0.85,0,-s*0.7);ctx.bezierCurveTo(s*0.05,-s*0.78,s*0.0,-s*0.9,s*0.12,-s*0.88);ctx.bezierCurveTo(s*0.22,-s*0.82,s*0.15,-s*0.72,s*0.2,-s*0.65);ctx.bezierCurveTo(s*0.45,-s*0.7,s*0.65,-s*0.35,s*0.6,-s*0.4);ctx.bezierCurveTo(s*0.75,s*0.0,s*0.08,s*0.3,0,s*0.8);break;
    case 5:ctx.moveTo(0,s*0.6);ctx.bezierCurveTo(-s*0.3,s*0.3,-s*0.82,s*0.05,-s*0.75,-s*0.42);ctx.bezierCurveTo(-s*0.62,-s*0.88,-s*0.1,-s*1.0,s*0.0,-s*0.95);ctx.bezierCurveTo(s*0.1,-s*1.0,s*0.62,-s*0.88,s*0.75,-s*0.42);ctx.bezierCurveTo(s*0.82,s*0.05,s*0.3,s*0.3,0,s*0.6);break;
    case 6:ctx.moveTo(0,s*0.95);ctx.bezierCurveTo(-s*0.05,s*0.45,-s*0.28,-s*0.05,-s*0.22,-s*0.65);ctx.bezierCurveTo(-s*0.14,-s*1.05,s*0.14,-s*1.05,s*0.22,-s*0.65);ctx.bezierCurveTo(s*0.28,-s*0.05,s*0.05,s*0.45,0,s*0.95);break;
    case 7:ctx.moveTo(0,s*0.8);ctx.bezierCurveTo(-s*0.05,s*0.3,-s*0.9,s*0.08,-s*0.68,-s*0.42);ctx.bezierCurveTo(-s*0.48,-s*0.88,s*0.28,-s*1.0,s*0.58,-s*0.52);ctx.bezierCurveTo(s*0.78,-s*0.02,s*0.12,s*0.32,0,s*0.8);break;
  }
  ctx.closePath();
  var grad=ctx.createRadialGradient(0,-s*0.1,s*0.05,0,s*0.1,s*1.1);
  grad.addColorStop(0,'rgba(255,255,255,0.95)');
  grad.addColorStop(0.3,p.color+'cc');
  grad.addColorStop(1,p.colorDark+'aa');
  ctx.globalAlpha=p.opacity;ctx.fillStyle=grad;ctx.fill();
  ctx.globalAlpha=p.opacity*0.3;ctx.fillStyle=p.color;
  ctx.filter='blur(2px)';ctx.fill();ctx.filter='none';
  ctx.restore();
}

function animatePetals(){
  if(!petalActive)return;
  ctx.clearRect(0,0,petalCanvas.width,petalCanvas.height);
  updateWind();
  var spawnRate=Math.abs(wind.strength)>2?0.08:0.04;
  var maxPetals=Math.abs(wind.strength)>2?40:25;
  if(Math.random()<spawnRate&&petals2.length<maxPetals)petals2.push(createPetal());
  petals2=petals2.filter(function(p){return p.y<petalCanvas.height+40&&p.x>-100&&p.x<petalCanvas.width+100;});
  petals2.sort(function(a,b){return a.depth-b.depth;});
  petals2.forEach(function(p){
    p.sway+=p.swaySpeed;
    p.x+=p.speedX+Math.sin(p.sway)*p.swayAmt+wind.strength*p.windResponse*0.4;
    p.y+=p.speedY;p.rotation+=p.rotSpeed+wind.strength*0.003;
    p.flip+=p.flipSpeed+Math.abs(wind.strength)*0.002;
    drawPetal(p);
  });
  petalAnim=requestAnimationFrame(animatePetals);
}

function startPetals(){
  if(!initPetalCanvas())return;
  if(petalActive)return;
  petalActive=true;
  petalCanvas.style.display='block';
  animatePetals();
}
function stopPetals(){
  petalActive=false;
  if(petalAnim)cancelAnimationFrame(petalAnim);
  if(ctx&&petalCanvas)ctx.clearRect(0,0,petalCanvas.width,petalCanvas.height);
  if(petalCanvas)petalCanvas.style.display='none';
  petals2=[];
}
// ============================================================
// INIT
// ============================================================
(function(){
  // セレクト初期化
  initYearSelect('reg-y',1900,2015);
  initMonthSelect('reg-m');
  initDaySelect('reg-d');
  initYearSelect('mm-y',1900,2015);
  initMonthSelect('mm-m');
  initDaySelect('mm-d');

  // テーマ適用
  var data=S.load();
  if(data&&data.settings&&data.settings.theme){
    applyTheme(data.settings.theme);
  }

  // PINがある場合は必ずログイン画面を表示（自動ログイン無効）
  // PINなし（旧データ）の場合のみ自動ログイン
  if(data&&data.account&&data.account.nickname&&!data.account.pin){
    try{startApp(data);}catch(e){localStorage.removeItem(STORAGE_KEY);}
  }
})();
</script>
