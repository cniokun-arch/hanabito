<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>花人占術 - Life Partner AI -</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Serif+JP:wght@300;400;600;700&family=Zen+Old+Mincho:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#fff9f6;
  --bg-grad:linear-gradient(135deg,#fff5f2 0%,#feeef0 50%,#fdf0f7 100%);
  --card:#ffffff;--card2:#fff5f6;
  --gold:#d4a373;--gold2:#b58255;
  --gold-grad:linear-gradient(135deg,#fae1dd 0%,#fec5bb 100%);
  --glow:rgba(254,197,187,0.3);
  --text:#4a3f3d;--text2:#8a7a77;
  --border:rgba(254,197,187,0.4);--border2:rgba(212,163,115,0.5);
  --r:22px;--rm:14px;
  --serif:'Zen Old Mincho','Noto Serif JP',serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);
  font-family:'Noto Serif JP',serif;line-height:1.6}
body{background-image:var(--bg-grad);background-attachment:fixed}

#errmsg{display:none;position:fixed;top:0;left:0;right:0;z-index:9999;
  background:rgba(230,100,100,0.95);color:#fff;padding:0.7rem 1rem;
  font-size:0.8rem;word-break:break-all}

.scr{display:none;opacity:0;transform:translateY(8px);transition:opacity 0.35s ease,transform 0.35s ease}
.scr.on{display:block;opacity:1;transform:translateY(0)}

/* 認証 */
#scrAuth{min-height:100vh;display:none;align-items:center;justify-content:center;padding:2rem 1.2rem}
#scrAuth.on{display:flex;opacity:1;transform:none}
.auth-wrap{width:100%;max-width:380px}
.brand{text-align:center;margin-bottom:2rem}
.brand-en{font-family:'Marcellus',serif;font-size:0.75rem;letter-spacing:0.4em;color:var(--gold2);text-transform:uppercase;margin-bottom:0.4rem}
.brand h1{font-family:var(--serif);font-size:2.2rem;font-weight:600;letter-spacing:0.25em;color:var(--gold2)}
.brand-tag{font-size:0.75rem;color:var(--text2);margin-top:0.5rem;letter-spacing:0.12em}
.glass{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:2rem 1.5rem;box-shadow:0 12px 30px rgba(254,197,187,0.2),inset 0 1px 2px rgba(255,255,255,0.8)}
.atabs{display:flex;margin-bottom:1.4rem;border-bottom:1px solid var(--border)}
.atab{flex:1;padding:0.6rem;background:none;border:none;color:var(--text2);
  font-family:'Noto Serif JP',serif;font-size:0.9rem;cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.2s;letter-spacing:0.05em}
.atab.on{color:var(--gold2);border-bottom-color:var(--gold2);font-weight:600}
.fld{margin-bottom:1.1rem}
.fld label{display:block;font-size:0.78rem;font-weight:600;color:var(--gold2);margin-bottom:0.4rem;letter-spacing:0.05em}
.fld input,.fld select{width:100%;padding:0.85rem 1rem;border:1px solid var(--border);border-radius:var(--rm);
  background:#fff;color:var(--text);font-family:'Noto Serif JP',serif;font-size:0.95rem;
  outline:none;transition:all 0.25s;box-shadow:inset 0 1px 3px rgba(0,0,0,0.03)}
.fld input:focus,.fld select:focus{border-color:var(--gold);box-shadow:0 0 10px var(--glow),inset 0 1px 3px rgba(0,0,0,0.03)}
.fld select option{background:#fff;color:var(--text)}
.date-grp{display:flex;gap:0.4rem}
.date-grp select{flex:1;padding:0.85rem 0.4rem;text-align:center}
.btn-p{width:100%;padding:1rem;background:var(--gold-grad);color:var(--text);border:none;
  border-radius:var(--rm);font-family:var(--serif);font-size:1rem;font-weight:700;cursor:pointer;
  letter-spacing:0.12em;box-shadow:0 6px 15px rgba(254,197,187,0.4);transition:all 0.25s;margin-top:0.3rem}
.btn-p:active{transform:scale(0.98)}
.btn-lnk{background:none;color:var(--text2);border:none;margin-top:1rem;font-size:0.8rem;
  text-decoration:underline;cursor:pointer;font-family:'Noto Serif JP',serif;letter-spacing:0.05em}
.aerr{font-size:0.75rem;color:#e05050;text-align:center;margin-top:0.5rem;min-height:1em}

/* ダッシュボード */
#scrDash{padding:0 0 calc(var(--safe-b) + 6rem)}
.dhead{background:linear-gradient(135deg,#fff0f2 0%,#ffe5e9 100%);
  padding:calc(var(--safe-t) + 1rem) 1.2rem 1rem;border-bottom:1px solid var(--border)}
.dhead-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem}
.dgreeting{font-family:var(--serif);font-size:1rem;color:var(--gold2);letter-spacing:0.08em;font-weight:600}
.dsetting{background:rgba(255,255,255,0.6);border:1px solid var(--border);color:var(--text2);
  border-radius:16px;padding:0.3rem 0.8rem;font-size:0.75rem;cursor:pointer;font-family:'Noto Serif JP',serif}

/* メンバータブ */
.mtabs{display:flex;gap:0.6rem;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.mtabs::-webkit-scrollbar{display:none}
.mtab{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:0.3rem;
  padding:0.5rem 0.7rem;border-radius:12px;cursor:pointer;border:2px solid transparent;
  transition:all 0.2s;background:rgba(255,255,255,0.4)}
.mtab.on{background:#fff;border-color:var(--border2);box-shadow:0 4px 10px rgba(254,197,187,0.2)}
.mtab-av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:1rem;font-family:var(--serif);font-weight:700;
  box-shadow:0 2px 6px rgba(0,0,0,0.05)}
.mtab-nm{font-size:0.68rem;color:var(--text);white-space:nowrap;font-weight:500}
.mtab-add{width:42px;height:42px;border-radius:50%;flex-shrink:0;background:#fff;
  border:2px dashed var(--border2);display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;color:var(--gold2);cursor:pointer;margin-top:2px}

.dcnt{padding:1.2rem}

/* タップ可能エリア */
.tappable{cursor:pointer;transition:all 0.25s}
.tappable:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(254,197,187,0.25)}
.tappable:active{transform:scale(0.99)}

/* ヒーローカード */
.hero{background:linear-gradient(145deg,#ffffff 0%,#fffbfb 100%);border:1px solid var(--border);
  border-radius:var(--r);padding:1.8rem 1.4rem;margin-bottom:1.2rem;
  box-shadow:0 8px 24px rgba(254,197,187,0.15)}
.hero-top{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px solid var(--border);padding-bottom:0.8rem;margin-bottom:1.2rem}
.hero-name{font-family:var(--serif);font-size:1.4rem;color:var(--gold2);font-weight:600;
  display:flex;align-items:center;gap:0.4rem}
.hero-name-hint{font-size:0.72rem;color:var(--text2);font-weight:400;font-family:'Noto Serif JP',serif}
.hero-age{font-size:0.85rem;color:var(--text2)}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.6rem}
.snode{background:var(--bg);border:1px solid var(--border);border-radius:var(--rm);padding:0.9rem 0.4rem;text-align:center}
.snode .lbl{display:block;font-size:0.68rem;color:var(--text2);margin-bottom:0.4rem;letter-spacing:0.04em}
.snode .val{font-family:var(--serif);font-size:1.05rem;color:var(--text);font-weight:700}
.snode .val.hi{color:var(--gold2)}

/* ブリッジ */
.bridge{display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;margin-bottom:1.2rem}
.blink{background:#fff;border:1px solid var(--border);border-radius:var(--rm);padding:1.1rem;
  color:var(--text);cursor:pointer;font-family:'Noto Serif JP',serif;
  transition:all 0.25s;display:flex;flex-direction:column;align-items:center;
  gap:0.4rem;text-align:center;box-shadow:0 4px 12px rgba(254,197,187,0.1)}
.blink:hover{border-color:var(--gold);background:var(--card2);transform:translateY(-2px)}
.blink:active{transform:scale(0.97)}
.blink .bi{font-size:1.6rem}
.blink .bt{font-size:0.88rem;font-weight:700;color:var(--gold2)}
.blink .bd{font-size:0.72rem;color:var(--text2)}

/* セクション */
.sec{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:1.4rem;margin-bottom:1.2rem;box-shadow:0 6px 18px rgba(254,197,187,0.1)}
.sec-ttl{font-family:var(--serif);color:var(--gold2);font-size:1.05rem;font-weight:600;
  margin-bottom:0.9rem;display:flex;align-items:center;gap:0.5rem;
  border-left:3px solid var(--gold);padding-left:0.6rem}
.tap-hint{font-size:0.7rem;font-weight:400;color:var(--text2);margin-left:auto}
.fate-txt{font-size:0.9rem;color:var(--text);line-height:1.8;text-align:justify}

/* 命式グリッド */
.mcgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.6rem}
.mcitem{background:var(--card2);border-radius:12px;padding:0.75rem 0.5rem;text-align:center;
  border:1px solid rgba(254,197,187,0.2)}
.mclbl{font-size:0.68rem;color:var(--text2);margin-bottom:0.3rem}
.mcval{font-family:var(--serif);font-size:1rem;color:var(--text);font-weight:700}

/* リフレッシュ */
.rlist{list-style:none}
.ritem{background:var(--card2);border-radius:var(--rm);padding:0.9rem 1.1rem;
  margin-bottom:0.6rem;font-size:0.88rem;display:flex;align-items:flex-start;
  gap:0.7rem;border-left:3px solid var(--border2)}
.rbadge{background:var(--gold-grad);color:var(--text);font-size:0.72rem;font-weight:600;
  padding:0.15rem 0.5rem;border-radius:6px;white-space:nowrap;margin-top:0.1rem;flex-shrink:0}
.rtxt{color:var(--text);line-height:1.5}

/* AIチャット */
.ai-room{background:#fff;border:1px solid var(--border);border-radius:var(--r);
  padding:1.3rem;margin-bottom:1.2rem;box-shadow:0 6px 18px rgba(254,197,187,0.1)}
.chat-disp{height:220px;overflow-y:auto;margin-bottom:0.9rem;padding-right:0.3rem}
.chat-disp::-webkit-scrollbar{width:4px}
.chat-disp::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.bbl{margin-bottom:0.9rem;display:flex;flex-direction:column;max-width:86%;animation:bblIn 0.35s ease forwards}
@keyframes bblIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.bbl.ai{margin-right:auto;align-items:flex-start}
.bbl.usr{margin-left:auto;align-items:flex-end}
.bbl .slbl{font-size:0.68rem;color:var(--text2);margin-bottom:0.2rem;padding:0 0.2rem}
.bbl .msg{padding:0.8rem 1rem;border-radius:var(--rm);font-size:0.88rem;line-height:1.6;text-align:justify}
.bbl.ai .msg{background:var(--card2);color:var(--text);border:1px solid var(--border);border-top-left-radius:4px}
.bbl.usr .msg{background:var(--gold-grad);color:var(--text);font-weight:600;border-top-right-radius:4px;
  box-shadow:0 4px 12px rgba(254,197,187,0.3)}
.chat-chips{display:flex;gap:0.4rem;overflow-x:auto;margin-bottom:0.8rem;scrollbar-width:none}
.chat-chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:rgba(255,255,255,0.8);border:1px solid var(--border);border-radius:18px;
  padding:0.35rem 0.8rem;font-size:0.75rem;color:var(--text);cursor:pointer;white-space:nowrap;
  font-family:'Noto Serif JP',serif;transition:0.2s}
.chip:hover{background:var(--card2);border-color:var(--gold)}
.chat-ctrl{display:flex;gap:0.5rem}
.chat-inp{flex:1;padding:0.8rem 1rem;background:#fff;border:1px solid var(--border);
  border-radius:var(--rm);color:var(--text);font-family:'Noto Serif JP',serif;
  font-size:0.9rem;outline:none}
.chat-inp:focus{border-color:var(--gold)}
.send-btn{background:var(--gold-grad);border:none;border-radius:var(--rm);width:52px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform 0.2s;flex-shrink:0;box-shadow:0 2px 6px rgba(254,197,187,0.4)}
.send-btn:active{transform:scale(0.94)}

/* 人物追加フォーム */
.add-form{background:#fff;border:1px solid var(--border);border-radius:var(--r);
  padding:1.4rem;margin-bottom:1.2rem;box-shadow:0 6px 18px rgba(254,197,187,0.1)}
.add-form h3{font-family:var(--serif);color:var(--gold2);font-size:1.05rem;font-weight:600;margin-bottom:1rem}
.add-form input,.add-form select{width:100%;padding:0.8rem 1rem;border:1px solid var(--border);
  border-radius:var(--rm);background:#fff;color:var(--text);font-family:'Noto Serif JP',serif;
  font-size:0.9rem;outline:none;margin-bottom:0.6rem}
.add-form input:focus,.add-form select:focus{border-color:var(--gold)}
.add-form select option{background:#fff;color:var(--text)}

.foot{text-align:center;padding:1.5rem 0 0.5rem;border-top:1px solid var(--border)}

/* ボトムナビ */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:9999;
  background:rgba(255,255,255,0.92);border-top:1px solid var(--border);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding-bottom:var(--safe-b);display:flex;box-shadow:0 -4px 15px rgba(0,0,0,0.03)}
.nbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:0.25rem;
  padding:0.7rem 0.4rem;background:none;border:none;color:var(--text2);
  font-family:'Noto Serif JP',serif;cursor:pointer;border-top:3px solid transparent;transition:0.2s}
.nbtn.on{border-top-color:var(--gold);color:var(--gold2);font-weight:600}
.nbtn .ni{font-size:1.4rem}
.nbtn .nl{font-size:0.65rem;letter-spacing:0.04em}

/* ローディング */
.ldsc{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;gap:1rem;background:var(--bg-grad)}
.ldfl{font-size:3rem;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:0.9}50%{transform:scale(1.15);opacity:0.6}}
.ldtx{font-family:var(--serif);font-size:1rem;color:var(--gold2);letter-spacing:0.3em;font-weight:600}

/* 詳細モーダル */
.detail-ov{display:none;position:fixed;inset:0;background:rgba(74,63,61,0.4);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  z-index:800;align-items:flex-end;justify-content:center}
.detail-ov.on{display:flex}
.detail-sh{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:520px;
  max-height:85vh;overflow-y:auto;
  padding:1.5rem 1.4rem calc(var(--safe-b) + 1.5rem)}
.detail-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 1.2rem}
.detail-ttl{font-family:var(--serif);color:var(--gold2);font-size:1.1rem;
  letter-spacing:0.12em;margin-bottom:1.2rem;text-align:center;font-weight:600}
.detail-close{position:absolute;top:1rem;right:1.2rem;background:none;border:none;
  font-size:1.4rem;color:var(--text2);cursor:pointer;line-height:1}
.detail-item{background:var(--card2);border-radius:12px;padding:1rem;
  margin-bottom:0.8rem;border:1px solid var(--border)}
.detail-item-lbl{font-size:0.72rem;color:var(--gold2);font-weight:600;
  letter-spacing:0.06em;margin-bottom:0.3rem}
.detail-item-val{font-family:var(--serif);font-size:1rem;color:var(--text);font-weight:700;margin-bottom:0.2rem}
.detail-item-txt{font-size:0.85rem;color:var(--text2);line-height:1.7}
.detail-btn{width:100%;padding:0.8rem;background:var(--gold-grad);color:var(--text);
  border:none;border-radius:var(--rm);font-family:var(--serif);font-size:0.95rem;
  font-weight:700;cursor:pointer;letter-spacing:0.1em;margin-top:0.8rem;
  box-shadow:0 4px 12px rgba(254,197,187,0.4)}
.detail-btn:active{transform:scale(0.98)}
</style>
</head>
<body>
<div id="errmsg"></div>

<!-- ローディング -->
<div id="scrLoad" class="ldsc">
  <div class="ldfl">🌸</div>
  <div class="ldtx">花人占術</div>
</div>

<!-- 認証 -->
<div id="scrAuth" class="scr">
  <div class="auth-wrap">
    <div class="brand">
      <div class="brand-en">Kajin Senshutsu</div>
      <h1>花人占術</h1>
      <div class="brand-tag">AIエターナル・ライフパートナー</div>
    </div>
    <div class="glass">
      <div class="atabs">
        <button class="atab on" id="aTab0" onclick="switchATab(0)">ログイン</button>
        <button class="atab" id="aTab1" onclick="switchATab(1)">新規登録</button>
      </div>
      <div id="aForm0">
        <div class="fld"><label>ニックネーム</label>
          <input type="text" id="lName" placeholder="例：まこと" autocomplete="off"></div>
        <div class="fld"><label>PIN（4桁）</label>
          <input type="password" id="lPin" placeholder="••••" maxlength="4" inputmode="numeric"></div>
        <button class="btn-p" onclick="doLogin()">ログイン</button>
        <div class="aerr" id="lErr"></div>
      </div>
      <div id="aForm1" style="display:none">
        <div class="fld"><label>ニックネーム</label>
          <input type="text" id="rName" placeholder="例：まこと" autocomplete="off"></div>
        <div class="fld"><label>生年月日</label>
          <div class="date-grp">
            <select id="rBdY"></select>
            <select id="rBdM"></select>
            <select id="rBdD"></select>
          </div>
        </div>
        <div class="fld"><label>性別</label>
          <select id="rGen"><option value="male">男性</option><option value="female">女性</option></select></div>
        <div class="fld"><label>趣味（AIに記憶させる）</label>
          <input type="text" id="rHobby" placeholder="例：筋トレ、料理、ドライブ"></div>
        <div class="fld"><label>PIN（4桁数字）</label>
          <input type="password" id="rPin" placeholder="••••" maxlength="4" inputmode="numeric"></div>
        <button class="btn-p" onclick="doRegister()">命式カルテを作成する</button>
        <div class="aerr" id="rErr"></div>
      </div>
    </div>
    <p style="text-align:center;font-size:0.7rem;color:var(--text2);margin-top:1.2rem;line-height:1.8">
      データはこのデバイスのみに保存されます
    </p>
  </div>
</div>

<!-- ダッシュボード -->
<div id="scrDash" class="scr">
  <div class="dhead">
    <div class="dhead-top">
      <div class="dgreeting" id="dGreet">おはようございます</div>
      <button class="dsetting" onclick="doLogout()">ログアウト</button>
    </div>
    <div class="mtabs" id="mtabs"></div>
  </div>
  <div class="dcnt">

    <!-- ヒーローカード（タップで詳細） -->
    <div class="hero tappable" onclick="showHeroDetail()">
      <div class="hero-top">
        <span class="hero-name" id="hName">---
          <span class="hero-name-hint">タップで詳細 ›</span>
        </span>
        <span class="hero-age" id="hAge"></span>
      </div>
      <div class="sgrid">
        <div class="snode"><span class="lbl">今日の運気</span><span class="val hi" id="hUnki">--</span></div>
        <div class="snode"><span class="lbl">吉凶</span><span class="val hi" id="hKikkyo">--</span></div>
        <div class="snode"><span class="lbl">六花人</span><span class="val" id="hHt" style="font-size:0.75rem">--</span></div>
      </div>
    </div>

    <!-- ブリッジ -->
    <div class="bridge">
      <div class="blink" onclick="navTo('meishiki.html')">
        <span class="bi">🌸</span><span class="bt">精密命式鑑定</span>
        <span class="bd">命式・大運・AIチャット</span>
      </div>
      <div class="blink" onclick="navTo('aisho.html')">
        <span class="bi">💞</span><span class="bt">相性守護診断</span>
        <span class="bd">二人の宿命を重ね合わせる</span>
      </div>
    </div>

    <!-- 命式（タップで詳細） -->
    <div class="sec tappable" onclick="showMeishikiDetail()">
      <div class="sec-ttl">◆ 命式 <span class="tap-hint">詳細を見る ›</span></div>
      <div class="mcgrid" id="mcgrid"></div>
    </div>

    <!-- 大運（タップで詳細） -->
    <div class="sec tappable" onclick="showDaiunDetail()">
      <div class="sec-ttl">🪐 現在の大運 <span class="tap-hint">詳細を見る ›</span></div>
      <div class="fate-txt" id="hDaiun">---</div>
    </div>

    <!-- リフレッシュ提案 -->
    <div class="sec">
      <div class="sec-ttl">🌿 今日のリフレッシュ提案</div>
      <ul class="rlist" id="rlist"></ul>

// ===== 命式計算（index.htmlと同一ロジック） =====
var JIKKAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var JUNISHI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
var ROKUJU=['甲子','乙丑','丙寅','丁卯','戊辰','己巳','庚午','辛未','壬申','癸酉','甲戌','乙亥','丙子','丁丑','戊寅','己卯','庚辰','辛巳','壬午','癸未','甲申','乙酉','丙戌','丁亥','戊子','己丑','庚寅','辛卯','壬辰','癸巳','甲午','乙未','丙申','丁酉','戊戌','己亥','庚子','辛丑','壬寅','癸卯','甲辰','乙巳','丙午','丁未','戊申','己酉','庚戌','辛亥','壬子','癸丑','甲寅','乙卯','丙辰','丁巳','戊午','己未','庚申','辛酉','壬戌','癸亥'];
var HOSHI=['天花人','天花人','天花人','天花人','天花人','天花人','天花人','天花人','天花人','天花人','白花人','白花人','白花人','白花人','白花人','白花人','白花人','白花人','白花人','白花人','離花人','離花人','離花人','離花人','離花人','離花人','離花人','離花人','離花人','離花人','風花人','風花人','風花人','風花人','風花人','風花人','風花人','風花人','風花人','風花人','仙花人','仙花人','仙花人','仙花人','仙花人','仙花人','仙花人','仙花人','仙花人','仙花人','水花人','水花人','水花人','水花人','水花人','水花人','水花人','水花人','水花人','水花人'];
var TEISHI={'天花人＋':10,'天花人－':11,'白花人＋':8,'白花人－':9,'離花人＋':6,'離花人－':7,'風花人＋':4,'風花人－':5,'仙花人＋':2,'仙花人－':3,'水花人＋':0,'水花人－':1};
var JUNI=['発芽','青葉','開花','成天','豊穣','穂分','平凪','内省','狂咲','引寒','休眠','残雪'];
var KIKKYO={'豊穣':'大吉','穂分':'吉','発芽':'吉','青葉':'吉','開花':'中吉','平凪':'小吉','成天':'チャンス','引寒':'注意','内省':'苦難','狂咲':'試練','休眠':'変容','残雪':'変容'};
var SETSU=[978663000000,981210540000,983781120000,956191200000,957505740000,960198120000,962913780000,965636460000,968326020000,970974540000,973578000000,976134780000];
var TY=365.24219879*86400000;
function setsu(y,m){var b=SETSU[m-1],by=m<=3?2001:2000;return new Date(b+(y-by)*TY);}
function dayKS(y,m,d){var diff=Math.round((new Date(y,m-1,d)-new Date(1900,0,1))/86400000);return ROKUJU[((diff+10)%60+60)%60];}
function yearKS(y,m,d){var bd=new Date(y,m-1,d),rs=setsu(y,2),rd=new Date(rs.getFullYear(),rs.getMonth(),rs.getDate());return ROKUJU[(((bd>=rd?y:y-1)-1984)%60+60)%60];}
function monthKS(y,m,d){
  var bd=new Date(y,m-1,d),s=setsu(y,m),sd=new Date(s.getFullYear(),s.getMonth(),s.getDate());
  var mo=m,yo=y;if(bd<sd){mo--;if(mo<1){mo=12;yo--;}}
  var rs=setsu(yo,2),rd=new Date(rs.getFullYear(),rs.getMonth(),rs.getDate());
  var ry=new Date(yo,Math.max(0,mo-1),1)>=rd?yo:yo-1;
  var yk=ROKUJU[((ry-1984)%60+60)%60];
  var mb=[2,4,6,8,0][JIKKAN.indexOf(yk[0])%5];
  var mo2=(mo<=0?mo+12:mo)===1?11:(mo<=0?mo+12:mo)-2;
  return JIKKAN[(mb+mo2)%10]+JUNISHI[(2+mo2)%12];
}
function hoshi(y,m,d){
  var dk=dayKS(y,m,d),nm=HOSHI[ROKUJU.indexOf(dk)]||'天花人';
  var yk=yearKS(y,m,d),num=ROKUJU.indexOf(yk)+1;
  return nm+(num%2===1?'＋':'－');
}
function juniUnki(ht,shi){
  var base=TEISHI[ht];if(base===undefined)return '平凪';
  var idx=JUNISHI.indexOf(shi);if(idx<0)return '平凪';
  return JUNI[((idx-base)%12+12)%12];
}
function kikkyo(ju,ht){
  if(ju==='引寒')return ht&&ht.indexOf('＋')>=0?'注意':'変容';
  if(ju==='休眠'||ju==='残雪')return ht&&ht.indexOf('＋')>=0?'変容':'注意';
  return KIKKYO[ju]||'';
}
function kkColor(ju,ht){
  var k=kikkyo(ju,ht);
  if(k==='大吉')return '#d4a373';if(k==='吉')return '#5ab87a';
  if(k==='中吉')return '#7aabcc';if(k==='小吉')return '#9aaa7a';
  if(k==='チャンス')return '#d4880a';if(k==='注意')return '#c8b020';
  if(k==='苦難')return '#e05050';if(k==='試練')return '#c03030';
  if(k==='変容')return '#a070d0';return '#888';
}
function todayShi(){return yearKS(new Date().getFullYear(),1,15).slice(1);}
function calcP(bd){
  var p=bd.split('-'),y=+p[0],m=+p[1],d=+p[2];
  var ht=hoshi(y,m,d),nKS=yearKS(y,m,d),tKS=monthKS(y,m,d),niKS=dayKS(y,m,d);
  return {y:y,m:m,d:d,ht:ht,nenKS:nKS,tsuKS:tKS,nichiKS:niKS,unki:juniUnki(ht,todayShi())};
}

// ナビゲーション
function switchNav(i){
  [0,1,2,3].forEach(function(j){
    var btn=document.getElementById('nb'+j);if(btn)btn.classList.toggle('on',j===i);
  });
}
function openChatFocus(){
  switchNav(1);
  setTimeout(function(){
    var ci=document.getElementById('chatInp');if(ci)ci.focus();
    var cd=document.getElementById('chatDisp');if(cd)cd.scrollTop=9999;
  },100);
}

// navTo（URLパラメータでデータを渡す）
function navTo(url){
  var data=S.load();if(!data)return;
  var acc=data.account;
  if(!acc.birthday){window.location.href=url;return;}
  var myBd=acc.birthday.split('-');
  var myY=+myBd[0],myM=+myBd[1],myD=+myBd[2];
  var finalUrl='';
  if(url.indexOf('aisho.html')>=0){
    finalUrl='aisho.html?y='+myY+'&m='+myM+'&d='+myD;
    if(curId!=='me'){
      var p=data.people.find(function(x){return x.id===curId;});
      if(p&&p.birthday){var pb=p.birthday.split('-');finalUrl+='&y2='+pb[0]+'&m2='+pb[1]+'&d2='+pb[2];}
    }
  } else if(url.indexOf('meishiki.html')>=0){
    if(curId!=='me'){
      var p=data.people.find(function(x){return x.id===curId;});
      if(p&&p.birthday){var pb=p.birthday.split('-');finalUrl='meishiki.html?y='+pb[0]+'&m='+pb[1]+'&d='+pb[2];}
      else finalUrl='meishiki.html?y='+myY+'&m='+myM+'&d='+myD;
    } else finalUrl='meishiki.html?y='+myY+'&m='+myM+'&d='+myD;
  } else finalUrl=url+'?y='+myY+'&m='+myM+'&d='+myD;
  window.location.href=finalUrl;
}

// 人物追加
function doAddPerson(){
  var name=document.getElementById('apName').value.trim();
  var bd=getDateStr('apBdY','apBdM','apBdD');
  var rel=document.getElementById('apRel').value;
  var gen=document.getElementById('apGen').value;
  var hobby=document.getElementById('apHobby').value.trim();
  if(!name||!bd){alert('名前と生年月日は必須です');return;}
  var data=S.load();if(!data)return;
  var p={id:'p'+Date.now(),name:name,relation:rel,birthday:bd,gender:gen,hobby:hobby||''};
  data.people.push(p);S.save(data);
  document.getElementById('apName').value='';
  document.getElementById('apHobby').value='';
  initDateSel('apBdY','apBdM','apBdD');
  curId=p.id;renderDash();
}

// AIチャット
function addBubble(role,text){
  var cd=document.getElementById('chatDisp');
  var wrap=document.createElement('div');wrap.className='bbl '+role;
  wrap.innerHTML='<span class="slbl">'+(role==='ai'?'花人AIパートナー':'あなた')+'</span>'
    +'<div class="msg">'+text+'</div>';
  cd.appendChild(wrap);cd.scrollTop=cd.scrollHeight;
}
function buildChips(data){
  var chips=['今日の運気を詳しく','私の強みは？','向いている仕事は？','今年の運勢を教えて'];
  if(data&&data.people.length>0)chips.push(data.people[0].name+'との相性は？');
  document.getElementById('chatChips').innerHTML=chips.map(function(c){
    return '<div class="chip" onclick="useChip(\''+c.replace(/'/g,'')+'\')">' +c+'</div>';
  }).join('');
}
function useChip(t){document.getElementById('chatInp').value=t;sendChat();}

async function sendChat(){
  var inp=document.getElementById('chatInp');
  var q=inp.value.trim();if(!q)return;
  inp.value='';
  addBubble('usr',q);
  chatCtx.push({role:'user',content:q});
  var ld=document.createElement('div');ld.className='bbl ai';ld.id='ld';
  ld.innerHTML='<span class="slbl">花人AIパートナー</span><div class="msg" style="color:var(--text2)">鑑定中...</div>';
  document.getElementById('chatDisp').appendChild(ld);
  document.getElementById('chatDisp').scrollTop=9999;
  var data=S.load();
  var acc=data?data.account:{};
  var ctx='';
  if(acc.birthday){
    var c=calcP(acc.birthday);
    ctx='【'+acc.nickname+'さんの命式】六花人:'+c.ht+'、年柱:'+c.nenKS+'、月柱:'+c.tsuKS+'、日柱:'+c.nichiKS+'、今年の運気:'+c.unki+'('+kikkyo(c.unki,c.ht)+')';
    if(acc.hobby)ctx+='、趣味:'+acc.hobby;
  }
  if(curId!=='me'&&data){
    var p=data.people.find(function(x){return x.id===curId;});
    if(p&&p.birthday){var pc=calcP(p.birthday);ctx+='\n【現在表示中:'+p.name+'さん（'+p.relation+'）】六花人:'+pc.ht+'、今年の運気:'+pc.unki;}
  }
  if(data&&data.people.length>0){
    ctx+='\n【登録した人】'+data.people.map(function(p){
      if(!p.birthday)return p.name+'('+p.relation+')';
      var pc=calcP(p.birthday);return p.name+'('+p.relation+','+pc.ht+','+pc.unki+')';
    }).join('、');
  }
  var sys='あなたは花人占術の専属AIパートナーです。\n'+ctx
    +'\nMarkdown不可。甲乙丙丁戊己庚辛壬癸子丑寅卯辰巳午未申酉戌亥の文字を出さない。200〜400文字。温かく・具体的に・命式と運気に基づいて答える。';
  try{
    var res=await fetch('https://polished-flower-2524.cniokun.workers.dev/api/chat',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({systemPrompt:sys,messages:chatCtx.slice(-8)})
    });
    var dat=await res.json();
    var text=dat.content?dat.content.map(function(b){return b.text||'';}).join(''):'エラーが発生しました';
    text=text.replace(/^#{1,4}\s*/gm,'').replace(/\*{1,2}([^*]+)\*{1,2}/g,'$1').trim();
    var ldEl=document.getElementById('ld');if(ldEl)ldEl.remove();
    addBubble('ai',text);
    chatCtx.push({role:'assistant',content:text});
    if(data){
      data.chatHistory=data.chatHistory||[];
      data.chatHistory.push({role:'user',content:q,ts:Date.now()},{role:'ai',content:text,ts:Date.now()});
      if(data.chatHistory.length>50)data.chatHistory=data.chatHistory.slice(-50);
      S.save(data);
    }
  }catch(e){
    var ldEl=document.getElementById('ld');if(ldEl)ldEl.remove();
    addBubble('ai','通信エラーが発生しました。もう一度お試しください。');
  }
}
